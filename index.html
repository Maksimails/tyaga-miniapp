<style>
  :root{
    --bg:#000000;
    --surface:#0b0b0b;
    --surface-2:#151515;
    --surface-3:#1e1e1e;
    --line:#2a2a2a;
    --text:#ffffff;
    --text-dim:#8f8f8f;
    --text-faint:#5a5a5a;
    --invert-bg:#ffffff;
    --invert-text:#000000;
    --font-display:'Oswald', 'Arial Narrow', Impact, sans-serif; /* 2026-09-28: REVERTED — brand book v1.7 confirms Oswald Italic is the intentional highlight/heading font, Montserrat is body. The 2026-09-26 Montserrat-everywhere change was a misread of Maksim's original complaint and is undone. */
    --font-head:'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif; /* brand-book/site pass (2026-09-25): site headlines are heavy uppercase sans, not the old Fraunces serif */
    --font-body:'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif; /* brand book v1.4 (2026-09-24): Montserrat is the confirmed main sans font */
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:#050505;
    color:var(--text);
    font-family:var(--font-body);
    overflow:hidden;
    height:var(--tg-vh, 100vh);
    width:100%;
  }
  #app-root{
    display:flex;
    flex-direction:column;
    height:var(--tg-vh, 100vh);
    width:100%;
    max-width:520px;
    margin:0 auto;
    background:var(--bg);
    overflow:hidden;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }

  .rig{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:380px;width:100%;}
  .rig-label{
    font-family:var(--font-mono);
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--text-faint);
  }

  .device{
    width:100%;
    max-width:380px;
    background:var(--bg);
    border-radius:34px;
    padding:10px;
    box-shadow:0 40px 80px -30px rgba(0,0,0,.9), 0 0 0 1px #1c1c1c;
  }
  .screen{
    background:var(--bg);
    border-radius:26px;
    overflow:hidden;
    height:720px;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .tg-bar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px 6px;
    font-family:var(--font-mono);
    font-size:11px;color:var(--text-faint);
    flex-shrink:0;
  }
  .tg-bar .brand{
    color:var(--text);letter-spacing:.03em;font-weight:700;
    font-family:var(--font-display);font-style:italic;font-size:15px;text-transform:uppercase;
  }

  .view{
    flex:1;
    overflow-y:auto;
    padding:10px 20px 24px;
    scrollbar-width:none;
    animation:fade .25s ease;
  }
  .view::-webkit-scrollbar{display:none;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .eyebrow{
    font-family:var(--font-mono);
    font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--text-faint);margin:6px 0 8px;
  }
  h1{
    font-family:var(--font-head);
    font-weight:800;
    font-size:27px;
    line-height:1.08;
    letter-spacing:-.01em;
    margin:0 0 10px;
    text-wrap:balance;
    text-transform:uppercase;
  }
  h2{
    font-family:var(--font-head);
    font-weight:700;
    font-size:16px;
    text-transform:uppercase;
    letter-spacing:0;
    margin:18px 0 4px;
  }
  p.lead{color:var(--text-dim);font-size:14px;line-height:1.55;margin:0 0 18px;}
  p.hint{color:var(--text-faint);font-size:12px;line-height:1.5;margin:8px 0 0;}

  .stack{display:flex;flex-direction:column;gap:10px;}
  .row-gap{display:flex;gap:6px;flex-wrap:wrap;}

  /* buttons */
  .btn{
    font-family:var(--font-body);
    font-size:14px;font-weight:600;
    border-radius:14px;
    padding:15px 18px;
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--text);
    cursor:pointer;
    text-align:center;
    transition:opacity .15s;
  }
  .btn:active{opacity:.65;}
  .btn.primary{
    background:var(--invert-bg);
    color:var(--invert-text);
    border-color:var(--invert-bg);
  }
  .btn.primary:disabled{
    background:var(--surface-3);
    color:var(--text-faint);
    border-color:var(--line);
    cursor:not-allowed;
  }
  .btn.ghost{background:transparent;}
  .btn.small{padding:9px 14px;font-size:12.5px;border-radius:10px;}
  .btn.block{width:100%;}
  .btn:focus-visible{outline:2px solid #fff;outline-offset:2px;}

  .backbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:0 0 4px;
  }
  .back{
    font-family:var(--font-mono);
    font-size:12px;color:var(--text-dim);
    background:none;border:none;cursor:pointer;padding:6px 0;
  }
  .step{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);}

  /* cards / chips */
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px;
  }
  /* white variant, used for a stand-out row/button on an otherwise all-dark
     settings-style list (e.g. "Ещё" → Орбитальный Стор, 2026-09-28 request) */
  .card-invert{background:var(--invert-bg);color:var(--invert-text);border-color:var(--invert-bg);}

  .ff-card{border:1.5px solid var(--text);border-radius:18px;padding:14px 16px;margin:14px 0 4px;}
  .ff-tag{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;opacity:.6;}
  .ff-title{font-family:var(--font-display);font-style:italic;font-weight:900;text-transform:uppercase;font-size:19px;margin-top:4px;}
  .ff-text{font-size:13px;line-height:1.45;margin-top:6px;opacity:.85;}
  .mentor-cta{position:sticky;bottom:0;z-index:30;padding:14px 0 calc(12px + env(safe-area-inset-bottom));margin-top:10px;background:linear-gradient(to bottom, transparent, var(--bg) 35%);}
  .activate-card .tg-note{font-size:12px;opacity:.7;margin-top:10px;line-height:1.4;}

  .mh{position:relative;margin:-10px -20px 0;background:#000;color:#fff;overflow:hidden;min-height:560px}
  body.desk .mh{max-width:430px;margin:0 auto;border-radius:18px}
  .mh-top{position:absolute;top:14px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:center;z-index:5;font:500 10px/1 var(--font-mono, ui-monospace),Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55)}
  .mh-top button{all:unset;cursor:pointer;color:rgba(255,255,255,.75);letter-spacing:.14em}
  .mh-big{position:absolute;top:9%;left:0;right:0;text-align:center;font-family:var(--font-display);font-style:italic;font-weight:700;line-height:.86;text-transform:uppercase;color:#fff;z-index:1;white-space:nowrap}
  .mh-l{display:inline-block}
  .mh-cut{position:absolute;left:50%;transform:translateX(-50%);bottom:190px;height:calc(100% - 290px);max-width:none;z-index:2;
    -webkit-mask-image:linear-gradient(to bottom,#000 80%,transparent 100%);mask-image:linear-gradient(to bottom,#000 80%,transparent 100%);pointer-events:none}
  .mh-bottom{position:absolute;left:20px;right:20px;bottom:22px;z-index:4}
  .mh-lbl{font:500 10px var(--font-mono, ui-monospace),Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55)}
  .mh-line{font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin:6px 0 18px;line-height:1.35}
  .mh-cta{all:unset;box-sizing:border-box;display:flex;width:100%;height:56px;border-radius:4px;overflow:hidden;cursor:pointer}
  .mh-cta .a{flex:1;background:#fff;color:#000;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-weight:700;font-size:15px;letter-spacing:.04em}
  .mh-cta .a i{font-style:normal;font-weight:500;font-size:12px;opacity:.55}
  .mh-cta .b{width:56px;background:#FF5A1F;display:flex;align-items:center;justify-content:center;color:#000;font-size:22px;font-weight:700}
  .mh-cta:active{transform:scale(.99)}
  .mh-more{padding:22px 0 10px}
  .activate-card{
    background:var(--invert-bg);
    color:var(--invert-text);
    border-radius:16px;
    padding:18px;
    margin-top:16px;
  }
  .activate-card .tag{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;opacity:.6;}
  .activate-card h3{font-family:var(--font-head);font-size:19px;margin:6px 0 6px;}
  .activate-card p{font-size:13px;line-height:1.5;margin:0 0 14px;opacity:.85;}
  .activate-card .btn.primary{background:var(--invert-text);color:var(--invert-bg);}
  .activate-banner{
    background:var(--invert-bg);
    color:var(--invert-text);
    border-radius:14px;
    padding:14px;
    margin-bottom:14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .activate-banner .txt{font-size:13px;line-height:1.35;}
  .activate-banner .txt b{display:block;font-family:var(--font-head);font-size:15px;margin-bottom:2px;}
  .activate-banner button{
    flex:none;
    font-family:var(--font-mono);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.03em;
    background:var(--invert-text);
    color:var(--invert-bg);
    border:none;
    border-radius:10px;
    padding:10px 12px;
    cursor:pointer;
  }
  .chip{
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--text-dim);
    border-radius:16px;
    padding:7px 12px;
    font-size:12px;
    cursor:pointer;
    user-select:none;
  }
  .chip.active{background:var(--invert-bg);color:var(--invert-text);border-color:var(--invert-bg);font-weight:600;}

  input[type=text], input[type=email], input[type=tel], textarea{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:12px;
    color:var(--text);
    font-family:var(--font-body);
    font-size:14px;
    padding:13px 14px;
    resize:none;
  }
  input::placeholder, textarea::placeholder{color:var(--text-faint);}

  input[type=range]{
    -webkit-appearance:none;appearance:none;
    flex:1;height:3px;background:var(--line);border-radius:2px;outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:#fff;cursor:pointer;
    box-shadow:0 0 0 3px rgba(255,255,255,.12);
  }
  input[type=range]::-moz-range-thumb{width:17px;height:17px;border-radius:50%;background:#fff;border:none;cursor:pointer;}
  .slider-row{display:flex;align-items:center;gap:10px;margin:10px 0 2px;}
  .slider-lbl{font-family:var(--font-mono);font-size:9.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;}

  .ticket{
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px;
    margin-bottom:12px;
    cursor:pointer;
    display:flex;justify-content:space-between;align-items:center;
  }
  .ticket:active{opacity:.7;}
  .ticket .tname{font-family:var(--font-display);font-style:italic;font-size:19px;font-weight:700;}
  .ticket .tsub{color:var(--text-dim);font-size:12px;margin-top:2px;}
  .ticket .tprice{font-family:var(--font-mono);font-size:16px;font-variant-numeric:tabular-nums;}

  /* ready-mission cards (Nike-style big number) */
  .ticket2{border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;cursor:pointer;}
  .ticket2:active{opacity:.75;}
  .t2-top{display:flex;justify-content:space-between;align-items:baseline;}
  .t2-big{font-family:var(--font-display);font-style:italic;font-weight:700;font-size:30px;letter-spacing:-.01em;}
  .t2-price{font-family:var(--font-mono);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;}
  .t2-type{font-size:12.5px;color:var(--text-dim);margin-top:2px;}
  .t2-tagline{font-size:12px;color:var(--text-faint);margin-top:2px;margin-bottom:10px;}
  .t2-goal{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;}
  .t2-goal-text{font-size:12px;color:var(--text-dim);}
  .t2-edit{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);background:none;border:none;cursor:pointer;text-decoration:underline;white-space:nowrap;flex-shrink:0;}
  .t2-brand{font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);border:1px solid var(--line);padding:3px 9px;border-radius:10px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;}
  .t2-participants{font-family:var(--font-mono);font-size:13px;color:var(--text-dim);white-space:nowrap;}

  /* ticket3: mission cards redesigned to match the website reference (2026-09-26) */
  /* tk-card: brand book v1.7 "билет" — white card on the app's black background.
     Used for every mission-ticket state (proposed/active/completed); only the
     verb in .tk-verb and which of .tk-dl/.tk-rw appears changes between them. */
  .tk-card{background:#fff;color:#000;border-radius:26px;padding:20px;margin-bottom:16px;cursor:pointer;box-shadow:0 22px 48px -26px rgba(255,255,255,.22);}
  .tk-card:active{opacity:.85;}
  .tk-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .tk-tag{display:inline-flex;align-items:center;gap:7px;background:#000;color:#fff;border-radius:999px;padding:6px 13px 6px 7px;font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;}
  .tk-tag img{width:17px;height:17px;}
  .tk-status{font-family:var(--font-mono);font-size:10px;color:#777;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;}
  .tk-verb{display:flex;align-items:center;gap:.22em;font-family:var(--font-display);font-weight:700;font-style:italic;font-size:23px;letter-spacing:-.005em;text-transform:uppercase;line-height:1;margin-bottom:4px;}
  .tk-verb img{width:.78em;height:.78em;flex-shrink:0;filter:invert(1);/* source SVG is white-fill; invert to read on the white ticket card */}
  .tk-goal{font-weight:700;font-size:15.5px;margin-bottom:14px;line-height:1.3;}
  .tk-bar{height:7px;border-radius:8px;background:#e6e6e6;overflow:hidden;margin-bottom:16px;}
  .tk-bar i{display:block;height:100%;background:#000;border-radius:8px;}
  .tk-dl{margin:0 0 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;}
  .tk-dl dt{font-family:var(--font-mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:#888;margin:0;}
  .tk-dl dd{margin:2px 0 0;font-weight:700;font-size:13px;line-height:1.3;}
  .tk-rw{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
  .tk-rw div{background:#f3f3f3;border-radius:14px;padding:10px 12px;font-weight:700;font-size:12.5px;}
  .tk-rw b{display:block;font-family:var(--font-mono);font-weight:500;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:#777;margin-bottom:3px;}
  .tk-cta{background:#000;color:#fff;border-radius:999px;padding:14px;text-align:center;font-weight:800;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;}

  /* Я-щит sub-mark tag (brand book v1.5, visual pass 2026-09-25) — the
     short-form brand signal used in front of a first-person phrase, same
     usage as the website's "делаю это / сделал / иду" row. Used on every
     mission-ticket-style card (ready catalog, active on home, finished on
     profile) so all three read as one consistent brand system. */
  .ya-tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim);}
  .ya-ico{width:13px;height:13px;flex-shrink:0;opacity:.9;}

  /* ЦУЦ tabs */
  .cuc-tabs{display:flex;gap:4px;margin:16px 0 18px;border:1px solid var(--line);border-radius:14px;padding:4px;}
  .cuc-tab{flex:1;text-align:center;padding:8px 4px;border-radius:10px;font-family:var(--font-mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.02em;color:var(--text-faint);cursor:pointer;line-height:1.35;transition:background .15s,color .15s;}
  .cuc-tab.active{background:#fff;color:#000;}

  .toggle-row{
    display:flex;justify-content:space-between;align-items:center;
    border:1px solid var(--line);border-radius:14px;
    padding:13px 14px;margin-bottom:10px;
  }
  .toggle-row .t-title{font-size:13.5px;font-weight:600;}
  .toggle-row .t-desc{font-size:11.5px;color:var(--text-faint);margin-top:3px;line-height:1.4;max-width:210px;}
  .toggle-row.disabled{opacity:.4;}
  .switch{
    width:42px;height:24px;border-radius:14px;border:1px solid var(--line);
    background:var(--surface-2);position:relative;flex-shrink:0;cursor:pointer;
  }
  .switch i{
    position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
    background:var(--text-faint);transition:transform .15s, background .15s;
  }
  .switch.on{background:var(--invert-bg);border-color:var(--invert-bg);}
  .switch.on i{transform:translateX(18px);background:var(--invert-text);}

  /* Mentor picker redesign (2026-09-25, task #42): a vertical scrollable
     list of wider cards instead of a cramped horizontal strip of icon+name
     — a bigger portrait, the mentor's one-line "who it's for", and price/
     unlock status are all visible without opening the info panel; the full
     bio/energy/tone still expands via the ⓘ button into mentorInfoBox. */
  .mentor-scroll{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow-y:auto;padding-right:2px;-webkit-overflow-scrolling:touch;}
  .mentor-card{
    display:flex;align-items:flex-start;gap:12px;
    border:1px solid var(--line);border-radius:16px;
    padding:12px 14px;background:var(--surface);
    position:relative;
  }
  .mentor-card.active{border-color:#fff;background:var(--surface-3);}
  .mentor-card .mentor-body{flex:1;min-width:0;padding-right:56px;}
  .mentor-card .mname{font-size:14.5px;font-weight:800;cursor:pointer;font-family:var(--font-display);font-style:italic;letter-spacing:.01em;}
  .mentor-card .mfit{font-size:11.5px;color:var(--text-dim);margin-top:3px;line-height:1.35;cursor:pointer;}
  .mentor-card .mtag{font-family:var(--font-mono);font-size:9.5px;color:var(--text-faint);margin-top:6px;text-transform:uppercase;cursor:pointer;letter-spacing:.03em;}
  .mentor-icon{width:56px;height:56px;flex:0 0 56px;border-radius:50%;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-style:italic;font-weight:700;font-size:20px;cursor:pointer;background-size:cover;background-position:center top;position:relative;overflow:hidden;}
  .rec-badge{position:absolute;top:12px;right:14px;background:#fff;color:#000;font-family:var(--font-mono);font-size:8.5px;font-weight:700;padding:2px 5px;border-radius:8px;letter-spacing:.02em;text-transform:uppercase;}
  .mentor-info-btn{position:absolute;right:14px;bottom:12px;background:none;border:1px solid var(--line);border-radius:8px;color:var(--text-faint);font-family:var(--font-mono);font-size:9px;padding:5px 8px;cursor:pointer;text-transform:uppercase;letter-spacing:.03em;}

  /* Date-of-arrival picker redesign (task #43): a big legible readout of the
     current pick sits above the quick-preset chips and the native date
     input, instead of a bare, hard-to-read date field on its own. */
  .date-preview{font-family:var(--font-display);font-style:italic;font-weight:800;font-size:17px;text-transform:capitalize;letter-spacing:.01em;padding:10px 0 2px;}
  input[type="date"]{
    width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;color:var(--text);font-family:var(--font-mono);font-size:14px;
    color-scheme:dark;
  }
  .mentor-info-btn:active{opacity:.6;}

  /* full mentor profile */
  .mentor-profile{border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:10px;}
  .mp-head{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
  .mp-photo{width:64px;height:64px;border-radius:50%;flex-shrink:0;background:var(--surface-3);background-size:cover;background-position:center top;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-style:italic;font-weight:700;font-size:22px;}
  .mp-name{font-weight:700;font-size:16px;}
  .mp-price{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.02em;margin-top:3px;}
  .mp-intro{font-family:var(--font-display);font-style:italic;font-size:13px;color:var(--text-dim);border-left:2px solid var(--line);padding-left:10px;margin-bottom:14px;}
  .mp-row{margin-bottom:11px;}
  .mp-row:last-of-type{margin-bottom:0;}
  .mp-label{font-family:var(--font-mono);font-size:9px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);margin-bottom:3px;}
  .mp-text{font-size:12.5px;line-height:1.55;color:var(--text-dim);}

  .summary-line{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .summary-line:last-of-type{border-bottom:none;}
  .summary-line .k{color:var(--text-faint);font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;align-self:center;}
  .summary-line .v{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
  .total-line{display:flex;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid #444;font-size:16px;font-weight:700;font-family:var(--font-head);text-transform:uppercase;letter-spacing:.01em;}
  .total-line span:last-child{font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-transform:none;letter-spacing:0;}

  /* Finish-line (target_date) chip — brand-book visual pass (2026-09-25,
     item 10): replaces the raw 🏁-emoji hint line from the completion-model
     pivot with a bordered mono-label/value row matching .t2-goal/
     .summary-line, so the finish date reads as a designed UI element
     instead of a stray emoji aside. */
  .finish-chip{display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:2px 0 10px;}
  .finish-chip .fc-label{font-family:var(--font-mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);}
  .finish-chip .fc-date{font-family:var(--font-mono);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--text);}

  .cosmo-msg{
    border:1px solid var(--line);border-radius:16px;padding:16px;
    font-size:13.5px;line-height:1.6;color:var(--text);
    background:var(--surface);
  }
  .cosmo-msg .who{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}

  .cam{
    aspect-ratio:3/4;border:1px solid var(--line);border-radius:16px;
    background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;position:relative;overflow:hidden;
  }
  .cam .dot{width:10px;height:10px;border-radius:50%;background:#fff;}
  .cam.recording .dot{animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}
  .cam .timer{font-family:var(--font-mono);font-size:13px;color:var(--text-dim);}
  .cam .rec-btn{
    width:60px;height:60px;border-radius:50%;border:3px solid #fff;background:transparent;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .cam .rec-btn i{width:22px;height:22px;border-radius:50%;background:#fff;}
  .cam.recording .rec-btn i{border-radius:5px;width:18px;height:18px;}

  .script-box{
    background:var(--surface-2);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;font-size:12.5px;line-height:1.5;color:var(--text-dim);
    margin-bottom:14px;
  }
  .script-box b{color:var(--text);}

  /* bottom nav */
  .navbar{
    flex-shrink:0;
    display:flex;
    border-top:1px solid var(--line);
    background:var(--bg);
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  .navbtn{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:10px 0 14px;background:none;border:none;color:var(--text-faint);cursor:pointer;
    font-family:var(--font-mono);font-size:9.5px;letter-spacing:.03em;text-transform:uppercase;
  }
  .navbtn.active{color:#fff;}
  .navbtn svg{width:20px;height:20px;}

  /* Generic inline icon() helper — without this, a bare <svg> with only a
     viewBox (no width/height) falls back to the browser default render size
     (can be 300px+), which is exactly the "giant ring / giant bolt" glyph
     reported filling the Illuminator feed and the Profile completed-missions
     list. Every icon() call must render small and inline like a text glyph. */
  .icon{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;flex:none;vertical-align:-3px;}
  .icon svg{width:100%;height:100%;}

  /* home */
  .mission-card{
    border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer;
  }
  .mission-card .mtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .mission-card .mtitle{font-weight:700;font-size:14px;}
  .mission-card .mtype{font-family:var(--font-mono);font-size:9.5px;color:var(--text-faint);border:1px solid var(--line);padding:2px 8px;border-radius:10px;text-transform:uppercase;}
  .mission-card .mdesc{font-size:12px;color:var(--text-dim);line-height:1.4;margin:-4px 0 10px;}
  .track{height:5px;background:var(--surface-2);border-radius:4px;overflow:hidden;}
  .track i{display:block;height:100%;background:#fff;}
  .mission-meta{display:flex;justify-content:space-between;margin-top:8px;font-family:var(--font-mono);font-size:11px;color:var(--text-faint);}

  .fab{
    position:absolute;right:20px;bottom:80px;
    width:52px;height:52px;border-radius:50%;background:#fff;color:#000;
    display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:300;
    border:none;cursor:pointer;box-shadow:0 10px 24px rgba(0,0,0,.5);
  }

  /* profile */
  .avatar{
    width:52px;height:52px;border-radius:50%;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-style:italic;font-weight:700;font-size:20px;
  }
  .profile-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .trust-badge{display:flex;align-items:center;gap:6px;margin-left:auto;border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 4px;}
  .trust-badge-icon{width:26px;height:26px;border-radius:50%;background:#111;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .trust-badge-icon img{width:16px;height:16px;}
  .trust-badge-level{font-family:var(--font-mono);font-size:12.5px;font-weight:700;white-space:nowrap;}
  .stat-strip{
    display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
    border:1px solid var(--line);border-radius:16px;padding:14px 8px;
    cursor:pointer;margin-bottom:6px;
  }
  .stat-strip .cell{text-align:center;}
  .stat-strip .val{font-family:var(--font-mono);font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;}
  .stat-strip .lbl{font-size:9.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.03em;margin-top:3px;}
  .expand-hint{
    text-align:center;font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);
    margin-bottom:14px;
  }
  .type-breakdown{
    max-height:0;overflow:hidden;transition:max-height .28s ease;
  }
  .type-breakdown.open{max-height:420px;}
  .type-row{
    display:flex;justify-content:space-between;align-items:center;
    border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:12.5px;
  }
  .type-row .tn{font-weight:600;}
  .type-row .tv{font-family:var(--font-mono);color:var(--text-dim);font-size:11.5px;}
  .type-row.active{border-color:#111;background:rgba(17,17,17,.04);}
  .type-row.active .tn{font-weight:700;}
  .stat-strip3{
    display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
    border:1px solid var(--line);border-radius:16px;padding:14px 8px;
    margin-bottom:6px;
  }
  .stat-strip3 .cell,.stat-strip2 .cell{text-align:center;}
  .stat-strip3 .val,.stat-strip2 .val{font-family:var(--font-mono);font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;}
  .stat-strip3 .lbl,.stat-strip2 .lbl{font-size:9.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.03em;margin-top:3px;}
  .stat-strip2{
    display:grid;grid-template-columns:repeat(2,1fr);gap:8px;
    border:1px solid var(--line);border-radius:16px;padding:12px 8px;
    margin-bottom:14px;
  }
  /* level screen: big level badge (replaces the old full ladder list) */
  .level-hero{display:flex;flex-direction:column;align-items:center;margin:10px 0 22px;}
  .level-hero-badge{
    width:140px;height:140px;border-radius:50%;background:var(--invert-bg);color:var(--invert-text);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  }
  .level-hero-badge img{width:22px;height:22px;filter:invert(1);}
  .level-hero-num{font-family:var(--font-display);font-style:italic;font-weight:700;font-size:54px;line-height:1;}
  .level-hero-label{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim);margin-top:12px;}
  .profile-nav-row{
    display:flex;justify-content:space-between;align-items:center;
    border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;
    cursor:pointer;transition:border-color .15s ease,background .15s ease;
  }
  .profile-nav-row:active{background:rgba(17,17,17,.04);}
  .pnr-label{font-weight:600;font-size:13.5px;}
  .pnr-meta{font-family:var(--font-mono);color:var(--text-dim);font-size:12px;}
  .badge-row{display:flex;gap:8px;flex-wrap:wrap;}
  .badge{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:14px;}

  /* daily check-in entry point (home) — kept deliberately small/quiet, not a
     full banner, per 2026-09-28 feedback ("make button small on main page") */
  .checkin-chip{
    display:inline-flex;align-items:center;gap:9px;
    background:var(--surface-2);border:1px solid var(--line);border-radius:999px;
    padding:7px 14px 7px 7px;margin-bottom:14px;cursor:pointer;max-width:100%;
  }
  .checkin-chip:active{background:var(--surface-3);}
  .chip-row{display:flex;gap:8px;margin-bottom:14px}.chip-row .checkin-chip{flex:1 1 0;min-width:0;margin-bottom:0}
  .wt-chip .wt-ic{color:#000}.wt-chip .wt-ic svg{width:14px;height:14px}
  .checkin-chip .cc-icon{width:24px;height:24px;border-radius:50%;background:var(--invert-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .checkin-chip .cc-icon img{width:13px;height:13px;filter:invert(1);}
  .checkin-chip .cc-txt{display:flex;flex-direction:column;line-height:1.25;overflow:hidden;}
  .checkin-chip .cc-label{font-family:var(--font-display);font-style:italic;text-transform:uppercase;font-size:12px;font-weight:700;white-space:nowrap;}
  .checkin-chip .cc-streak{font-family:var(--font-mono);font-size:9.5px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .checkin-chip .cc-arrow{flex:none;font-family:var(--font-mono);font-size:15px;color:var(--text-faint);}
  /* white variant of .profile-nav-row for the check-in entry, per feedback
     ("make button white on profile page") — stands apart from the other rows */
  .profile-nav-row.pnr-invert{background:var(--invert-bg);border-color:var(--invert-bg);color:var(--invert-text);}
  .profile-nav-row.pnr-invert .pnr-meta{color:#666;}
  .profile-nav-row.pnr-invert:active{background:#eee;}

  /* space-road check-in screen — a compact star-map, all 15 waypoints visible
     at once on a 3×5 snake grid, connected by one smooth flight path (SVG,
     Catmull-Rom curve — see smoothPathD()). Rewards are never spelled out on
     the map itself (kept mysterious per 2026-09-28 request); only which of 3
     waypoint kinds a stop is. */
  .road-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border:1px solid var(--line);border-radius:16px;padding:14px 8px;margin-bottom:18px;}
  .road-stats .cell{text-align:center;}
  .road-stats .val{font-family:var(--font-mono);font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;}
  .road-stats .lbl{font-size:9.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.03em;margin-top:3px;}
  .road-map{position:relative;width:100%;aspect-ratio:300/260;margin-bottom:18px;}
  .road-map svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
  .road-wp{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;}
  .wp-dot{
    width:30px;height:30px;border-radius:50%;background:var(--surface);border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-faint);
    transition:transform .15s ease;
  }
  .road-wp.kind-gift .wp-dot{width:36px;height:36px;font-size:14px;}
  .road-wp.rn-done .wp-dot,.road-wp.rn-done-today .wp-dot{background:var(--invert-bg);border-color:var(--invert-bg);color:var(--invert-text);}
  .road-wp.rn-future .wp-dot{opacity:.4;}
  .road-wp.rn-claimable .wp-dot{
    border-color:var(--invert-bg);color:var(--invert-bg);
    box-shadow:0 0 0 4px rgba(255,255,255,.14),0 0 18px rgba(255,255,255,.28);
    animation:wpPulse 1.8s ease-in-out infinite;
  }
  @keyframes wpPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}
  .wp-day{font-family:var(--font-mono);font-size:8px;color:var(--text-faint);letter-spacing:.03em;}
  .road-wp.rn-claimable .wp-day{color:var(--text-dim);}
  .road-claim-bar{position:sticky;bottom:0;background:linear-gradient(to bottom, transparent, var(--bg) 30%);padding-top:16px;margin-top:-16px;}
  /* inline reward reveal (shown once, right after tapping "Выйти на связь") */
  .road-reveal{background:var(--invert-bg);color:var(--invert-text);border-radius:16px;padding:18px;text-align:center;margin-bottom:16px;}
  .road-reveal .rr-label{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#666;margin-bottom:8px;}
  .road-reveal .rr-found{font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:#888;margin-bottom:4px;}
  .road-reveal .rr-reward{font-family:var(--font-display);font-style:italic;font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.01em;}
  /* persistent check-in log ("track record") below the map */
  .road-hist-row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:9px 2px;}
  .road-hist-row:last-child{border-bottom:none;}
  .rh-day{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;flex-shrink:0;}
  .rh-reward{font-weight:600;font-size:12.5px;text-align:right;}

  /* rank ladder */
  .rank-ladder{display:flex;align-items:flex-start;margin:16px 0 6px;}
  .rl-step{flex:1;text-align:center;position:relative;}
  .rl-step:not(:first-child)::before{
    content:'';position:absolute;top:5px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0;
  }
  .rl-step.done:not(:first-child)::before{background:#fff;}
  .rl-dot{width:12px;height:12px;border-radius:50%;background:var(--surface-2);border:2px solid var(--line);margin:0 auto 6px;position:relative;z-index:1;}
  .rl-step.done .rl-dot{background:#fff;border-color:#fff;}
  .rl-step.current .rl-dot{width:14px;height:14px;box-shadow:0 0 0 3px rgba(255,255,255,.18);}
  .rl-icon{font-size:14px;opacity:.35;margin-bottom:2px;}
  .rl-step.done .rl-icon,.rl-step.current .rl-icon{opacity:1;}
  .rl-label{font-family:var(--font-mono);font-size:7.5px;text-transform:uppercase;letter-spacing:.02em;color:var(--text-faint);line-height:1.3;padding:0 2px;}
  .rl-step.done .rl-label,.rl-step.current .rl-label{color:var(--text-dim);}

  /* fleet */
  .fleet-row{border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:17px;letter-spacing:2px;line-height:1.6;word-break:break-word;}

  /* badges v2 */
  .badge-row2{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .badge2{border:1px solid var(--line);border-radius:12px;padding:9px 4px;text-align:center;cursor:pointer;}
  .badge2.locked{opacity:.4;}
  .badge2.active{border-color:#fff;}
  .badge2-icon{font-size:19px;margin-bottom:4px;}
  .badge2-name{font-size:8.5px;line-height:1.25;color:var(--text-dim);}
  .badge2-progress{font-family:var(--font-mono);font-size:8px;color:var(--text-faint);margin-top:3px;}

  /* crew */
  .crew-row{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:12px;}
  .crew-goal{color:var(--text);}
  .crew-by{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);white-space:nowrap;}

  /* completed missions */
  .completed-card{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;}
  .cc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
  .cc-title{font-weight:700;font-size:13px;}
  .cc-type{font-family:var(--font-mono);font-size:9px;color:var(--text-faint);border:1px solid var(--line);padding:2px 8px;border-radius:10px;text-transform:uppercase;}
  .cc-meta{font-size:11.5px;color:var(--text-faint);line-height:1.5;}
  .cc-cosmic{color:#fff;}

  /* illuminator — post cards brought onto the same white-card-on-black
     "ticket" system as the rest of the app's mission tickets (2026-09-28:
     "update ticket designs in Illuminator"). .post-tk replaces the old dark
     bordered .post card; child class names (.post-head, .pname, etc.) are
     unchanged, just rescoped/recolored for a white background. */
  .post-tk{background:#fff;color:#000;border-radius:26px;padding:18px;margin-bottom:16px;box-shadow:0 22px 48px -26px rgba(255,255,255,.22);}

const WEB_LOGIN = (function(){
  if (IS_WEB && /\/auth\/yandex\/?$/.test(location.pathname)) {
    const q = new URLSearchParams(location.search);
    const code = q.get('code'), st = q.get('state');

  if (!m) return Promise.resolve();

    .then(d => { saveWebSession({ refresh: d.refresh, tg_id: d.tg_id }); location.replace('/'); return new Promise(() => {}); })
    .catch(e => { WEB_LOGIN_ERROR = e.message || 'error'; try { safeRender(); } catch (x) {} });
})();
let WEB_FIRST_OPEN = true;
function webAuth(force){
  return WEB_LOGIN.then(() => {
    const ses = webSession();
    if (!ses || !ses.refresh) return null;
    if (!force && TG_AUTH.token && TG_AUTH.exp * 1000 - Date.now() > 3600e3) return TG_AUTH.token;
    if (TG_AUTH.promise) return TG_AUTH.promise;
    const open = WEB_FIRST_OPEN; WEB_FIRST_OPEN = false;
    TG_AUTH.promise = webAuthCall('refresh', { refresh: ses.refresh, open, standalone: IS_STANDALONE, version: TYAGA_WEB_VERSION })
      .then(d => { TG_AUTH.token = d.token; TG_AUTH.exp = d.exp; return d.token; })
      .catch(e => { if (/session_expired|bad_session/.test(e.message)) { saveWebSession(null); location.replace('/'); } return TG_AUTH.token; })
      .finally(() => { TG_AUTH.promise = null; });
    return TG_AUTH.promise;
  });
}

// ==== Вход через Telegram ====
// Telegram подписывает initData токеном бота. Функция tg-auth на сервере проверяет подпись
// и выдаёт токен с проверенным Telegram id; база пускает каждого только к его собственным строкам.
const TG_AUTH = { token: null, exp: 0, promise: null };
const TRACK_SESSION = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2));
function tgAuth(force){
  const tg = window.Telegram && window.Telegram.WebApp;
  const initData = tg && tg.initData;
  if (!initData) return webAuth(force);
  if (!force && TG_AUTH.token && TG_AUTH.exp * 1000 - Date.now() > 3600e3) return Promise.resolve(TG_AUTH.token);
  if (TG_AUTH.promise) return TG_AUTH.promise;
  const first = !TG_AUTH.token;
  TG_AUTH.promise = fetch(SUPABASE_URL + '/functions/v1/tg-auth', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY },
    body: JSON.stringify({ initData, platform: tg.platform || '', version: tg.version || '', session: TRACK_SESSION, event: first }),
  }).then(r => r.ok ? r.json() : null)
    .then(d => { if (d && d.token) { TG_AUTH.token = d.token; TG_AUTH.exp = d.exp; } return TG_AUTH.token; })
    .catch(() => TG_AUTH.token)
    .finally(() => { TG_AUTH.promise = null; });
  return TG_AUTH.promise;
}
async function authToken(){ return (await tgAuth()) || SUPABASE_ANON_KEY; }
tgAuth();

/* ===== 18+ gate ===== *
 * Nothing enforced this before — age was a free-text optional onboarding
 * field with no minimum. Real money now moves through this app, so every
 * checkout path (mission tariffs, and later merch/mentors) must pass through
 * here first. The localStorage flag is just a UX shortcut to skip asking
 * twice on the same device; the actual enforcement is server-side, in the
 * create-payment edge function, which refuses to create a charge unless
 * users.age_confirmed_18 is true in the database. */
function getStoredAge18(){
  try { return localStorage.getItem('tyaga_age18_' + TG_ID) === '1'; } catch(e){ return false; }
}
function setStoredAge18(){
  try { localStorage.setItem('tyaga_age18_' + TG_ID, '1'); } catch(e){}
}
function isAge18Confirmed(){
  return state.age18Confirmed || getStoredAge18();
}
// Where to resume once the gate is passed — set right before navigating to
// 'ageGate', read (and cleared) by confirmAge18().
let age18ResumeAction = null;
function requireAge18ThenRun(resumeFn){
  if (isAge18Confirmed()) { resumeFn(); return; }
  age18ResumeAction = resumeFn;
  go('ageGate');
}
async function confirmAge18(){
  state.age18Confirmed = true;
  setStoredAge18();
  if (sb) {
    try { await sb.from('users').update({ age_confirmed_18: true }).eq('telegram_id', TG_ID); }
    catch(e){ console.warn('age_confirmed_18 save failed — продолжаем локально', e); }
  }
  const resume = age18ResumeAction;
  age18ResumeAction = null;
  if (resume) resume(); else back();
}

// One checkout = one key, kept on the device until the mission is created.
// The server turns (user, key, selection) into exactly one payment, however many
// times the button is pressed or the app is reopened.
function checkoutKey(kind){
  const k = 'tyaga_ck_' + TG_ID + '_' + kind;
  let v = null;
  try { v = localStorage.getItem(k); } catch(e){}
  if (!v) {
    v = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2));
    try { localStorage.setItem(k, v); } catch(e){}

}

/* ===== Оплата: вернуться туда, где остановились ===== */
const PENDING_KEY = () => 'tyaga_pending_checkout_' + TG_ID;
function formForKind(kind){ return kind==='result' ? state.result : (kind==='askeza' ? state.askeza : state.form); }
function savePendingCheckout(kind, paymentId){
  try {
    localStorage.setItem(PENDING_KEY(), JSON.stringify({ kind, paymentId, at: Date.now(), form: formForKind(kind) }));
  } catch(e){ console.warn('pending checkout not saved', e); }
}
function clearPendingCheckout(){ try { localStorage.removeItem(PENDING_KEY()); } catch(e){} }
async function resumePaidCheckout(){
  let pc = null;
  try { pc = JSON.parse(localStorage.getItem(PENDING_KEY()) || 'null'); } catch(e){}
  if (!pc || !pc.paymentId || !pc.kind || !PAYMENT_KIND_CONFIG[pc.kind] || !sb) return;
  if (Date.now() - (pc.at || 0) > 3*24*3600*1000) { clearPendingCheckout(); return; }
  if (state.payment && state.payment.paymentId) return;           // this instance is already handling it
  try {
    verifyPaymentOnServer(pc.paymentId);
    let data = null;
    for (let i = 0; i < 4; i++) {
      const r = await sb.rpc('tyaga_payment_status', { p_id: pc.paymentId });
      data = r && r.data;
      if (data && (data.status === 'succeeded' || data.status === 'canceled')) break;
      await new Promise(res => setTimeout(res, 1500));
    }
    if (!data) return;
    if (data.status === 'canceled') { clearPendingCheckout(); return; }
    if (data.status !== 'succeeded') return;
    // already turned into a mission? then nothing to resume
    const { data: linked } = await sb.from('missions').select('id').eq('user_id', TG_ID).eq('payment_id', data.id || pc.paymentId).limit(1);
    if (linked && linked.length) { clearPendingCheckout(); return; }
    const target = formForKind(pc.kind);
    Object.keys(pc.form || {}).forEach(k => { target[k] = pc.form[k]; });
    target.missionCreated = false;
    state.payment = { kind: pc.kind, paymentId: data.id || pc.paymentId, status: 'succeeded' };
    try { track('checkout_resumed', { kind: pc.kind }); } catch(e){}
    go(PAYMENT_KIND_CONFIG[pc.kind].confirmScreen, {replace:true});
  } catch(e){ console.warn('resume checkout failed', e); }
}

let paymentInFlight = false;
async function doInitiatePayment(kind){
  const cfg = PAYMENT_KIND_CONFIG[kind];
  if (!cfg) return;
  // One checkout at a time: a second tap (or a re-render) reopens the same
  // payment instead of creating a duplicate one.
  if (state.payment && state.payment.kind === kind && state.payment.paymentId && state.payment.status === 'awaiting') {
    go('awaitingPayment');
    if (state.payment.confirmationUrl) openPaymentUrl(state.payment.confirmationUrl);
    pollPayment();
    return;
  }
  if (paymentInFlight) return;
  paymentInFlight = true;
  try { await doInitiatePaymentInner(kind, cfg); } finally { paymentInFlight = false; }
}
async function doInitiatePaymentInner(kind, cfg){
  state.payment = { kind, status:'creating', error:null, paymentId:null };
  go('awaitingPayment');
  const ref = paymentReference(kind);
  let amount = cfg.total();
  if (sb) {
    try {
      const { data: q, error: qErr } = await sb.rpc('tyaga_quote', { p_user: TG_ID, p_kind: kind, p_mentor: ref.mentor, p_boosts: ref.boosts });
      if (!qErr && typeof q === 'number') amount = q;
    } catch (e) { /* fall back to the displayed total; the server re-checks anyway */ }
  }
  if (amount <= 0) {
    // Nothing to charge (e.g. a free fast-track "ready ticket" mission whose
    // duration carries price:0) — ЮKassa correctly refuses to create a ₽0
    // payment, which used to leave the user stuck on the payment screen with
    // no visible error. Skip checkout entirely and go straight to the
    // confirmation screen, which is what actually creates the mission.
    state.payment = null;
    go(cfg.confirmScreen, {replace:true});
    return;
  }
  try {
    const res = await fetch(PAYMENT_FUNCTIONS_BASE + 'create-payment', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+(await authToken()), 'apikey':SUPABASE_ANON_KEY },
      body: JSON.stringify({
        user_id: TG_ID,
        purpose: 'tariff',
        amount_kopeks: Math.round(amount*100),
        description: 'ТЯГА · ' + cfg.label(),
        reference: ref,
        checkout_key: checkoutKey(kind),
        return_to: IS_WEB ? 'web' : 'tg',
      }),
    });
    const data = await res.json().catch(()=>null);
    if (res.ok && data && data.already_paid && data.payment_id) {
      state.payment.paymentId = data.payment_id;
      state.payment.status = 'succeeded';
      go(cfg.confirmScreen, {replace:true});
      return;
    }
    if (res.ok && data && data.free) { state.payment = null; go(cfg.confirmScreen, {replace:true}); return; }
    if (!res.ok || !data || !data.confirmation_url) {
      state.payment.status = 'error';
      state.payment.error = (data && data.error) || ('http_'+res.status);
      go('awaitingPayment');
      return;
    }
    state.payment.paymentId = data.payment_id;
    state.payment.confirmationUrl = data.confirmation_url;
    state.payment.status = 'awaiting';
    savePendingCheckout(kind, data.payment_id);
    render();
    openPaymentUrl(data.confirmation_url);
    pollPayment();
  } catch(e){
    state.payment.status = 'error';
    state.payment.error = String(e);
    go('awaitingPayment');
  }
}

function openPaymentUrl(url){

      window.Telegram.WebApp.openLink(url, { try_instant_view:false });

}

let paymentPollHandle = null;
function pollPayment(){
  if (paymentPollHandle) clearInterval(paymentPollHandle);
  let elapsed = 0;
  paymentPollHandle = setInterval(async () => {
    elapsed += 2000;
    if (!state.payment || !state.payment.paymentId) { clearInterval(paymentPollHandle); return; }
    try {
      if (elapsed % 10000 === 0) verifyPaymentOnServer(state.payment.paymentId);
      await paymentStatusOnce();
    } catch(e){ /* keep polling — a transient network hiccup shouldn't abort the wait */ }
    if (elapsed > 900000 && state.payment && state.payment.status === 'awaiting') {
      clearInterval(paymentPollHandle);
      state.payment.status = 'timeout';
      safeRender();
    }
  }, 2000);
}
// Coming back from the ЮKassa page: check right away instead of waiting.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && state.payment && state.payment.status === 'awaiting') {
    verifyPaymentOnServer(state.payment.paymentId).then(() => pollPayment());
  }
});
function cancelPaymentWait(){
  if (paymentPollHandle) clearInterval(paymentPollHandle);
  state.payment = null;
  back();
}
async function paymentStatusOnce(){
  if (!state.payment || !state.payment.paymentId || !sb) return;
  const { data } = await sb.rpc('tyaga_payment_status', { p_id: state.payment.paymentId });
  if (!state.payment) return;
  if (data && data.id && data.id !== state.payment.paymentId) state.payment.paymentId = data.id;
  if (data && data.status === 'succeeded' && state.payment.status !== 'succeeded') {
    if (paymentPollHandle) clearInterval(paymentPollHandle);
    state.payment.status = 'succeeded';
    state.payment.checking = false;
    const cfg = PAYMENT_KIND_CONFIG[state.payment.kind];
    go(cfg.confirmScreen, {replace:true});
  } else if (data && data.status === 'canceled') {
    if (paymentPollHandle) clearInterval(paymentPollHandle);
    state.payment.status = 'canceled';
    state.payment.checking = false;
    safeRender();
  }
}
// Asks the server to re-check the payment directly with ЮKassa (in case the
// notification is late). Safe: the server only trusts ЮKassa's own answer.
function verifyPaymentOnServer(paymentId){
  if (!paymentId) return Promise.resolve();
  return fetch(PAYMENT_FUNCTIONS_BASE + 'yookassa-webhook', {
    method:'POST', mode:'no-cors', headers:{ 'Content-Type':'text/plain' },
    body: JSON.stringify({ tyaga_payment_id: paymentId }),
  }).catch(()=>{});
}
async function recheckPaymentNow(){
  if (!state.payment || state.payment.checking) return;
  state.payment.status = 'awaiting'; state.payment.checking = true; render();
  try {
    await verifyPaymentOnServer(state.payment.paymentId);
    await paymentStatusOnce();
  } catch(e){}
  if (state.payment && state.payment.status !== 'succeeded') {
    state.payment.checking = false;
    safeRender();
    pollPayment();
  }
}

      state.profile.reputation.total = userRow.reputation_total || 0;
      if (userRow.reputation_by_type && Object.keys(userRow.reputation_by_type).length) state.profile.reputation.byType = userRow.reputation_by_type;
      state.profile.streak.current = userRow.streak_current;

      state.profile.crew.inspiredCount = userRow.crew_inspired_count;
      if (userRow.completed_by_type && Object.keys(userRow.completed_by_type).length) state.profile.completedByType = userRow.completed_by_type;

      }
      loadWitnessing();
      loadCoach();
      setTimeout(routeDeepLink, 0);
      setTimeout(applyPendingTemplate, 50);
      try {
        const { data: unlocks } = await sb.from('mentor_unlocks').select('mentor_name').eq('user_id', TG_ID);
        if (unlocks) state.profile.unlockedMentors = unlocks.map(u => u.mentor_name);
      } catch (e) { console.warn('loading mentor_unlocks failed', e); }
      // Profile's "Завершённые миссии" was reading state.profile.completed, which
      // was only ever initialized to [] and never actually filled in from the DB —
      // so finished missions never showed up there no matter how many the user
      // completed. Pull them in here, oldest first so index 0 is the user's very
      // first completion (firstCosmic — matches the achievement check elsewhere),
      // then reverse for display so the newest completion shows on top.
      const { data: completedMissions } = await sb.from('missions').select('*').eq('user_id', TG_ID).eq('status','completed').order('finished_at', { ascending:true });

          title: m.title,
          type: m.type,
          days: m.report_count || m.target_days || 0,
          report: m.meaning || '',
          finished: m.finished_at ? new Date(m.finished_at).toLocaleDateString(state.lang==='en'?'en-US':'ru-RU') : '',
          firstCosmic: i===0,
        })).reverse();
      }
    }
    dbHydrated = true;
    sendAttribution();
    loadPrizes();
    safeRender();
  } catch (e) { console.warn('hydrateFromDB failed — работаем в локальном режиме', e); }
}

async function dbLogProgress(mission){
  if (!sb || !mission || !mission.dbId) return;
  try {
    const today = new Date().toISOString().slice(0,10);
    await sb.from('progress_logs').upsert({
      mission_id: mission.dbId, user_id: TG_ID, log_date: today, completed: true
    }, { onConflict: 'mission_id,log_date' });
    // report_count wasn't previously persisted here at all — it only ever
    // lived in local JS state, so it silently reset to whatever stale value
    // was in the DB (usually 0) on every reload, and totalDays-based
    // completion (habit/result, and now Askeza) never actually fired after
    // a reload. Persist it alongside progress so it survives.
    const patch = { progress: mission.progress, last_report_date: today, report_count: mission.reportCount||0, ls_bonus_awarded: !!mission.lsBonusAwarded };
    // Completion pivot (2026-09-25): the finish line is the mission's
    // target_date (date of arrival the user picked), not a report/check-in
    // count — a mission finishes specifically on the day it was set for,
    // shiftable only by boosts (extendMission / date-change boosts) that
    // move target_date itself. reportCount still drives the progress bar
    // and daily gating. (2026-09-25 cont.3: Habit specifically ALSO requires
    // reportCount to actually reach totalDays — a daily habit of 90 days
    // needs 90 real reports, not just the calendar catching up — see
    // missionTrulyComplete().)
    const doneByDate = missionTrulyComplete(mission);
    if (mission.progress >= 100 || doneByDate) { patch.status = 'completed'; patch.finished_at = new Date().toISOString(); }
    await sb.from('missions').update(patch).eq('id', mission.dbId);
  } catch (e) { console.warn('dbLogProgress failed', e); }
}

// Generalized proof upload: every post is video, photo, or text, and every
// post carries which mission it belongs to and whether it's the mission's
// one main promise or a dated progress report on it.
// A post always gets stored here — public or not — because the owner's own
// profile mission-thread reads from this same table with no privacy filter.
// Only the global Illuminator feed query filters to public:true (see
// loadIlluminatorPosts). isPublic is the mission's own public flag
// (state.missions[i].isPublic, mirrored from missions.public in the DB) —
// resolve it via missionPublicFlag(missionId) before calling this.
async function uploadIlluminatorProof(opts){
  const { kind, blob, caption, missionType, missionTitle, missionId, isPromise, reportDay, reportTotalDays, isPublic } = opts;
  if (!sb) return null;
  try {
    const base = {
      user_id: TG_ID, author_name: state.profile.name, mission_type: missionType || null,
      mission_title: missionTitle || null, mission_id: missionId || null, is_promise: !!isPromise,
      report_day: reportDay || null, report_total_days: reportTotalDays || null,
      caption: caption || '', kind, public: !!isPublic
    };
    if (kind === 'text'){
      const { data: inserted } = await sb.from('illuminator_posts').insert({ ...base, text_body: caption || '' }).select('*').maybeSingle();
      return inserted;
    }
    const isPhoto = kind === 'photo';
    const bucket = isPhoto ? 'illuminator-photos' : 'illuminator-videos';
    const ext = isPhoto ? 'jpg' : videoExt(blob);
    const fileName = `${TG_ID}_${Date.now()}.${ext}`;
    const { error: upErr } = await sb.storage.from(bucket).upload(fileName, blob, { contentType: (blob.type || (isPhoto?'image/jpeg':'video/webm')).split(';')[0] });
    if (upErr) throw upErr;
    const { data: pub } = sb.storage.from(bucket).getPublicUrl(fileName);
    const url = pub && pub.publicUrl;
    const { data: inserted } = await sb.from('illuminator_posts').insert({
      ...base, [isPhoto ? 'photo_url' : 'video_url']: url
    }).select('*').maybeSingle();
    return inserted;
  } catch (e) { console.warn('uploadIlluminatorProof failed', e); return null; }
}
// Back-compat alias used by the video recording flow below.
async function uploadIlluminatorVideo(blob, caption, missionType){
  return uploadIlluminatorProof({ kind:'video', blob, caption, missionType });
}

const CHAT = { mentor: null, messages: [], loading: false, sending: false, typing: false, error: null, access: true };
function chatEsc(t){ return String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function chatUsedFlag(v){ try { if (v) localStorage.setItem('tyaga_chat_used', '1'); return localStorage.getItem('tyaga_chat_used') === '1'; } catch (e) { return false; } }
async function chatCall(action, body){
  const token = await authToken();
  const r = await fetch(SUPABASE_URL + '/functions/v1/mentor-chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + token },
    body: JSON.stringify(Object.assign({ action }, body || {})),
    signal: (window.AbortSignal && AbortSignal.timeout) ? AbortSignal.timeout(60000) : undefined,
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
  return d;
}
function openAppChat(name){
  CHAT.mentor = name; CHAT.messages = []; CHAT.error = null; CHAT.loading = true; CHAT.access = true; CHAT.typing = false; CHAT.botStarted = !!(state.botStarted && state.botStarted[name]);
  try { track('mentor_chat_open', { mentor: name }); } catch (e) {}
  go('mentorChat');
  chatCall('history', { mentor: name })
    .then(d => { if (CHAT.mentor !== name) return; CHAT.messages = (d.messages || []).map(m => ({ role: m.role, text: m.content })); CHAT.access = d.access !== false; CHAT.botStarted = d.bot_started !== false; state.botStarted = Object.assign(state.botStarted||{}, { [name]: CHAT.botStarted }); if (state.screen==='mentorChat') render(); })
    .catch(e => { CHAT.error = e.message; })
    .finally(() => { CHAT.loading = false; chatPaint(true); });
}
const CHAT_ERRORS = {
  locked: ['Этот наставник откроется, когда ты выберешь его для миссии.', 'This mentor unlocks once you pick them for a mission.'],
  bot_not_started: ['Сначала запусти наставника в Telegram и нажми Start.', 'First open the mentor in Telegram and press Start.'],
  rate_limited: ['Много сообщений подряд. Сделай паузу и напиши чуть позже.', 'That\'s a lot of messages in a row. Take a short break and write again a bit later.'],
  auth: ['Сессия устарела. Обнови страницу.', 'Your session has expired. Please reload the page.'],
};
function chatErrorText(code){ const e = CHAT_ERRORS[code]; return e ? tr(e[0], e[1]) : tr('Связь пропала. Попробуй ещё раз.', 'The connection dropped. Please try again.'); }
function chatBubbles(){
  if (CHAT.loading) return `<div class="mc-empty">${tr('Настраиваю связь…', 'Connecting…')}</div>`;
  const out = [];
  if (!CHAT.messages.length) out.push(`<div class="mc-empty">${tr('Напиши первым — наставник ответит здесь.', 'Write first — your mentor will reply right here.')}</div>`);
  CHAT.messages.forEach(m => {
    String(m.text || '').split('\n').map(l => l.trim()).filter(Boolean).forEach(line => {
      out.push(`<div class="mc-msg ${m.role === 'user' ? 'me' : 'them'}">${chatEsc(line)}</div>`);
    });
  });
  if (CHAT.typing) out.push(`<div class="mc-msg them mc-typing"><i></i><i></i><i></i></div>`);
  if (CHAT.error) out.push(`<div class="mc-err">${chatEsc(chatErrorText(CHAT.error))}</div>`);
  return out.join('');
}
function chatPaint(scroll){
  if (state.screen !== 'mentorChat') return;
  const log = document.getElementById('mcLog');
  if (!log) { safeRender(); return; }
  log.innerHTML = chatBubbles();
  const btn = document.getElementById('mcSend');
  if (btn) btn.disabled = CHAT.sending || !CHAT.access;
  if (scroll) { const v = document.getElementById('view'); if (v) v.scrollTop = v.scrollHeight; }
}
function chatKey(e){ if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); chatSend(); } }
function chatGrow(el){ el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 140) + 'px'; }
const chatSleep = (ms) => new Promise(r => setTimeout(r, ms));
async function chatSend(){
  const box = document.getElementById('mcInput');
  const text = box ? box.value.trim() : '';
  if (!text || CHAT.sending || !CHAT.mentor) return;
  const mentor = CHAT.mentor;
  box.value = ''; chatGrow(box);
  CHAT.error = null; CHAT.sending = true; CHAT.typing = true;
  CHAT.messages.push({ role: 'user', text });
  chatPaint(true);
  try {
    const d = await chatCall('send', { mentor, text });
    chatUsedFlag(true);
    if (CHAT.mentor !== mentor) return;
    const lines = (d.lines && d.lines.length) ? d.lines : [d.reply || ''];
    const msg = { role: 'assistant', text: '' };
    for (let i = 0; i < lines.length; i++) {
      if (i) { CHAT.typing = true; chatPaint(true); await chatSleep(Math.min(1400, 450 + lines[i].length * 18)); }
      CHAT.typing = false;
      msg.text = msg.text ? msg.text + '\n' + lines[i] : lines[i];
      if (i === 0) CHAT.messages.push(msg);
      chatPaint(true);
    }
  } catch (e) {
    CHAT.error = e.message;
    if (e.message === 'locked') CHAT.access = false;
    if (e.message === 'bot_not_started') { CHAT.botStarted = false; render(); }
  } finally {
    CHAT.sending = false; CHAT.typing = false; chatPaint(true);
    const b = document.getElementById('mcInput'); if (b && IS_DESKTOP_DEVICE) b.focus();
  }
}

// openQuiz(): replaced by the ТЯГА profile quiz (qzIntro → qzCard → qzResult), see v2 step 3
function answerQuiz(qi, type){ state.quiz[qi] = type; render(); }
function retakeQuiz(){ state.quizResult = null; state.quiz = {}; state.quizOwn = {}; render(); }
function finishQuiz(){
  const counts = {};
  Object.values(state.quiz).forEach(t=>{ if(t==='own') return; counts[t]=(counts[t]||0)+1; });
  let best=null, bestN=-1;
  Object.entries(counts).forEach(([t,n])=>{ if(n>bestN){best=t;bestN=n;} });
  // Один раз пройденный опросник сохраняется как результат (в реальном приложении — на бэкенде,
  // для нас и аналитики), и дальше просто применяется — повторно проходить не нужно.
  state.quizResult = { type: best, answers: {...state.quiz}, own: {...state.quizOwn}, completedAt: Date.now() };
  applyQuizResult();
  back();
}
function applyQuizResult(){
  if(!state.quizResult || !state.quizResult.type) return;
  if(!state.form.psychotype) state.form.psychotype = state.quizResult.type;
  if(!state.result.psychotype) state.result.psychotype = state.quizResult.type;
  if(!state.askeza.psychotype) state.askeza.psychotype = state.quizResult.type;
}

function go(screen, opts){
  opts = opts || {};
  if(state.screen==='illumRecord' && screen!=='illumRecord') stopIllumMedia();
  if(opts.replace){ /* no push */ } else { state.history.push(state.screen); }
  state.screen = screen;
  render();
}
function back(){
  if(state.screen==='illumRecord') stopIllumMedia();
  const prev = state.history.pop();
  state.screen = prev || 'home';
  render();
}

function effectiveHabitName(){

  return step;
}

// Habits are frequent/low-friction, so text/photo are allowed alongside video;

  'Аскеза': { video:true, photo:false, text:true, note:{ru:'Достаточно честной текстовой отметки, видео — по желанию.',en:'An honest text check-in is enough; video is optional.'} },
};

function setFreeWhen(target, v){ (target==='result'?state.result:state.form).freeWhen = v; render(); }
function setProofType(target, v){ (target==='result'?state.result:state.form).proofType = v; render(); }

// Lightweight "relatable to this viewer" ranking: posts whose mission type
// matches a type the viewer has launched (active or historical) bubble up,
// then ties break on support count, so the feed leans toward what a given
// pilot is actually likely to find relevant rather than pure recency.
function recommendedIlluminatorPosts(){
  const myTypes = {};
  (state.missions||[]).forEach(m => { if(m.type) myTypes[m.type] = (myTypes[m.type]||0) + 3; });
  Object.entries(state.profile.launchedByType||{}).forEach(([t,n]) => { myTypes[t] = (myTypes[t]||0) + Math.min(n,5); });
  // Real posts only — ILLUMINATOR_POSTS is placeholder/demo content (Марина/
  // Игорь/Света) with no real video, rendered as a flat gradient box with a
  // fake play circle. Mixing it into the live feed is exactly what made real
  // posts look "messed up with random circles above every post"; only fall
  // back to the demo set when there are no real posts at all, so a brand-new
  // account isn't staring at an empty feed.
  const all = state.illumPosts.length ? state.illumPosts : ILLUMINATOR_POSTS;
  return all.map((p,i) => ({ p, i, score: (myTypes[p.mission_type || p.type] || 0) + (p.support_count||0)*0.1 }))
    .sort((a,b) => b.score - a.score || a.i - b.i)
    .map(x => x.p);
}

// The feed must not show a card per report — every report belongs under its
// mission's one main/promise video, so the feed collapses to one card per
// mission with a "N reports" count, and tapping it opens the full thread
// (the mission's page, whichever user it belongs to).
function feedGroupKey(p){
  if(p.mission_id) return 'm:'+p.mission_id;
  const title = p.mission_title || (p.missionTitle ? tf(p.missionTitle) : '');
  const author = p.user_id || p.author_name || p.author || '';
  return 'u:'+author+'|'+title;
}
function groupIlluminatorFeed(posts){
  const groups = {}; const order = [];
  posts.forEach(p => {
    const key = feedGroupKey(p);
    if(!groups[key]){ groups[key] = { key, posts:[], promise:null }; order.push(key); }
    const g = groups[key];
    g.posts.push(p);
    if((p.isPromise || p.is_promise) && !g.promise) g.promise = p;
  });
  return order.map(key => {
    const g = groups[key];
    return { key: g.key, rep: g.promise || g.posts[0], count: g.posts.length, posts: g.posts };
  });
}

  else if(milestone) where = tr(`этап ${milestone}`, `milestone ${milestone}`);

function isValidMediaUrl(u){

function mediaLoadFailed(el){

  const div = document.createElement('div');
  div.className = 'post-media-fallback';
  div.textContent = msg;

}

function postCard(p, groupIndex, count){
  // Real DB posts (illuminator_posts rows) always carry a `grad` -less shape —
  // `grad` only exists on the scripted ILLUMINATOR_POSTS demo fallback — so use
  // that to tell the two apart, rather than media-field truthiness: a real post
  // with a corrupt/empty video_url or photo_url must still render as a real

    const supported = !!state.illumSupported[p.id];
    const initial = ((p.author_name||'?').trim().charAt(0) || '?').toUpperCase();
    const tag = p.mission_type || tr('Пост','Post');
    // Real DB posts render straight from video_url/photo_url with no fallback of

    // failed to load" glyph sitting above the post (the big concentric-circle
    // icon reported in the Illuminator feed). Validate the URL shape up front
    // and also hide the element defensively on a runtime load error.
    // 2026-09-26: a video that fails to load (e.g. a webm recorded on Android
    // played back on an iPhone's WKWebView, which can't decode VP8/VP9) used
    // to just vanish (display:none) — the post then looked empty, which is
    // exactly what was reported as "Illuminator has no videos from anyone."
    // Now a failed video swaps in a visible, honest placeholder instead of
    // disappearing, via mediaLoadFailed() (see its definition) so at least
    // the post reads as "a video was here" rather than as broken/missing.
    const videoFallbackMsg = tr('Видео не воспроизводится на этом устройстве','Video won\'t play on this device');
    const photoFallbackMsg = tr('Фото не загрузилось','Photo failed to load');
    const media = isValidMediaUrl(p.video_url)
      ? `<video src="${p.video_url}${String(p.video_url).includes('#')?'':'#t=0.1'}" controls playsinline preload="metadata" style="width:100%;border-radius:14px;background:#000;max-height:340px;object-fit:cover;" data-fallback="${videoFallbackMsg}" onerror="mediaLoadFailed(this)"></video>`
      : isValidMediaUrl(p.photo_url)
        ? `<img src="${p.photo_url}" loading="lazy" style="width:100%;border-radius:14px;background:#000;max-height:340px;object-fit:cover;display:block;" data-fallback="${photoFallbackMsg}" onerror="mediaLoadFailed(this)">`
        : '';
    const dayTag = p.is_promise ? tr('Обещание','Promise') : (p.report_day ? tr(`День ${p.report_day}`, `Day ${p.report_day}`) : '');
    const bolt = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 1L3 9h4l-1 6 6-8H8z"/></svg>';
    return `<div class="il-card">
      ${media ? `<div class="il-media">${media}<div class="il-tags"><b>${tag}</b>${dayTag ? `<span>${dayTag}</span>` : ''}</div></div>` : ''}
      <div class="il-body">
        <div class="il-who" ${p.user_id ? `onclick="openUser(${Number(p.user_id)})"` : ''}><span class="pp-ava">${initial}</span><div><b>${v2Esc(p.author_name||tr('Пилот','Pilot'))}</b><span>${media ? '' : tag+' · '}${p.is_promise ? tr('обещание','promise') : tr('отчёт','report')} · ${v2Ago(p.created_at)}</span></div></div>
        ${p.mission_title ? `<div class="il-title">${v2Esc(p.mission_title)}</div>` : ''}
        ${(p.caption || p.text_body) ? `<div class="il-text">${p.text_body || p.caption}</div>` : ''}
        <div class="il-actions">
          <button class="il-sup ${supported?'on':''}" onclick="togglePostSupport('${p.id}')">${bolt}${supported ? tr('Поддержано','Supported') : tr('Поддержать','Support')}${p.support_count?` · ${p.support_count}`:''}</button>
          ${feedThreadLink(groupIndex, count)}
        </div>
      </div>
    </div>`;
  }
  const playing = state.illumPlaying===p.id;
  const bolt = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 1L3 9h4l-1 6 6-8H8z"/></svg>';
  return `<div class="il-card">
    <div class="il-media"><div class="post-video ${playing?'playing':''}" style="background:${p.grad};border-radius:0;margin:0" onclick="togglePostVideo('${p.id}')">
      <div class="pv-play">${playing ? '❚❚' : '▶'}</div><div class="pv-duration">${p.duration}</div><div class="pv-scrub"></div>
    </div><div class="il-tags"><b>${tf(p.tag).split('·')[0].trim()}</b><span>${tf(p.kind)}</span></div></div>
    <div class="il-body">
      <div class="il-who"><span class="pp-ava">${p.letter}</span><div><b>${p.author}</b><span>${tf(p.tag)}</span></div></div>
      <div class="il-text">${tf(p.body)}</div>
      <div class="il-actions">
        <button class="il-sup ${state.illumSupported[p.id]?'on':''}" onclick="supportPost('${p.id}')">${bolt}${state.illumSupported[p.id] ? tr('Поддержано','Supported') : tr('Поддержать','Support')}</button>
        ${feedThreadLink(groupIndex, count)}

function supportPost(id){
  const already = !!state.illumSupported[id];
  if(already){
    state.illumSupported[id] = false;
    state.profile.support.given = Math.max(0, state.profile.support.given - 1);
  } else {
    state.illumSupported[id] = true;
    state.profile.support.given += 1;
  }
  render();
}

function merchCard(m, tierLabel){
  const statusTag = { buy:tr('В наличии','In stock'), deposit:tr('Сбор предзаказов','Pre-order'), queue:tr('Лимитированная партия','Limited batch'), soon:tr('Скоро','Coming soon') }[m.status];
  let middle = '';
  let bottom = '';

  if(m.status==='soon'){
    middle = `<div class="merch-meta"><span>${tr('Дизайн в работе — заявки откроются позже','Design in progress — orders open later')}</span></div>`;
    bottom = `<div class="merch-bottom">
      <div class="merch-price merch-price-soon">${tr('ориентировочно','estimate')} ${m.price}₽</div>
      <button class="btn ghost small" disabled>${tr('Скоро','Coming soon')}</button>
    </div>`;
  } else if(m.status==='buy'){
    const mine = !!state.merch.purchased[m.id];
    middle = `<div class="merch-meta"><span class="buy-tag">${tr('● В наличии — отправка в течение недели','● In stock — ships within a week')}</span></div>`;
    bottom = `<div class="merch-bottom">
      <div class="merch-price">${m.price}₽</div>
      <button class="btn ${mine?'ghost':'primary'} small" onclick="${mine ? "go('merchBucket')" : `openMerchOrder('${m.id}','buy')`}">${mine ? tr('✓ В корзине','✓ In cart') : tr('Купить','Buy')}</button>
    </div>`;
  } else if(m.status==='deposit'){
    const pct = Math.min(100, Math.round(m.preorders / m.goal * 100));
    const funded = m.preorders >= m.goal;
    const mine = !!state.merch.preordered[m.id];
    middle = `
      <div class="merch-track ${funded?'funded':''}"><i style="width:${pct}%"></i></div>
      <div class="merch-meta">
        <span>${m.preorders} / ${m.goal} ${tr('предзаказов','pre-orders')}</span>
        <span class="${funded?'funded-tag':''}">${funded ? tr('Уходит в производство','Going into production') : pct+'%'}</span>
      </div>`;
    bottom = `<div class="merch-bottom">
      <div class="merch-price">${m.price}₽ <span class="merch-deposit-note">${tr('депозит','deposit')} ${m.deposit}₽</span></div>
      <button class="btn ${mine?'ghost':'primary'} small" onclick="${mine ? "go('merchBucket')" : `openMerchOrder('${m.id}','preorder')`}">${mine ? tr('✓ Забронировано','✓ Reserved') : tr('Забронировать','Reserve')}</button>
    </div>`;
  } else {
    const mine = !!state.merch.queued[m.id];
    const position = m.queueLen + (mine?0:1);
    middle = `<div class="merch-meta"><span>${tr('В очереди','In queue')}: ${m.queueLen} ${personWord(m.queueLen)}</span>${mine ? `<span class="funded-tag">${tr('Твоё место','Your spot')}: №${position}</span>` : ''}</div>`;
    bottom = `<div class="merch-bottom">
      <div class="merch-price">${m.price}₽</div>
      <button class="btn ${mine?'ghost':'primary'} small" onclick="${mine ? "go('merchBucket')" : `openMerchOrder('${m.id}','queue')`}">${mine ? tr('✓ Ты в очереди','✓ You\'re in the queue') : tr('Встать в очередь','Join the queue')}</button>
    </div>`;
  }

  const variants = m.variants ? `
    ${m.variantsLead ? `<div class="merch-variants-lead">${tf(m.variantsLead)}</div>` : ''}
    <div class="merch-variants">${m.variants.map(v=>`<span class="mv-chip">${tf(v)}</span>`).join('')}</div>` : '';

  return `<div class="merch-card ${m.status==='soon'?'merch-card-soon':''}">
    ${m.img ? `<div class="merch-photo"><img src="${m.img.charAt(0)==='/' ? m.img : 'data:image/jpeg;base64,'+m.img}" loading="lazy" alt="${tf(m.name)}"></div>` : ''}
    <div class="merch-top">
      <div class="merch-name">${tf(m.name)}</div>
      <div class="merch-tier">${tierLabel[m.tier]}</div>
    </div>
    <div class="merch-desc">${tf(m.desc)}</div>
    ${variants}
    <div class="merch-status">${statusTag}</div>
    ${middle}
    ${bottom}
  </div>`;
}

function markMerchPreordered(id){
  const item = state.merch.items.find(i=>i.id===id);
  if(!item || state.merch.preordered[id]) return;
  state.merch.preordered[id] = true;
  item.preorders += 1;
}

function markMerchPurchased(id){
  state.merch.purchased[id] = true;
}

function markMerchQueued(id){
  const item = state.merch.items.find(i=>i.id===id);
  if(!item || state.merch.queued[id]) return;
  state.merch.queued[id] = true;
  item.queueLen += 1;
}

function unmarkMerch(id, action){
  const item = state.merch.items.find(i=>i.id===id);
  if(action==='preorder'){
    state.merch.preordered[id] = false;
    if(item) item.preorders = Math.max(0, item.preorders - 1);
  } else if(action==='buy'){
    state.merch.purchased[id] = false;
  } else if(action==='queue'){
    state.merch.queued[id] = false;
    if(item) item.queueLen = Math.max(0, item.queueLen - 1);
  }
}

function openMerchOrder(id, action){
  const item = state.merch.items.find(i=>i.id===id);
  if(!item) return;
  const tgUser = (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) || {};
  state.merch.orderForm = {
    itemId: id,
    action,
    size: item.sizes ? 'M' : null,
    name: (state.profile.name && state.profile.name.trim()) || tgUser.first_name || '',
    contact: tgUser.username ? '@'+tgUser.username : '',
    note: '',
  };
