<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Тяга</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:ital,wght@0,500;0,700;1,700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#000000;
    --surface:#0b0b0b;
    --surface-2:#151515;
    --surface-3:#1e1e1e;
    --line:#2a2a2a;
    --text:#ffffff;
    --text-dim:#8f8f8f;
    --text-faint:#5a5a5a;
    --invert-bg:#ffffff;
    --invert-text:#000000;
    --font-display:'Oswald', 'Arial Narrow', sans-serif;
    --font-head:'Fraunces', Georgia, serif;
    --font-body:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:#050505;
    color:var(--text);
    font-family:var(--font-body);
    overflow:hidden;
    height:var(--tg-vh, 100vh);
    width:100%;
  }
  #app-root{
    display:flex;
    flex-direction:column;
    height:var(--tg-vh, 100vh);
    width:100%;
    max-width:520px;
    margin:0 auto;
    background:var(--bg);
    overflow:hidden;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }

  .rig{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:380px;width:100%;}
  .rig-label{
    font-family:var(--font-mono);
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--text-faint);
  }

  .device{
    width:100%;
    max-width:380px;
    background:var(--bg);
    border-radius:34px;
    padding:10px;
    box-shadow:0 40px 80px -30px rgba(0,0,0,.9), 0 0 0 1px #1c1c1c;
  }
  .screen{
    background:var(--bg);
    border-radius:26px;
    overflow:hidden;
    height:720px;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .tg-bar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px 6px;
    font-family:var(--font-mono);
    font-size:11px;color:var(--text-faint);
    flex-shrink:0;
  }
  .tg-bar .brand{
    color:var(--text);letter-spacing:.03em;font-weight:700;
    font-family:var(--font-display);font-style:italic;font-size:15px;text-transform:uppercase;
  }

  .view{
    flex:1;
    overflow-y:auto;
    padding:10px 20px 24px;
    scrollbar-width:none;
    animation:fade .25s ease;
  }
  .view::-webkit-scrollbar{display:none;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .eyebrow{
    font-family:var(--font-mono);
    font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--text-faint);margin:6px 0 8px;
  }
  h1{
    font-family:var(--font-head);
    font-weight:600;
    font-size:26px;
    line-height:1.15;
    letter-spacing:0;
    margin:0 0 10px;
    text-wrap:balance;
    text-transform:none;
  }
  h2{
    font-family:var(--font-head);
    font-weight:600;
    font-size:17px;
    text-transform:none;
    letter-spacing:0;
    margin:18px 0 4px;
  }
  p.lead{color:var(--text-dim);font-size:14px;line-height:1.55;margin:0 0 18px;}
  p.hint{color:var(--text-faint);font-size:12px;line-height:1.5;margin:8px 0 0;}

  .stack{display:flex;flex-direction:column;gap:10px;}
  .row-gap{display:flex;gap:6px;flex-wrap:wrap;}

  /* buttons */
  .btn{
    font-family:var(--font-body);
    font-size:14px;font-weight:600;
    border-radius:14px;
    padding:15px 18px;
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--text);
    cursor:pointer;
    text-align:center;
    transition:opacity .15s;
  }
  .btn:active{opacity:.65;}
  .btn.primary{
    background:var(--invert-bg);
    color:var(--invert-text);
    border-color:var(--invert-bg);
  }
  .btn.primary:disabled{
    background:var(--surface-3);
    color:var(--text-faint);
    border-color:var(--line);
    cursor:not-allowed;
  }
  .btn.ghost{background:transparent;}
  .btn.small{padding:9px 14px;font-size:12.5px;border-radius:10px;}
  .btn.block{width:100%;}
  .btn:focus-visible{outline:2px solid #fff;outline-offset:2px;}

  .backbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:0 0 4px;
  }
  .back{
    font-family:var(--font-mono);
    font-size:12px;color:var(--text-dim);
    background:none;border:none;cursor:pointer;padding:6px 0;
  }
  .step{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);}

  /* cards / chips */
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px;
  }
  .activate-card{
    background:var(--invert-bg);
    color:var(--invert-text);
    border-radius:16px;
    padding:18px;
    margin-top:16px;
  }
  .activate-card .tag{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;opacity:.6;}
  .activate-card h3{font-family:var(--font-head);font-size:19px;margin:6px 0 6px;}
  .activate-card p{font-size:13px;line-height:1.5;margin:0 0 14px;opacity:.85;}
  .activate-card .btn.primary{background:var(--invert-text);color:var(--invert-bg);}
  .activate-banner{
    background:var(--invert-bg);
    color:var(--invert-text);
    border-radius:14px;
    padding:14px;
    margin-bottom:14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .activate-banner .txt{font-size:13px;line-height:1.35;}
  .activate-banner .txt b{display:block;font-family:var(--font-head);font-size:15px;margin-bottom:2px;}
  .activate-banner button{
    flex:none;
    font-family:var(--font-mono);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.03em;
    background:var(--invert-text);
    color:var(--invert-bg);
    border:none;
    border-radius:10px;
    padding:10px 12px;
    cursor:pointer;
  }
  .chip{
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--text-dim);
    border-radius:16px;
    padding:7px 12px;
    font-size:12px;
    cursor:pointer;
    user-select:none;
  }
  .chip.active{background:var(--invert-bg);color:var(--invert-text);border-color:var(--invert-bg);font-weight:600;}

  input[type=text], textarea{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:12px;
    color:var(--text);
    font-family:var(--font-body);
    font-size:14px;
    padding:13px 14px;
    resize:none;
  }
  input::placeholder, textarea::placeholder{color:var(--text-faint);}

  input[type=range]{
    -webkit-appearance:none;appearance:none;
    flex:1;height:3px;background:var(--line);border-radius:2px;outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:#fff;cursor:pointer;
    box-shadow:0 0 0 3px rgba(255,255,255,.12);
  }
  input[type=range]::-moz-range-thumb{width:17px;height:17px;border-radius:50%;background:#fff;border:none;cursor:pointer;}
  .slider-row{display:flex;align-items:center;gap:10px;margin:10px 0 2px;}
  .slider-lbl{font-family:var(--font-mono);font-size:9.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;}

  .ticket{
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px;
    margin-bottom:12px;
    cursor:pointer;
    display:flex;justify-content:space-between;align-items:center;
  }
  .ticket:active{opacity:.7;}
  .ticket .tname{font-family:var(--font-display);font-size:19px;font-weight:700;}
  .ticket .tsub{color:var(--text-dim);font-size:12px;margin-top:2px;}
  .ticket .tprice{font-family:var(--font-mono);font-size:16px;font-variant-numeric:tabular-nums;}

  /* ready-mission cards (Nike-style big number) */
  .ticket2{border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;cursor:pointer;}
  .ticket2:active{opacity:.75;}
  .t2-top{display:flex;justify-content:space-between;align-items:baseline;}
  .t2-big{font-family:var(--font-display);font-style:italic;font-weight:700;font-size:30px;letter-spacing:-.01em;}
  .t2-price{font-family:var(--font-mono);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;}
  .t2-type{font-size:12.5px;color:var(--text-dim);margin-top:2px;}
  .t2-tagline{font-size:12px;color:var(--text-faint);margin-top:2px;margin-bottom:10px;}
  .t2-goal{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;}
  .t2-goal-text{font-size:12px;color:var(--text-dim);}
  .t2-edit{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);background:none;border:none;cursor:pointer;text-decoration:underline;white-space:nowrap;flex-shrink:0;}
  .t2-brand{font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);border:1px solid var(--line);padding:3px 9px;border-radius:10px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;}
  .t2-participants{font-family:var(--font-mono);font-size:13px;color:var(--text-dim);white-space:nowrap;}

  /* ЦУЦ tabs */
  .cuc-tabs{display:flex;gap:4px;margin:16px 0 18px;border:1px solid var(--line);border-radius:14px;padding:4px;}
  .cuc-tab{flex:1;text-align:center;padding:8px 4px;border-radius:10px;font-family:var(--font-mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.02em;color:var(--text-faint);cursor:pointer;line-height:1.35;transition:background .15s,color .15s;}
  .cuc-tab.active{background:#fff;color:#000;}

  .toggle-row{
    display:flex;justify-content:space-between;align-items:center;
    border:1px solid var(--line);border-radius:14px;
    padding:13px 14px;margin-bottom:10px;
  }
  .toggle-row .t-title{font-size:13.5px;font-weight:600;}
  .toggle-row .t-desc{font-size:11.5px;color:var(--text-faint);margin-top:3px;line-height:1.4;max-width:210px;}
  .toggle-row.disabled{opacity:.4;}
  .switch{
    width:42px;height:24px;border-radius:14px;border:1px solid var(--line);
    background:var(--surface-2);position:relative;flex-shrink:0;cursor:pointer;
  }
  .switch i{
    position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
    background:var(--text-faint);transition:transform .15s, background .15s;
  }
  .switch.on{background:var(--invert-bg);border-color:var(--invert-bg);}
  .switch.on i{transform:translateX(18px);background:var(--invert-text);}

  .mentor-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin:0 -20px;padding-left:20px;padding-right:20px;}
  .mentor-card{
    flex:0 0 128px;border:1px solid var(--line);border-radius:14px;
    padding:12px;background:var(--surface);
  }
  .mentor-card.active{border-color:#fff;background:var(--surface-3);}
  .mentor-card .mname{font-size:12.5px;font-weight:700;margin-top:6px;cursor:pointer;}
  .mentor-card .mtag{font-family:var(--font-mono);font-size:9.5px;color:var(--text-faint);margin-top:3px;text-transform:uppercase;cursor:pointer;}
  .mentor-icon{width:44px;height:44px;border-radius:50%;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;cursor:pointer;background-size:cover;background-position:center top;position:relative;overflow:hidden;}
  .mentor-card{position:relative;}
  .rec-badge{position:absolute;top:8px;right:8px;background:#fff;color:#000;font-family:var(--font-mono);font-size:8.5px;font-weight:700;padding:2px 5px;border-radius:8px;letter-spacing:.02em;text-transform:uppercase;}
  .mentor-info-btn{margin-top:8px;width:100%;background:none;border:1px solid var(--line);border-radius:8px;color:var(--text-faint);font-family:var(--font-mono);font-size:9px;padding:5px 0;cursor:pointer;text-transform:uppercase;letter-spacing:.03em;}
  .mentor-info-btn:active{opacity:.6;}

  /* full mentor profile */
  .mentor-profile{border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:10px;}
  .mp-head{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
  .mp-photo{width:64px;height:64px;border-radius:50%;flex-shrink:0;background:var(--surface-3);background-size:cover;background-position:center top;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:22px;}
  .mp-name{font-weight:700;font-size:16px;}
  .mp-price{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.02em;margin-top:3px;}
  .mp-intro{font-family:var(--font-display);font-style:italic;font-size:13px;color:var(--text-dim);border-left:2px solid var(--line);padding-left:10px;margin-bottom:14px;}
  .mp-row{margin-bottom:11px;}
  .mp-row:last-of-type{margin-bottom:0;}
  .mp-label{font-family:var(--font-mono);font-size:9px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);margin-bottom:3px;}
  .mp-text{font-size:12.5px;line-height:1.55;color:var(--text-dim);}

  .summary-line{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .summary-line:last-of-type{border-bottom:none;}
  .summary-line .k{color:var(--text-dim);}
  .summary-line .v{font-family:var(--font-mono);}
  .total-line{display:flex;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid #444;font-size:16px;font-weight:700;}

  .cosmo-msg{
    border:1px solid var(--line);border-radius:16px;padding:16px;
    font-size:13.5px;line-height:1.6;color:var(--text);
    background:var(--surface);
  }
  .cosmo-msg .who{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}

  .cam{
    aspect-ratio:3/4;border:1px solid var(--line);border-radius:16px;
    background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;position:relative;overflow:hidden;
  }
  .cam .dot{width:10px;height:10px;border-radius:50%;background:#fff;}
  .cam.recording .dot{animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}
  .cam .timer{font-family:var(--font-mono);font-size:13px;color:var(--text-dim);}
  .cam .rec-btn{
    width:60px;height:60px;border-radius:50%;border:3px solid #fff;background:transparent;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .cam .rec-btn i{width:22px;height:22px;border-radius:50%;background:#fff;}
  .cam.recording .rec-btn i{border-radius:5px;width:18px;height:18px;}

  .script-box{
    background:var(--surface-2);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;font-size:12.5px;line-height:1.5;color:var(--text-dim);
    margin-bottom:14px;
  }
  .script-box b{color:var(--text);}

  /* bottom nav */
  .navbar{
    flex-shrink:0;
    display:flex;
    border-top:1px solid var(--line);
    background:var(--bg);
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  .navbtn{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:10px 0 14px;background:none;border:none;color:var(--text-faint);cursor:pointer;
    font-family:var(--font-mono);font-size:9.5px;letter-spacing:.03em;text-transform:uppercase;
  }
  .navbtn.active{color:#fff;}
  .navbtn svg{width:20px;height:20px;}

  /* home */
  .mission-card{
    border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer;
  }
  .mission-card .mtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .mission-card .mtitle{font-weight:700;font-size:14px;}
  .mission-card .mtype{font-family:var(--font-mono);font-size:9.5px;color:var(--text-faint);border:1px solid var(--line);padding:2px 8px;border-radius:10px;text-transform:uppercase;}
  .track{height:5px;background:var(--surface-2);border-radius:4px;overflow:hidden;}
  .track i{display:block;height:100%;background:#fff;}
  .mission-meta{display:flex;justify-content:space-between;margin-top:8px;font-family:var(--font-mono);font-size:11px;color:var(--text-faint);}

  .fab{
    position:absolute;right:20px;bottom:80px;
    width:52px;height:52px;border-radius:50%;background:#fff;color:#000;
    display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:300;
    border:none;cursor:pointer;box-shadow:0 10px 24px rgba(0,0,0,.5);
  }

  /* profile */
  .avatar{
    width:52px;height:52px;border-radius:50%;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:20px;
  }
  .profile-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .stat-strip{
    display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
    border:1px solid var(--line);border-radius:16px;padding:14px 8px;
    cursor:pointer;margin-bottom:6px;
  }
  .stat-strip .cell{text-align:center;}
  .stat-strip .val{font-family:var(--font-mono);font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;}
  .stat-strip .lbl{font-size:9.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.03em;margin-top:3px;}
  .expand-hint{
    text-align:center;font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);
    margin-bottom:14px;
  }
  .type-breakdown{
    max-height:0;overflow:hidden;transition:max-height .28s ease;
  }
  .type-breakdown.open{max-height:420px;}
  .type-row{
    display:flex;justify-content:space-between;align-items:center;
    border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:12.5px;
  }
  .type-row .tn{font-weight:600;}
  .type-row .tv{font-family:var(--font-mono);color:var(--text-dim);font-size:11.5px;}
  .badge-row{display:flex;gap:8px;flex-wrap:wrap;}
  .badge{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:14px;}

  /* rank ladder */
  .rank-ladder{display:flex;align-items:flex-start;margin:16px 0 6px;}
  .rl-step{flex:1;text-align:center;position:relative;}
  .rl-step:not(:first-child)::before{
    content:'';position:absolute;top:5px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0;
  }
  .rl-step.done:not(:first-child)::before{background:#fff;}
  .rl-dot{width:12px;height:12px;border-radius:50%;background:var(--surface-2);border:2px solid var(--line);margin:0 auto 6px;position:relative;z-index:1;}
  .rl-step.done .rl-dot{background:#fff;border-color:#fff;}
  .rl-step.current .rl-dot{width:14px;height:14px;box-shadow:0 0 0 3px rgba(255,255,255,.18);}
  .rl-icon{font-size:14px;opacity:.35;margin-bottom:2px;}
  .rl-step.done .rl-icon,.rl-step.current .rl-icon{opacity:1;}
  .rl-label{font-family:var(--font-mono);font-size:7.5px;text-transform:uppercase;letter-spacing:.02em;color:var(--text-faint);line-height:1.3;padding:0 2px;}
  .rl-step.done .rl-label,.rl-step.current .rl-label{color:var(--text-dim);}

  /* fleet */
  .fleet-row{border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:17px;letter-spacing:2px;line-height:1.6;word-break:break-word;}

  /* badges v2 */
  .badge-row2{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .badge2{border:1px solid var(--line);border-radius:12px;padding:9px 4px;text-align:center;cursor:pointer;}
  .badge2.locked{opacity:.4;}
  .badge2.active{border-color:#fff;}
  .badge2-icon{font-size:19px;margin-bottom:4px;}

  handshake: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M2 12l4-4 4 3 3-3 3 3 4-4 2 2-5 6-3-2-2 2-3-2-3 2z"/></svg>',
  flex: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 13c2-3 4-4 6-3l2 1 4-2c2-1 4 0 5 2l1 3-2 1-1-2-2 4-4 2-5-2-2-3z"/></svg>',

function icon(name, cls){ return `<span class="icon${cls?' '+cls:''}">${ICONS[name]||''}</span>`; }

const USER_NAME = 'Денис';
const USER_NAME_EN = 'Alex';

// ==== Персистентность (MVP, Supabase) ====================================
// ВНИМАНИЕ: на этом этапе доступ к базе идёт по anon key без проверки
// подписи Telegram initData — осознанный компромисс для закрытого теста.
// Перед публичным запуском заменить на проверку через Edge Function.
const SUPABASE_URL = 'https://digeevjdjzrkogninmbt.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRpZ2Vldmpkanpya29nbmlubWJ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNTA5MjgsImV4cCI6MjEwMzkyNjkyOH0.0bGZPfKL9W5JvyHE9nYkDVZxRvoSlvf5HotuWJrHwqc';
let sb = null;
try {
  if (window.supabase && window.supabase.createClient) {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
} catch (e) { console.warn('Supabase init failed', e); }

function getTelegramId(){
  try {
    const u = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user;
    if (u && u.id) return u.id;
  } catch (e) {}
  // Вне Telegram (тест в обычном браузере) — держим один и тот же id на устройстве.
  try {
    let devId = localStorage.getItem('tyaga_dev_id');
    if (!devId) { devId = String(900000000 + Math.floor(Math.random()*99999999)); localStorage.setItem('tyaga_dev_id', devId); }
    return Number(devId);
  } catch (e) { return 999000001; }
}
const TG_ID = getTelegramId();
let dbUserIsNew = false;
// Set true only once hydrateFromDB() has completed a full round-trip. Write functions
// that push state.profile.* to Supabase must check this first, so a slow/incomplete
// hydration can never overwrite a real user's DB row with the local default profile.
let dbHydrated = false;

function isOnboarded(){
  try { return localStorage.getItem('tyaga_onboarded_' + TG_ID) === '1'; } catch(e){ return false; }
}
function markOnboarded(){
  try { localStorage.setItem('tyaga_onboarded_' + TG_ID, '1'); } catch(e){}
}
function getStoredLang(){
  try {
    const v = localStorage.getItem('tyaga_lang_' + TG_ID);
    return (v === 'en' || v === 'ru') ? v : null;
  } catch(e){ return null; }
}
function setStoredLang(lang){
  try { localStorage.setItem('tyaga_lang_' + TG_ID, lang); } catch(e){}
}
function getStoredNotify(){
  try { return localStorage.getItem('tyaga_notify_' + TG_ID) === '1'; } catch(e){ return false; }
}
function setStoredNotify(v){
  try { localStorage.setItem('tyaga_notify_' + TG_ID, v ? '1' : '0'); } catch(e){}
}
function toggleNotify(){
  state.settings.notifyOn = !state.settings.notifyOn;
  setStoredNotify(state.settings.notifyOn);
  render();
}

/* ===== 18+ gate ===== *
 * Nothing enforced this before — age was a free-text optional onboarding
 * field with no minimum. Real money now moves through this app, so every
 * checkout path (mission tariffs, and later merch/mentors) must pass through
 * here first. The localStorage flag is just a UX shortcut to skip asking
 * twice on the same device; the actual enforcement is server-side, in the
 * create-payment edge function, which refuses to create a charge unless
 * users.age_confirmed_18 is true in the database. */
function getStoredAge18(){
  try { return localStorage.getItem('tyaga_age18_' + TG_ID) === '1'; } catch(e){ return false; }
}
function setStoredAge18(){
  try { localStorage.setItem('tyaga_age18_' + TG_ID, '1'); } catch(e){}
}
function isAge18Confirmed(){
  return state.age18Confirmed || getStoredAge18();
}
// Where to resume once the gate is passed — set right before navigating to
// 'ageGate', read (and cleared) by confirmAge18().
let age18ResumeAction = null;
function requireAge18ThenRun(resumeFn){
  if (isAge18Confirmed()) { resumeFn(); return; }
  age18ResumeAction = resumeFn;
  go('ageGate');
}
async function confirmAge18(){
  state.age18Confirmed = true;
  setStoredAge18();
  if (sb) {
    try { await sb.from('users').update({ age_confirmed_18: true }).eq('telegram_id', TG_ID); }
    catch(e){ console.warn('age_confirmed_18 save failed — продолжаем локально', e); }
  }
  const resume = age18ResumeAction;
  age18ResumeAction = null;
  if (resume) resume(); else back();
}

/* ===== Реальная оплата (ЮKassa) — заменяет старые Apple Pay / Карта
 * кнопки, которые просто переводили на confirm() без списания. ===== */
const PAYMENT_FUNCTIONS_BASE = SUPABASE_URL + '/functions/v1/';

// kind: 'habit' | 'result' | 'askeza' — picks the right total-price function,
// state bucket, and (once payment is verified) the right addXMissionFromForm().
const PAYMENT_KIND_CONFIG = {
  habit:  { total: () => totalPrice(),        confirmScreen: 'confirm',  label: () => tr('Привычка','Habit') },
  result: { total: () => totalResultPrice(),   confirmScreen: 'rConfirm', label: () => tr('Результат','Result') },
  askeza: { total: () => totalAskezaPrice(),   confirmScreen: 'aConfirm', label: () => tr('Аскеза','Ascesis') },
};

async function initiatePayment(kind){
  requireAge18ThenRun(() => doInitiatePayment(kind));
}

async function doInitiatePayment(kind){
  const cfg = PAYMENT_KIND_CONFIG[kind];
  if (!cfg) return;
  const amount = cfg.total();
  if (amount <= 0) {
    // Nothing to charge (e.g. a free fast-track "ready ticket" mission whose
    // duration carries price:0) — ЮKassa correctly refuses to create a ₽0
    // payment, which used to leave the user stuck on the payment screen with
    // no visible error. Skip checkout entirely and go straight to the
    // confirmation screen, which is what actually creates the mission.
    state.payment = null;
    go(cfg.confirmScreen);
    return;
  }
  state.payment = { kind, status:'creating', error:null, paymentId:null };
  render();
  try {
    const res = await fetch(PAYMENT_FUNCTIONS_BASE + 'create-payment', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+SUPABASE_ANON_KEY, 'apikey':SUPABASE_ANON_KEY },
      body: JSON.stringify({
        user_id: TG_ID,
        purpose: 'tariff',
        amount_kopeks: Math.round(amount*100),
        description: 'ТЯГА · ' + cfg.label(),
        reference: { kind },
      }),
    });
    const data = await res.json().catch(()=>null);
    if (!res.ok || !data || !data.confirmation_url) {
      state.payment.status = 'error';
      state.payment.error = (data && data.error) || ('http_'+res.status);
      go('awaitingPayment');
      return;
    }
    state.payment.paymentId = data.payment_id;
    state.payment.status = 'awaiting';
    go('awaitingPayment');
    openPaymentUrl(data.confirmation_url);
    pollPayment();
  } catch(e){
    state.payment.status = 'error';
    state.payment.error = String(e);
    go('awaitingPayment');
  }
}

function openPaymentUrl(url){
  try {
    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openLink) {
      window.Telegram.WebApp.openLink(url, { try_instant_view:false });
      return;
    }
  } catch(e){}
  window.open(url, '_blank');
}

let paymentPollHandle = null;
function pollPayment(){
  if (paymentPollHandle) clearInterval(paymentPollHandle);
  let elapsed = 0;
  paymentPollHandle = setInterval(async () => {
    elapsed += 2000;
    if (!state.payment || !state.payment.paymentId) { clearInterval(paymentPollHandle); return; }
    try {
      const { data } = await sb.from('payments').select('status').eq('id', state.payment.paymentId).maybeSingle();
      if (data && data.status === 'succeeded') {
        clearInterval(paymentPollHandle);
        state.payment.status = 'succeeded';
        const cfg = PAYMENT_KIND_CONFIG[state.payment.kind];
        safeRender();
        go(cfg.confirmScreen, {replace:true});
      } else if (data && data.status === 'canceled') {
        clearInterval(paymentPollHandle);
        state.payment.status = 'canceled';
        safeRender();
      }
    } catch(e){ /* keep polling — a transient network hiccup shouldn't abort the wait */ }
    if (elapsed > 120000 && state.payment && state.payment.status === 'awaiting') {
      clearInterval(paymentPollHandle);
      state.payment.status = 'timeout';
      safeRender();
    }
  }, 2000);
}
function cancelPaymentWait(){
  if (paymentPollHandle) clearInterval(paymentPollHandle);
  state.payment = null;
  back();
}
function recheckPaymentNow(){
  if (state.payment) { state.payment.status = 'awaiting'; render(); pollPayment(); }
}
// tr(ru, en) — returns the string matching state.lang. Called `tr` (not `t`)
// because several screen functions already use a local variable named `t`.
function tr(ru, en){
  return (state && state.lang === 'en') ? en : ru;
}
// tf(field) — picks the right language out of a {ru, en} data field used in
// content objects (mentors, badges, merch, quiz, ready-made missions, etc).
// Passing a plain string through is safe (returned unchanged).
function tf(field){
  if (field && typeof field === 'object' && ('ru' in field)) {
    return (state.lang === 'en' ? field.en : field.ru) || field.ru || field.en || '';
  }
  return field;
}

async function hydrateFromDB(){
  if (!sb) return;
  try {
    const tgUser = (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) || {};
    let { data: userRow } = await sb.from('users').select('*').eq('telegram_id', TG_ID).maybeSingle();
    if (!userRow) {
      dbUserIsNew = true;
      const { data: inserted } = await sb.from('users').insert({
        telegram_id: TG_ID,
        username: tgUser.username || null,
        first_name: tgUser.first_name || null,
      }).select('*').maybeSingle();
      userRow = inserted;
      // Новый реальный пользователь — обнуляем демо-цифры вместо примера "Денис Соколов".
      state.profile.name = tgUser.first_name || state.profile.name;
      state.profile.ls.total = 0;
      state.profile.completedByType = { 'Привычка':0, 'Результат':0, 'Аскеза':0 };
      state.profile.launchedByType = { 'Привычка':0, 'Результат':0, 'Аскеза':0 };
      state.profile.streak = { current:0, longest:0 };
      state.profile.followers = 0;
      state.profile.support = { given:0 };
      state.profile.crew = { inspiredCount:0, clones: [] };
      state.profile.completed = [];
      state.missions = [];
    }
    if (userRow) {
      state.profile.ls.total = userRow.ls_total;
      state.profile.streak.current = userRow.streak_current;
      state.profile.streak.longest = userRow.streak_longest;
      state.profile.followers = userRow.followers;
      state.profile.support.given = userRow.support_given;
      state.profile.crew.inspiredCount = userRow.crew_inspired_count;
      if (userRow.completed_by_type && Object.keys(userRow.completed_by_type).length) state.profile.completedByType = userRow.completed_by_type;
      if (userRow.launched_by_type && Object.keys(userRow.launched_by_type).length) state.profile.launchedByType = userRow.launched_by_type;
      if (userRow.bio) state.profile.bio = userRow.bio;
      if (userRow.avatar_url) state.profile.avatarUrl = userRow.avatar_url;
      // Has the user ever actually opened the Telegram chat with their mentor?
      // cosmonaut_greeted flips true only once the bot has sent its onboarding
      // script — i.e. the user pressed Start / sent it a first message. Until
      // then the mentor exists in the database but has never actually spoken
      // to them, so the app keeps nudging them to go activate the chat.
      state.profile.mentorActivated = !!userRow.cosmonaut_greeted;
      if (userRow.age_confirmed_18) state.age18Confirmed = true;
      // Local storage wins if the viewer already picked a language on this device;
      // otherwise fall back to what's saved for them in the DB (defaults to 'ru').
      if (!getStoredLang() && (userRow.language === 'en' || userRow.language === 'ru')) {
        state.lang = userRow.language;
      }
    }
    if (!dbUserIsNew) {
      const { data: activeMissions } = await sb.from('missions').select('*').eq('user_id', TG_ID).eq('status','active').order('created_at', { ascending:false });
      if (activeMissions) {
        state.missions = activeMissions.map(m => ({ title:m.title, type:m.type, progress:m.progress, dbId:m.id, mentor:m.mentor||null, reportCount:m.report_count||0, totalDays:m.target_days||null, lastReportDate:m.last_report_date||null, isPublic:!!m.public }));
      }
      // Profile's "Завершённые миссии" was reading state.profile.completed, which
      // was only ever initialized to [] and never actually filled in from the DB —
      // so finished missions never showed up there no matter how many the user
      // completed. Pull them in here, oldest first so index 0 is the user's very
      // first completion (firstCosmic — matches the achievement check elsewhere),
      // then reverse for display so the newest completion shows on top.
      const { data: completedMissions } = await sb.from('missions').select('*').eq('user_id', TG_ID).eq('status','completed').order('finished_at', { ascending:true });
      if (completedMissions) {
        state.profile.completed = completedMissions.map((m,i) => ({
          title: m.title,
          type: m.type,
          days: m.report_count || m.target_days || 0,
          report: m.meaning || '',
          finished: m.finished_at ? new Date(m.finished_at).toLocaleDateString(state.lang==='en'?'en-US':'ru-RU') : '',
          firstCosmic: i===0,
        })).reverse();
      }
    }
    dbHydrated = true;
    safeRender();
  } catch (e) { console.warn('hydrateFromDB failed — работаем в локальном режиме', e); }
}

}

async function dbLogProgress(mission){
  if (!sb || !mission || !mission.dbId) return;
  try {
    const today = new Date().toISOString().slice(0,10);
    await sb.from('progress_logs').upsert({
      mission_id: mission.dbId, user_id: TG_ID, log_date: today, completed: true
    }, { onConflict: 'mission_id,log_date' });
    const patch = { progress: mission.progress, last_report_date: today };
    if (mission.progress >= 100) { patch.status = 'completed'; patch.finished_at = new Date().toISOString(); }
    await sb.from('missions').update(patch).eq('id', mission.dbId);
  } catch (e) { console.warn('dbLogProgress failed', e); }
}

async function loadIlluminatorPosts(){
  if (!sb) return;
  try {
    const { data: posts } = await sb.from('illuminator_posts').select('*').eq('public', true).order('created_at', { ascending:false }).limit(30);
    state.illumPosts = posts || [];
    const { data: mySupports } = await sb.from('illuminator_supports').select('post_id').eq('user_id', TG_ID);
    (mySupports||[]).forEach(r => { state.illumSupported[r.post_id] = true; });
    safeRender();
  } catch (e) { console.warn('loadIlluminatorPosts failed', e); }
}

async function dbToggleSupport(postId, nowSupported){
  if (!sb) return;
  try {
    if (nowSupported) {
      await sb.from('illuminator_supports').insert({ post_id: postId, user_id: TG_ID });
    } else {
      await sb.from('illuminator_supports').delete().eq('post_id', postId).eq('user_id', TG_ID);
    }
    const post = state.illumPosts.find(p=>p.id===postId);
    if (post) await sb.from('illuminator_posts').update({ support_count: post.support_count }).eq('id', postId);
  } catch (e) { console.warn('dbToggleSupport failed', e); }
}

// Generalized proof upload: every post is video, photo, or text, and every
// post carries which mission it belongs to and whether it's the mission's
// one main promise or a dated progress report on it.
// A post always gets stored here — public or not — because the owner's own
// profile mission-thread reads from this same table with no privacy filter.
// Only the global Illuminator feed query filters to public:true (see
// loadIlluminatorPosts). isPublic is the mission's own public flag
// (state.missions[i].isPublic, mirrored from missions.public in the DB) —
// resolve it via missionPublicFlag(missionId) before calling this.
async function uploadIlluminatorProof(opts){
  const { kind, blob, caption, missionType, missionTitle, missionId, isPromise, reportDay, reportTotalDays, isPublic } = opts;
  if (!sb) return null;
  try {
    const base = {
      user_id: TG_ID, author_name: state.profile.name, mission_type: missionType || null,
      mission_title: missionTitle || null, mission_id: missionId || null, is_promise: !!isPromise,
      report_day: reportDay || null, report_total_days: reportTotalDays || null,
      caption: caption || '', kind, public: !!isPublic
    };
    if (kind === 'text'){
      const { data: inserted } = await sb.from('illuminator_posts').insert({ ...base, text_body: caption || '' }).select('*').maybeSingle();
      return inserted;
    }
    const isPhoto = kind === 'photo';
    const bucket = isPhoto ? 'illuminator-photos' : 'illuminator-videos';
    const ext = isPhoto ? 'jpg' : 'webm';
    const fileName = `${TG_ID}_${Date.now()}.${ext}`;
    const { error: upErr } = await sb.storage.from(bucket).upload(fileName, blob, { contentType: blob.type || (isPhoto?'image/jpeg':'video/webm') });
    if (upErr) throw upErr;
    const { data: pub } = sb.storage.from(bucket).getPublicUrl(fileName);
    const url = pub && pub.publicUrl;
    const { data: inserted } = await sb.from('illuminator_posts').insert({
      ...base, [isPhoto ? 'photo_url' : 'video_url']: url
    }).select('*').maybeSingle();
    return inserted;
  } catch (e) { console.warn('uploadIlluminatorProof failed', e); return null; }
}
// Back-compat alias used by the video recording flow below.
async function uploadIlluminatorVideo(blob, caption, missionType){
  return uploadIlluminatorProof({ kind:'video', blob, caption, missionType });
}

function openQuiz(target){
  state.quiz = {};
  state.quizOwn = {};
  state.quizTarget = target;
  go('quiz');
}
function answerQuiz(qi, type){ state.quiz[qi] = type; render(); }
function retakeQuiz(){ state.quizResult = null; state.quiz = {}; state.quizOwn = {}; render(); }
function finishQuiz(){
  const counts = {};
  Object.values(state.quiz).forEach(t=>{ if(t==='own') return; counts[t]=(counts[t]||0)+1; });
  let best=null, bestN=-1;
  Object.entries(counts).forEach(([t,n])=>{ if(n>bestN){best=t;bestN=n;} });
  // Один раз пройденный опросник сохраняется как результат (в реальном приложении — на бэкенде,
  // для нас и аналитики), и дальше просто применяется — повторно проходить не нужно.
  state.quizResult = { type: best, answers: {...state.quiz}, own: {...state.quizOwn}, completedAt: Date.now() };
  applyQuizResult();
  back();
}
function applyQuizResult(){
  if(!state.quizResult || !state.quizResult.type) return;
  if(!state.form.psychotype) state.form.psychotype = state.quizResult.type;
  if(!state.result.psychotype) state.result.psychotype = state.quizResult.type;
  if(!state.askeza.psychotype) state.askeza.psychotype = state.quizResult.type;
}

function go(screen, opts){
  opts = opts || {};
  if(state.screen==='illumRecord' && screen!=='illumRecord') stopIllumMedia();
  if(opts.replace){ /* no push */ } else { state.history.push(state.screen); }
  state.screen = screen;
  render();
}
function back(){
  if(state.screen==='illumRecord') stopIllumMedia();
  const prev = state.history.pop();
  state.screen = prev || 'home';
  render();
}

function effectiveHabitName(){
  if(state.form.fastTrack) return state.form.ticketGoal;
  return (state.form.habitCustom && state.form.habitCustom.trim()) || state.form.habitName;
}
function effectiveTheme(){
  return state.form.theme==='Другое' ? state.form.themeOther : state.form.theme;
}

function totalPrice(){
  let sum = 0;
  if(state.form.duration) sum += state.form.duration.price;
  if(state.form.mentor && state.form.mentor.price) sum += state.form.mentor.price;
  if(state.form.boosts.stake) sum += 0; // stake is charged only on failure, not added to purchase price
  if(state.form.boosts.public) sum += 1000;
  return sum;
}

function chip(label, active, onclick){
  return `<div class="chip ${active?'active':''}" onclick="${onclick}">${label}</div>`;
}

// Real ЮKassa checkout card, shared by the three payment screens (Habit/
// Result/Ascesis) — replaces the old two fake "Apple Pay" / "Карта" rows
// that just navigated to confirm() with nothing actually charged.
function paymentCard(kind, stakeNote){
  const amount = PAYMENT_KIND_CONFIG[kind].total();
  if (amount <= 0) {
    // Free mission (e.g. a fast-track "ready ticket") — nothing to charge,
    // so skip the ЮKassa card entirely rather than offering a ₽0 "payment"
    // that the backend would (correctly) refuse to process.
    return `
      <div class="stack">
        <button class="btn primary block" onclick="initiatePayment('${kind}')">${tr('Начать бесплатно','Start for free')}</button>
      </div>
      <p class="hint" style="margin-top:10px;">${tr('Эта программа бесплатная — оплата не требуется.','This program is free — no payment needed.')}</p>
    `;
  }
  return `
    <div class="stack">
      <div class="card" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;" onclick="initiatePayment('${kind}')">
        <span>${tr('Карта · ЮKassa','Card · YooKassa')}</span><span class="hint">${amount}₽ →</span>
      </div>
    </div>
    <p class="hint" style="margin-top:10px;">${tr('Оплата открывается в браузере Telegram — после оплаты ты автоматически вернёшься сюда.','Checkout opens inside Telegram\'s browser — you\'ll be brought back here automatically once it\'s done.')}</p>
    ${stakeNote ? `<p class="hint" style="margin-top:14px;">${tr('Отдельно сохраним карту для усиления обещания — спишется один раз, только при провале.','We\'ll separately save a card to back up your promise — it\'s charged once, only if you fail.')}</p>` : ''}
  `;
}

// Small step-badge codes like "3П"/"5Р"/"2А" use a trailing Cyrillic letter for
// the mission type (Привычка/Результат/Аскеза); mirror it in English as H/R/V.
const STEP_LETTER_EN = { 'П':'H', 'Р':'R', 'А':'V' };
function stepLabel(step){
  if (!step || state.lang !== 'en') return step;
  const m = /^(\d+)([ПРА])$/.exec(step);
  if (m) return m[1] + STEP_LETTER_EN[m[2]];
  const m2 = /^(D\d)А$/.exec(step);
  if (m2) return m2[1] + 'V';
  return step;
}
function screenShell(inner, {back:showBack=true, step=null} = {}){
  return `
    <div class="backbar">
      ${showBack ? `<button class="back" onclick="back()">${tr('← Назад','← Back')}</button>` : `<span></span>`}
      ${step ? `<span class="step">${stepLabel(step)}</span>` : ''}
    </div>
    ${inner}
  `;
}

// Habits are frequent/low-friction, so text/photo are allowed alongside video;
// Results usually need visible/verifiable proof; an Ascesis is an absence of
// action, so an honest text check-in is enough — video is optional, not required.
const PROOF_RULES = {
  'Привычка': { video:true, photo:true, text:true, note:{ru:'Видео, фото или текстовый отчёт — на твой выбор.',en:'Video, photo, or a text report — your choice.'} },
  'Результат': { video:true, photo:true, text:false, note:{ru:'Нужно фото или видео — итог должен быть виден.',en:'A photo or video is required — the result needs to be visible.'} },
  'Аскеза': { video:true, photo:false, text:true, note:{ru:'Достаточно честной текстовой отметки, видео — по желанию.',en:'An honest text check-in is enough; video is optional.'} },
};

// Lightweight "relatable to this viewer" ranking: posts whose mission type
// matches a type the viewer has launched (active or historical) bubble up,
// then ties break on support count, so the feed leans toward what a given
// pilot is actually likely to find relevant rather than pure recency.
function recommendedIlluminatorPosts(){
  const myTypes = {};
  (state.missions||[]).forEach(m => { if(m.type) myTypes[m.type] = (myTypes[m.type]||0) + 3; });
  Object.entries(state.profile.launchedByType||{}).forEach(([t,n]) => { myTypes[t] = (myTypes[t]||0) + Math.min(n,5); });
  // Real posts only — ILLUMINATOR_POSTS is placeholder/demo content (Марина/
  // Игорь/Света) with no real video, rendered as a flat gradient box with a
  // fake play circle. Mixing it into the live feed is exactly what made real
  // posts look "messed up with random circles above every post"; only fall
  // back to the demo set when there are no real posts at all, so a brand-new
  // account isn't staring at an empty feed.
  const all = state.illumPosts.length ? state.illumPosts : ILLUMINATOR_POSTS;
  return all.map((p,i) => ({ p, i, score: (myTypes[p.mission_type || p.type] || 0) + (p.support_count||0)*0.1 }))
    .sort((a,b) => b.score - a.score || a.i - b.i)
    .map(x => x.p);
}

// The feed must not show a card per report — every report belongs under its
// mission's one main/promise video, so the feed collapses to one card per
// mission with a "N reports" count, and tapping it opens the full thread
// (the mission's page, whichever user it belongs to).
function feedGroupKey(p){
  if(p.mission_id) return 'm:'+p.mission_id;
  const title = p.mission_title || (p.missionTitle ? tf(p.missionTitle) : '');
  const author = p.user_id || p.author_name || p.author || '';
  return 'u:'+author+'|'+title;
}
function groupIlluminatorFeed(posts){
  const groups = {}; const order = [];
  posts.forEach(p => {
    const key = feedGroupKey(p);
    if(!groups[key]){ groups[key] = { key, posts:[], promise:null }; order.push(key); }
    const g = groups[key];
    g.posts.push(p);
    if((p.isPromise || p.is_promise) && !g.promise) g.promise = p;
  });
  return order.map(key => {
    const g = groups[key];
    return { key: g.key, rep: g.promise || g.posts[0], count: g.posts.length, posts: g.posts };
  });
}

// A small always-visible badge stating exactly what a post is: the mission's
// one main promise video, or a dated/staged progress report on it — so
// tapping into any card in the feed never leaves that ambiguous.
function postContextBadge(p){
  const title = p.missionTitle ? tf(p.missionTitle) : (p.mission_title || '');
  const kindWord = { video: tr('видео-обещание','promise video'), photo: tr('фото-обещание','promise photo'), text: tr('текстовое обещание','text promise') }[p.kind] || tr('видео-обещание','promise video');

    return `<div class="post-context promise">${icon('target')} ${tr('Главное','Main')} ${kindWord}${title?' · '+title:''}</div>`;
  }
  const day = p.day ?? p.report_day, totalDays = p.totalDays ?? p.report_total_days, milestone = p.milestone;
  let where = '';
  if(day && totalDays) where = tr(`день ${day} из ${totalDays}`, `day ${day} of ${totalDays}`);
  else if(milestone) where = tr(`этап ${milestone}`, `milestone ${milestone}`);

}

function isValidMediaUrl(u){
  return !!u && typeof u==='string' && /^(https?:|data:)/.test(u.trim());
}

    const media = isValidMediaUrl(p.video_url)

    return `<div class="post">

function markMerchPurchased(id){

}

function markMerchQueued(id){
  const item = state.merch.items.find(i=>i.id===id);
  if(!item || state.merch.queued[id]) return;
  state.merch.queued[id] = true;
  item.queueLen += 1;
}

function unmarkMerch(id, action){
  const item = state.merch.items.find(i=>i.id===id);
  if(action==='preorder'){
    state.merch.preordered[id] = false;
    if(item) item.preorders = Math.max(0, item.preorders - 1);
  } else if(action==='buy'){
    state.merch.purchased[id] = false;
  } else if(action==='queue'){
    state.merch.queued[id] = false;
    if(item) item.queueLen = Math.max(0, item.queueLen - 1);
  }
}

  };

function closeMerchOrder(){
  state.merch.orderForm = null;
  back();

async function submitMerchOrder(){
  if (!isAge18Confirmed()) { requireAge18ThenRun(submitMerchOrder); return; }
  const f = state.merch.orderForm;
  if(!f) return;
  const item = state.merch.items.find(i=>i.id===f.itemId);
  if(!item) return;
  if(!f.contact || !f.contact.trim()){
    state.merch.orderFormError = tr('Укажи контакт — телеграм или телефон','Enter a contact — Telegram or phone');
    render();
    return;
  }
  state.merch.orderFormError = null;

  const record = {
    id: 'local'+Date.now(),
    itemId: item.id,
    itemName: (state.lang==='en' ? item.name.en : item.name.ru) || item.name.ru,
    action: f.action,
    price: item.price,
    deposit: item.deposit || null,
    size: f.size || null,
    contact: f.contact.trim(),
    name: (f.name||'').trim(),
    note: (f.note||'').trim(),
    status: 'new',
  };

  if(f.action==='preorder') markMerchPreordered(item.id);
  else if(f.action==='buy') markMerchPurchased(item.id);
  else if(f.action==='queue') markMerchQueued(item.id);

  state.merch.orders.unshift(record);
  state.merch.orderForm = null;

  if(sb){
    try{
      const { data } = await sb.from('merch_orders').insert({
        user_id: TG_ID,
        item_id: item.id,
        item_name: record.itemName,
        action: f.action,
        price: item.price,
        deposit: item.deposit || null,
        size: f.size || null,
        contact: record.contact,
        name: record.name || null,
        note: record.note || null,
      }).select('*').maybeSingle();
      if(data) record.id = data.id;
    } catch(e){ console.warn('merch order insert failed — сохранено только локально', e); }
  }

  go('merchBucket', {replace:true});
}

async function cancelMerchOrder(orderId){
  const idx = state.merch.orders.findIndex(o=>o.id===orderId);
  if(idx===-1) return;
  const order = state.merch.orders[idx];
  unmarkMerch(order.itemId, order.action);
  state.merch.orders.splice(idx,1);
  render();
  if(sb && !String(orderId).startsWith('local')){
    try{ await sb.from('merch_orders').update({status:'cancelled'}).eq('id', orderId); }
    catch(e){ console.warn('merch order cancel failed to sync', e); }
  }
}

async function loadMerchOrders(){
  if(!sb || state.merch.ordersLoaded) return;
  try{
    const { data } = await sb.from('merch_orders').select('*').eq('user_id', TG_ID).neq('status','cancelled').order('created_at', {ascending:false});
    if(data && data.length){
      state.merch.orders = data.map(o=>({
        id:o.id, itemId:o.item_id, itemName:o.item_name, action:o.action,
        price:o.price, deposit:o.deposit, size:o.size, contact:o.contact, name:o.name, note:o.note, status:o.status,
      }));
      data.forEach(o=>{
        if(o.action==='preorder') state.merch.preordered[o.item_id] = true;
        else if(o.action==='buy') state.merch.purchased[o.item_id] = true;
        else if(o.action==='queue') state.merch.queued[o.item_id] = true;
      });
    }
    state.merch.ordersLoaded = true;
    safeRender();
  } catch(e){ console.warn('loadMerchOrders failed — работаем в локальном режиме', e); }
}

function submitMerchSuggestion(){
  const text = state.merch.suggestionDraft.trim();
  if(!text) return;
  state.merch.suggestions.unshift({ id:'s'+Date.now(), text, votes:1, mine:true });
  state.merch.suggestionDraft = '';
  render();
}

function toggleMerchVote(id){
  const s = state.merch.suggestions.find(x=>x.id===id);
  if(!s) return;
  if(s.mine){ s.mine=false; s.votes=Math.max(0,s.votes-1); }
  else { s.mine=true; s.votes+=1; }
  render();
}

function dopuskTotal(p){ return Object.values(p.completedByType).reduce((a,b)=>a+b,0); }
function driveTotal(p){ return Object.values(p.launchedByType).reduce((a,b)=>a+b,0); }

function computeDopuskRank(completed){
  let idx = 0;
  for(let i=0;i<DOPUSK_RANKS.length;i++){ if(completed >= DOPUSK_RANKS[i].min) idx = i; }
  const cur = DOPUSK_RANKS[idx];
  const next = DOPUSK_RANKS[idx+1] || null;
  let pct = 100;
  if(next){
    const range = next.min - cur.min;
    pct = Math.min(100, Math.round((completed - cur.min) / range * 100));
  }
  return { idx, name:cur.name, next, pct, completed };
}

  // dated/numbered report underneath it — day 1 at the top — exactly what
  // followers see about this pilot's mission in the Illuminator feed.
  missionThread(){
    const m = state.missions[state.missionThreadFor];
    if (!m) return screenShell(`<div class="placeholder-box">${tr('Миссия не найдена.','Mission not found.')}</div>`, {step:'thread'});
    const posts = state.missionThreadPosts;
    const postRow = (post) => {
      const day = post.report_day ? tr(`День ${post.report_day}`,`Day ${post.report_day}`) : tr('Обещание','Promise');
      const when = post.created_at ? new Date(post.created_at).toLocaleDateString(state.lang==='en'?'en-US':'ru-RU') : '';
      const media = post.kind==='video'
        ? `<video src="${post.video_url}" controls playsinline style="width:100%;border-radius:12px;max-height:220px;object-fit:cover;background:#000;"></video>`
        : post.kind==='photo'
          ? `<img src="${post.photo_url}" style="width:100%;border-radius:12px;max-height:220px;object-fit:cover;">`
          : `<p class="lead" style="margin-top:6px;">${post.text_body || ''}</p>`;
      return `
        <div class="card" style="margin-bottom:10px;">
          <div class="mtop"><span class="mtitle">${day}</span><span class="mtype">${when}</span></div>
          ${media}
          ${post.caption ? `<p class="hint" style="margin-top:6px;">${post.caption}</p>` : ''}
        </div>
      `;
    };
    return screenShell(`
      <div class="eyebrow">${typeLabel(m.type)}</div>
      <h1>${tf(m.title)}</h1>
      <p class="hint" style="margin:-4px 0 14px;">${tr('Обещание и все отчёты по этой миссии — один за другим, с первого дня.','The promise and every report on this mission — one by one, from day one.')}</p>
      ${state.missionThreadLoading ? `<p class="hint">${tr('Загружаем…','Loading…')}</p>` :
        posts.length===0 ? `<div class="placeholder-box">${tr('Пока нет постов по этой миссии.','No posts on this mission yet.')}</div>` :
        posts.map(postRow).join('')

  // The generic version of missionThread(): works for ANY mission in the
  // Illuminator feed (not just the viewer's own), grouped by mission_id/author
  // so tapping "All reports" on a feed card always lands here — the main
  // promise video up top, every report threaded underneath, one page per
  // mission, exactly what the mission's own user would see on their page.
  feedMissionThread(){
    const g = state.illumFeedGroups[state.feedMissionThreadFor];
    if (!g) return screenShell(`<div class="placeholder-box">${tr('Миссия не найдена.','Mission not found.')}</div>`, {step:'thread'});
    const rep = g.rep;
    const authorName = rep.author_name || rep.author || tr('Пилот','Pilot');
    const title = rep.mission_title || (rep.missionTitle ? tf(rep.missionTitle) : tr('Миссия','Mission'));
    const sorted = [...g.posts].sort((a,b) => {
      const aPromise = a.isPromise || a.is_promise, bPromise = b.isPromise || b.is_promise;
      if (aPromise !== bPromise) return aPromise ? -1 : 1;
      const aDay = a.day ?? a.report_day ?? 0, bDay = b.day ?? b.report_day ?? 0;
      return aDay - bDay;
    });
    const postRow = (post) => {
      const isPromise = post.isPromise || post.is_promise;
      const day = post.day ?? post.report_day;
      const label = isPromise ? tr('Обещание','Promise') : (day ? tr(`День ${day}`,`Day ${day}`) : tr('Отчёт','Report'));
      const when = post.created_at ? new Date(post.created_at).toLocaleDateString(state.lang==='en'?'en-US':'ru-RU') : '';
      const media = post.video_url
        ? `<video src="${post.video_url}" controls playsinline style="width:100%;border-radius:12px;max-height:220px;object-fit:cover;background:#000;"></video>`
        : post.photo_url
          ? `<img src="${post.photo_url}" style="width:100%;border-radius:12px;max-height:220px;object-fit:cover;">`
          : `<p class="lead" style="margin-top:6px;">${post.text_body || post.caption || ''}</p>`;
      return `
        <div class="card" style="margin-bottom:10px;">
          <div class="mtop"><span class="mtitle">${label}</span><span class="mtype">${when}</span></div>
          ${media}
          ${post.caption ? `<p class="hint" style="margin-top:6px;">${post.caption}</p>` : ''}
        </div>
      `;
    };
    return screenShell(`
      <div class="eyebrow">${authorName}</div>
      <h1>${title}</h1>
      <p class="hint" style="margin:-4px 0 14px;">${tr('Обещание и все отчёты по этой миссии — один за другим, с первого дня.','The promise and every report on this mission — one by one, from day one.')}</p>
      ${sorted.map(postRow).join('')}
    `, {step: tr('Отчёты','Reports')});
  },

  awaitingPayment(){
    const p = state.payment || {};
    const kindLabel = PAYMENT_KIND_CONFIG[p.kind] ? PAYMENT_KIND_CONFIG[p.kind].label() : '';
    let body;
    if (p.status === 'succeeded') {
      body = `<p class="lead">${tr('Оплата прошла — переходим дальше.','Payment went through — moving on.')}</p>`;
    } else if (p.status === 'canceled') {
      body = `<p class="lead">${tr('Платёж отменён или не прошёл.','The payment was canceled or failed.')}</p>
        <button class="btn primary block" style="margin-top:14px;" onclick="doInitiatePayment('${p.kind}')">${tr('Попробовать снова','Try again')}</button>
        <button class="btn ghost block" style="margin-top:10px;" onclick="cancelPaymentWait()">${tr('← Назад','← Back')}</button>`;
    } else if (p.status === 'timeout') {
      body = `<p class="lead">${tr('Не видим подтверждения оплаты уже 2 минуты.','We haven\'t seen a confirmed payment for 2 minutes.')}</p>
        <button class="btn primary block" style="margin-top:14px;" onclick="recheckPaymentNow()">${tr('Проверить ещё раз','Check again')}</button>
        <button class="btn ghost block" style="margin-top:10px;" onclick="cancelPaymentWait()">${tr('← Назад','← Back')}</button>`;
    } else if (p.status === 'error') {
      body = `<p class="lead">${tr('Не получилось создать платёж.','Couldn\'t create the payment.')} ${p.error==='age_not_confirmed' ? tr('Нужно подтвердить возраст.','Age needs to be confirmed.') : (p.error==='yookassa_not_configured' ? tr('Оплата ещё не подключена — это тестовая сборка.','Payment isn\'t connected yet — this is a test build.') : '')}</p>
        <button class="btn ghost block" style="margin-top:14px;" onclick="cancelPaymentWait()">${tr('← Назад','← Back')}</button>`;
    } else {
      body = `<p class="lead">${tr('Ждём подтверждения оплаты — не закрывай приложение.','Waiting for payment confirmation — keep the app open.')}</p>
        <button class="btn ghost block" style="margin-top:14px;" onclick="recheckPaymentNow()">${tr('Я оплатил — проверить','I paid — check now')}</button>
        <button class="btn ghost block" style="margin-top:10px;" onclick="cancelPaymentWait()">${tr('Отменить','Cancel')}</button>`;
    }
    return screenShell(`
      <div class="eyebrow">${kindLabel}</div>
      <h1>${tr('Оплата','Payment')}</h1>

    `, {step:tr('Оплата','Payment'), back:false});

// Скоринговый рекомендательный алгоритм: считает баллы каждого наставника
// по ответам анкеты (психотип, поддержка/соревнование, тон, стойкость) —
// побеждает наставник с максимальным баллом. Используется и для медали
// "Рекомендован" на карточке, и для текстовой рекомендации внизу экрана.
const MENTOR_SCORES = {
  'Аналитик':      { 'Алина ДиЭнЭй':3, 'Профессор':1, 'Космонавт':1 },
  'Боец':          { 'Товарищ Ли':3, 'Ледокол':2, 'Витя Убуд':1 },
  'Творец':        { 'DJ Midnight':3, 'Лиза Джаз':2, 'Витя Убуд':1 },
  'Опекун':        { 'Мама Женя':3, 'Баба Зина':2, 'Космонавт':1 },
  'Не знаю':       { 'Космонавт':3 },
};
function computeRecommendedMentor(formRef){
  formRef = formRef || state.form;
  const hasSignal = formRef.psychotype || formRef.supportStyle || formRef.toneSupport!==40 || formRef.persistence!==60;
  if(!hasSignal) return null;
  const scores = {};
  const bump = (name, pts) => { scores[name] = (scores[name]||0) + pts; };

  if(formRef.psychotype && MENTOR_SCORES[formRef.psychotype]){
    Object.entries(MENTOR_SCORES[formRef.psychotype]).forEach(([n,p])=>bump(n,p));
  }
  if(formRef.supportStyle === 'Поддержка'){ bump('Баба Зина',1); bump('Мама Женя',1); bump('Космонавт',1); }
  if(formRef.supportStyle === 'Соревнование'){ bump('Товарищ Ли',1); bump('Ледокол',1); bump('Профессор',1); }
  if(formRef.supportStyle === 'И то, и другое'){ bump('DJ Midnight',1); bump('Ледокол',1); }

  const tone = Number(formRef.toneSupport);
  if(tone < 35){ bump('Витя Убуд',2); bump('Баба Зина',1); }
  else if(tone > 65){ bump('Товарищ Ли',2); bump('Ледокол',1); }
  else { bump('Космонавт',1); bump('Ледокол',1); }

  const persist = Number(formRef.persistence);
  if(persist < 35){ bump('Товарищ Ли',1); bump('Ледокол',1); }
  else if(persist > 65){ bump('Профессор',1); bump('Лиза Джаз',1); }

  let best = null, bestScore = -1;
  Object.entries(scores).forEach(([name, sc])=>{ if(sc>bestScore){ best=name; bestScore=sc; } });
  return best;
}
function recommendedMentorLine(formRef){
  formRef = formRef || state.form;
  const rec = computeRecommendedMentor(formRef);
  if(!rec) return '';
  return `<p class="hint" style="margin-top:10px;">${tr('По твоим ответам подойдёт: ','Based on your answers, a good fit is: ')}<b style="color:var(--text);">${mentorName(rec)}</b>${tr(' — отмечен медалью «Рекомендован» выше.',' — marked with the “Recommended” badge above.')}</p>`;
}

/* ==== Иллюминатор: запись видео прямо в приложении (getUserMedia + MediaRecorder) ==== */
let illumStream = null, illumRecorder = null, illumChunks = [], illumBlob = null, illumTimerHandle = null, illumSeconds = 0;

function stopIllumMedia(){
  try { if (illumRecorder && illumRecorder.state !== 'inactive') illumRecorder.stop(); } catch(e){}
  try { if (illumStream) illumStream.getTracks().forEach(t=>t.stop()); } catch(e){}
  illumStream = null; illumRecorder = null;
  if (illumTimerHandle) { clearInterval(illumTimerHandle); illumTimerHandle = null; }
}

async function enterIllumRecordScreen(){
  try {
    illumStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'user',
        width: { ideal: 1080 },
        height: { ideal: 1920 },
        frameRate: { ideal: 30, max: 30 }
      },
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
    const video = document.getElementById('cameraPreview');
    if (video) {
      video.srcObject = illumStream;
      // Front camera preview mirrors like a native iPhone camera app.
      // The recorded/published file itself is left un-mirrored (see below).
      video.style.transform = 'scaleX(-1)';
    }
  } catch (e) {
    console.warn('camera access failed', e);
    const video = document.getElementById('cameraPreview');
    if (video) {
      const p = document.createElement('p');
      p.className = 'hint';
      p.textContent = tr('Не удалось получить доступ к камере. Проверь разрешения в настройках Telegram/браузера.','Couldn\'t access the camera. Check permissions in Telegram/browser settings.');
      video.replaceWith(p);
    }
  }
}

function startIllumRecording(){
  if (!illumStream) return;
  illumChunks = [];
  const mimeCandidates = ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4'];
  const mime = mimeCandidates.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || '';
  try {
    // Higher bitrate for a sharper, less compressed recording.
    illumRecorder = mime
      ? new MediaRecorder(illumStream, { mimeType: mime, videoBitsPerSecond: 4_000_000, audioBitsPerSecond: 128_000 })
      : new MediaRecorder(illumStream, { videoBitsPerSecond: 4_000_000, audioBitsPerSecond: 128_000 });
  } catch (e) { console.warn('MediaRecorder init failed', e); return; }
  illumRecorder.ondataavailable = (e) => { if (e.data && e.data.size>0) illumChunks.push(e.data); };
  illumRecorder.onstop = () => {
    illumBlob = new Blob(illumChunks, { type: (illumRecorder && illumRecorder.mimeType) || 'video/webm' });
    state.illumRecording.status = 'reviewing';
    render();
    setTimeout(() => {
      const video = document.getElementById('cameraPreview');
      if (video) {
        video.srcObject = null; video.muted = false; video.src = URL.createObjectURL(illumBlob);
        // Playback of the saved file is shown the right way round, not mirrored.
        video.style.transform = 'none';
      }
    }, 0);
  };
  illumRecorder.start();
  state.illumRecording.status = 'recording';
  illumSeconds = 0;
  render();
  setTimeout(() => {
    const video = document.getElementById('cameraPreview');
    if (video && illumStream) { video.srcObject = illumStream; video.style.transform = 'scaleX(-1)'; }
  }, 0);
  illumTimerHandle = setInterval(() => {
    illumSeconds++;
    const t = document.getElementById('recTimer');
    if (t) t.textContent = String(Math.floor(illumSeconds/60)).padStart(2,'0')+':'+String(illumSeconds%60).padStart(2,'0');
    if (illumSeconds >= 60) stopIllumRecording();
  }, 1000);
}

function stopIllumRecording(){
  if (illumTimerHandle) { clearInterval(illumTimerHandle); illumTimerHandle = null; }
  try { if (illumRecorder && illumRecorder.state !== 'inactive') illumRecorder.stop(); } catch(e){}
}

// Shared tail for all three proof kinds: a standalone/promise post returns to
// the Illuminator feed as before; a daily report (checkinIndex set) instead
// bumps that mission's progress + report count and lands on the same
// "Accepted" confirmation the old fake check-in used to show directly.
function finishIllumPublish(r, post){
  const checkinIndex = r.checkinIndex;
  state.illumRecording = { status:'idle', caption:'' };
  if (checkinIndex != null){
    const m = state.missions[checkinIndex];
    if (m) {
      m.reportCount = (m.reportCount||0) + 1;
      m.lastReportDate = new Date().toISOString().slice(0,10);
    }
    bumpMission(checkinIndex);
    // A mission with a fixed length (target_days) is done once the report count
    // reaches it — congratulate instead of the ordinary "Accepted" screen, and
    // offer to extend rather than silently letting reports run past the goal
    // (this is what was producing "Day 26" reports on a 21-day mission).

/* ==== "Say it to the camera" — real recording, shared by the Habit/Result/
   Ascesis launch wizards. Mirrors the Illuminator recorder (same mirroring
   fix, same bitrate), but keeps its own state so a wizard step and an
   Illuminator recording never fight over the same stream. ==== */
let wizStream = null, wizRecorder = null, wizChunks = [], wizBlob = null, wizTimerHandle = null, wizSeconds = 0;

async function enterWizardCam(){
  try {
    wizStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1080 }, height: { ideal: 1920 }, frameRate: { ideal: 30, max: 30 } },
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
    const video = document.getElementById('wizCamPreview');
    if (video) { video.srcObject = wizStream; video.style.transform = 'scaleX(-1)'; }
  } catch (e) {
    console.warn('wizard camera access failed', e);
    const video = document.getElementById('wizCamPreview');
    if (video) {
      const p = document.createElement('p');
      p.className = 'hint';
      p.textContent = tr('Не удалось получить доступ к камере. Проверь разрешения в настройках Telegram/браузера.', "Couldn't access the camera. Check permissions in Telegram/browser settings.");
      video.replaceWith(p);
    }
  }
}
function stopWizardMedia(){
  try { if (wizRecorder && wizRecorder.state !== 'inactive') wizRecorder.stop(); } catch(e){}
  try { if (wizStream) wizStream.getTracks().forEach(t=>t.stop()); } catch(e){}
  wizStream = null; wizRecorder = null;
  if (wizTimerHandle) { clearInterval(wizTimerHandle); wizTimerHandle = null; }
}
function goToWizardVideo(screen, target){
  const alreadyDone = target==='result' ? state.result.videoDone : target==='askeza' ? state.askeza.videoDone : state.form.videoDone;
  state.wizCam = { status: alreadyDone ? 'done' : 'idle', target };
  go(screen);
  if(!alreadyDone) setTimeout(enterWizardCam, 0);
}
function startWizardRecording(){
  if (!wizStream) return;
  wizChunks = [];
  const mimeCandidates = ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4'];
  const mime = mimeCandidates.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || '';
  try {
    wizRecorder = mime
      ? new MediaRecorder(wizStream, { mimeType: mime, videoBitsPerSecond: 4_000_000, audioBitsPerSecond: 128_000 })
      : new MediaRecorder(wizStream, { videoBitsPerSecond: 4_000_000, audioBitsPerSecond: 128_000 });
  } catch (e) { console.warn('wizard MediaRecorder init failed', e); return; }
  wizRecorder.ondataavailable = (e) => { if (e.data && e.data.size>0) wizChunks.push(e.data); };
  wizRecorder.onstop = () => {
    wizBlob = new Blob(wizChunks, { type: (wizRecorder && wizRecorder.mimeType) || 'video/webm' });
    state.wizCam.status = 'reviewing';
    render();
    setTimeout(() => {
      const video = document.getElementById('wizCamPreview');
      if (video) { video.srcObject = null; video.muted = false; video.src = URL.createObjectURL(wizBlob); video.style.transform = 'none'; }
    }, 0);
  };
  wizRecorder.start();
  state.wizCam.status = 'recording';
  wizSeconds = 0;
  render();
  setTimeout(() => {
    const video = document.getElementById('wizCamPreview');
    if (video && wizStream) { video.srcObject = wizStream; video.style.transform = 'scaleX(-1)'; }
  }, 0);
  wizTimerHandle = setInterval(() => {
    wizSeconds++;
    const t = document.getElementById('wizRecTimer');
    if (t) t.textContent = String(Math.floor(wizSeconds/60)).padStart(2,'0')+':'+String(wizSeconds%60).padStart(2,'0');
    if (wizSeconds >= 90) stopWizardRecording();
  }, 1000);
}
function stopWizardRecording(){
  if (wizTimerHandle) { clearInterval(wizTimerHandle); wizTimerHandle = null; }
  try { if (wizRecorder && wizRecorder.state !== 'inactive') wizRecorder.stop(); } catch(e){}
}
function retakeWizardRecording(){
  wizBlob = null;
  state.wizCam.status = 'idle';
  render();
  setTimeout(enterWizardCam, 0);
}
function confirmWizardVideo(){
  const target = state.wizCam.target;

  if(target==='result') state.result.videoDone = true;

// Once a mission is launched, the video just recorded in the wizard becomes
// that mission's permanent main promise — stored on the mission itself, and
// pushed into the Illuminator feed only when the pilot paid for Public mode.
// This is also why the old "record a promise" prompt after payment is gone:
// there is now exactly one moment where the promise gets recorded.
async function attachWizardPromiseVideo(createPromise, mission, isPublic){
  if(!wizBlob) return;
  const blob = wizBlob;
  wizBlob = null;
  if(!sb) return;
  try {
    await createPromise;
    const fileName = `${TG_ID}_promise_${Date.now()}.webm`;
    const { error: upErr } = await sb.storage.from('illuminator-videos').upload(fileName, blob, { contentType: blob.type || 'video/webm' });
    if (upErr) throw upErr;
    const { data: pub } = sb.storage.from('illuminator-videos').getPublicUrl(fileName);
    const url = pub && pub.publicUrl;
    if (mission.dbId){
      await sb.from('missions').update({ promise_kind:'video', promise_video_url:url, public: !!isPublic }).eq('id', mission.dbId);
      mission.isPublic = !!isPublic;
    }
    // Always store the promise post — public or not — so it shows up in the
    // owner's own profile mission-thread either way. Only public ones also
    // land in the global Illuminator feed (loadIlluminatorPosts filters on it).
    const { data: inserted } = await sb.from('illuminator_posts').insert({
      user_id: TG_ID, author_name: state.profile.name, mission_type: mission.type,
      mission_title: mission.title, mission_id: mission.dbId || null, is_promise: true, kind:'video', video_url:url, caption:'',
      public: !!isPublic
    }).select('*').maybeSingle();
    if (inserted && isPublic){ state.illumPosts.unshift(inserted); safeRender(); }
  } catch(e){ console.warn('attachWizardPromiseVideo failed', e); }
}

// safeRender() — use this instead of render() from any code that can fire on its
// own schedule (an async DB round-trip resolving, a setInterval tick, a setTimeout)
// rather than as the direct result of a user click. A bare render() does a full
// innerHTML replace of #view/#navbar, which destroys DOM node identity — if that
// happens while the user has a text <input>/<textarea> focused (e.g. mid-onboarding,
// or on a slow connection where a Supabase round-trip lands mid-typing), the field
// loses focus and further keystrokes go nowhere. safeRender defers the render until
// that field is blurred, instead of skipping it (which could leave stale UI).
function safeRender(){
  const el = document.activeElement;
  if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')) {
    el.addEventListener('blur', function onBlur(){
      el.removeEventListener('blur', onBlur);
      render();
    }, { once: true });
    return;
  }
  render();
}

(function initProfileName(){
  try {
    const u = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user;
    if (u && u.first_name) state.profile.name = u.first_name;
  } catch(e){}
})();
render();

/* ===== Telegram Mini App integration ===== */
(function(){
  const tg = window.Telegram && window.Telegram.WebApp;
  const FLOW_SCREENS_PREFIXES = ['habit','optimize','meaning','video','saving','mentor','boosts','summary','payment','ticket','typeSelect','r','a','quiz'];

  function isMidFlow(){
    const s = state.screen;
    if(['home','profile','illuminator','more','splash','tickets','merch','merchSuggest','confirm','rConfirm','aConfirm'].includes(s)) return false;
    return state.history && state.history.length>0;
  }

  function syncTelegramUI(){
    if(!tg) return;
    try{
      if(state.history && state.history.length>0){
        tg.BackButton.show();
      } else {
        tg.BackButton.hide();
      }
      if(isMidFlow()){
        tg.enableClosingConfirmation();
      } else {
        tg.disableClosingConfirmation();
      }
    }catch(e){ /* older client versions may lack an API */ }
  }

  if(typeof render === 'function'){
    const _origRender = render;
    render = function(){
      _origRender();
      syncTelegramUI();
    };
  }

  if(tg){
    try{
      tg.ready();
      tg.expand();
      tg.BackButton.onClick(function(){ back(); });
      tg.setHeaderColor && tg.setHeaderColor('#000000');
      tg.setBackgroundColor && tg.setBackgroundColor('#000000');

      const setVh = () => {
        const h = (tg.viewportStableHeight || tg.viewportHeight || window.innerHeight);
        document.documentElement.style.setProperty('--tg-vh', h + 'px');
      };
      setVh();
      tg.onEvent('viewportChanged', setVh);
      window.addEventListener('resize', setVh);

      // Light haptic feedback on primary actions, if supported.
      document.addEventListener('click', function(e){
        const t = e.target.closest && e.target.closest('.btn, .navbtn, .mission-card, .mentor-icon');
        if(t && tg.HapticFeedback){
          try{ tg.HapticFeedback.impactOccurred('light'); }catch(err){}
        }
      }, true);

      syncTelegramUI();
    }catch(e){
      console.warn('Telegram WebApp init issue', e);
    }
  } else {
    document.documentElement.style.setProperty('--tg-vh', window.innerHeight + 'px');
  }
})();

</script>
