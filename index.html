}

function closeMerchOrder(){
  state.merch.orderForm = null;
  back();
}

async function submitMerchOrder(){
  if (!isAge18Confirmed()) { requireAge18ThenRun(submitMerchOrder); return; }
  const f = state.merch.orderForm;
  if(!f) return;
  const item = state.merch.items.find(i=>i.id===f.itemId);
  if(!item) return;
  if(!f.contact || !f.contact.trim()){
    state.merch.orderFormError = tr('Укажи контакт — телеграм или телефон','Enter a contact — Telegram or phone');
    render();
    return;
  }
  state.merch.orderFormError = null;

  const record = {
    id: 'local'+Date.now(),
    itemId: item.id,
    itemName: (state.lang==='en' ? item.name.en : item.name.ru) || item.name.ru,
    action: f.action,
    price: item.price,
    deposit: item.deposit || null,
    size: f.size || null,
    contact: f.contact.trim(),
    name: (f.name||'').trim(),
    note: (f.note||'').trim(),
    status: 'new',
  };
  const disc = prizesActive('merch_discount').sort((a,b)=>b.amount-a.amount)[0];
  if (disc) record.note = (record.note ? record.note + ' · ' : '') + `Скидка ${disc.amount}% (приз №${disc.id})`;

  if(f.action==='preorder') markMerchPreordered(item.id);
  else if(f.action==='buy') markMerchPurchased(item.id);
  else if(f.action==='queue') markMerchQueued(item.id);

  state.merch.orders.unshift(record);
  state.merch.orderForm = null;

  if(sb){
    try{
      const { data } = await sb.from('merch_orders').insert({
        user_id: TG_ID,
        item_id: item.id,
        item_name: record.itemName,
        action: f.action,
        price: item.price,
        deposit: item.deposit || null,
        size: f.size || null,
        contact: record.contact,
        name: record.name || null,
        note: record.note || null,
      }).select('*').maybeSingle();
      if(data) record.id = data.id;
      if (data && disc) { usePrize(disc.id, 'заказ мерча ' + data.id); v2Toast(tr(`Скидка ${disc.amount}% применена к заказу`, `${disc.amount}% discount applied to the order`)); }
    } catch(e){ console.warn('merch order insert failed — сохранено только локально', e); }
  }

  go('merchBucket', {replace:true});
}

async function cancelMerchOrder(orderId){
  const idx = state.merch.orders.findIndex(o=>o.id===orderId);
  if(idx===-1) return;
  const order = state.merch.orders[idx];
  unmarkMerch(order.itemId, order.action);
  state.merch.orders.splice(idx,1);
  render();
  if(sb && !String(orderId).startsWith('local')){
    try{ await sb.from('merch_orders').update({status:'cancelled'}).eq('id', orderId); }
    catch(e){ console.warn('merch order cancel failed to sync', e); }
  }
}

async function loadMerchOrders(){
  if(!sb || state.merch.ordersLoaded) return;
  try{
    const { data } = await sb.from('merch_orders').select('*').eq('user_id', TG_ID).neq('status','cancelled').order('created_at', {ascending:false});
    if(data && data.length){
      state.merch.orders = data.map(o=>({
        id:o.id, itemId:o.item_id, itemName:o.item_name, action:o.action,
        price:o.price, deposit:o.deposit, size:o.size, contact:o.contact, name:o.name, note:o.note, status:o.status,
      }));
      data.forEach(o=>{
        if(o.action==='preorder') state.merch.preordered[o.item_id] = true;
        else if(o.action==='buy') state.merch.purchased[o.item_id] = true;
        else if(o.action==='queue') state.merch.queued[o.item_id] = true;
      });
    }
    state.merch.ordersLoaded = true;
    safeRender();
  } catch(e){ console.warn('loadMerchOrders failed — работаем в локальном режиме', e); }
}

function submitMerchSuggestion(){

// Уровень Доверия (Trust Level) — 2026-09-26, replaces the old "Допуск" rank
// naming as the reputation-driven ladder Maksim asked for. Thresholds 1–8
// are his exact numbers; "unlimited levels" was also requested, so beyond
// level 8 the ladder keeps extending on a fixed growth rule (×1.3 per level,
// rounded to the nearest 10) rather than hard-capping — a placeholder curve
// until Maksim gives real numbers for levels 9+.
const REPUTATION_LEVEL_THRESHOLDS = [0,33,88,222,333,555,888,1222,1999,3333,5555,8888,13331,19991,26262];
function reputationThresholdFor(level){
  if (level <= 1) return 0;
  if (level <= REPUTATION_LEVEL_THRESHOLDS.length) return REPUTATION_LEVEL_THRESHOLDS[level-1];
  let t = REPUTATION_LEVEL_THRESHOLDS[REPUTATION_LEVEL_THRESHOLDS.length-1];
  for (let i = REPUTATION_LEVEL_THRESHOLDS.length; i < level; i++) t = Math.round(t*1.3/10)*10;
  return t;
}
function computeTrustLevel(reputation){
  let level = 1;
  while (reputationThresholdFor(level+1) <= (reputation||0)) level++;
  return level;
}
// Gate for future "unique" / partner-only missions (2026-09-26: "after level
// 5 we will have unique missions, also some unavailable-before missions from
// partners"). Catalog items opt in with an optional minTrustLevel field —
// nothing in TICKETS/PARTNERS/etc. sets it yet, this is just the mechanism
// ready for when Maksim tags specific items as level-gated.
function missionUnlockedForLevel(item, trustLevel){
  return !item.minTrustLevel || trustLevel >= item.minTrustLevel;
}

function computeDopuskRank(completed){
  let idx = 0;
  for(let i=0;i<DOPUSK_RANKS.length;i++){ if(completed >= DOPUSK_RANKS[i].min) idx = i; }
  const cur = DOPUSK_RANKS[idx];
  const next = DOPUSK_RANKS[idx+1] || null;
  let pct = 100;
  if(next){
    const range = next.min - cur.min;
    pct = Math.min(100, Math.round((completed - cur.min) / range * 100));
  }
  return { idx, name:cur.name, next, pct, completed };
}

// Значки ("Badges") — 2026-09-28 request: a SEPARATE collection from the
// BADGES achievement ladder above. That one auto-unlocks purely off profile
// stats (BADGES[i].check(p)); this one is a static catalog of collectible
// status badges, each either earned through activity ('grant' — awarded
// elsewhere in code, e.g. grantStreakReward()/checkinRoad's day-13 lucky
// badge, both of which already push into state.profile.badges) or bought

function buyBadge(id){
  const b = BADGE_SHOP.find(x=>x.id===id);
  if(!b || b.kind!=='buy') return;
  if(state.profile.badges.some(x=>x.id===id)) return;
  if(state.profile.ls.total < b.price){ alert(tr('Не хватает Л.С.','Not enough Flight Hours')); return; }
  state.profile.ls.total -= b.price;
  state.profile.badges.push({ id, earnedAt: todayISO() });
  dbUpsertUserStats();
  render();
}

}

    if (!state.nm) return SCREENS.nmMain();
    const k = state.nm.kind, F = nmF();
    const n = nmDays();
    const fin = k==='result' ? F.deadline : (F.duration && F.duration.custom ? F.customDeadline : (n ? addDaysISO(n) : ''));

    const open = state.nm.open;
    const tone = Number(F.toneSupport);
    const toneKey = tone < 35 ? 'soft' : tone > 65 ? 'hard' : 'honest';
    const free = isFirstMissionFree();
    const acc = (key, title, meta, body) => `<div class="nm-acc ${open[key]?'open':''}"><button onclick="nmToggle('${key}')"><b style="display:block">${title}</b><span style="margin-left:auto">${meta}</span>${V2_DOWN}</button>${open[key] ? `<div class="nm-acc-body">${body}</div>` : ''}</div>`;
    const custom = nmIsCustom();
    const minD = k==='result' ? addDaysISO(1) : addDaysISO(21);
    const days = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
    const whenBody = (k==='habit' ? `<div class="lab">${tr('Как часто','How often')}</div><div class="nm-chips" style="margin-top:0">${['Каждый день','Несколько раз в неделю','По событию'].map(f=>`<button class="${state.form.freq===f?'on':''}" onclick="nmSetFreq('${f}')">${label(f)}</button>`).join('')}</div>
      ${state.form.freq==='Несколько раз в неделю' ? `<div class="lab" style="margin-top:12px">${tr('В какие дни','Which days')}${state.form.freqDays.length ? '' : ' · <b style="color:#fff">'+tr('выбери хотя бы один','pick at least one')+'</b>'}</div><div class="nm-days">${days.map(d=>`<button class="${state.form.freqDays.includes(d)?'on':''}" onclick="toggleFreqDay('${d}')">${weekdayLabel(d)}</button>`).join('')}</div>` : ''}

      <div class="nm-seg" role="radiogroup">${[['soft',20,tr('Мягко','Gently')],['honest',50,tr('По-честному','Honestly')],['hard',85,tr('Жёстко','Tough')]].map(([key,v,l])=>`<button role="radio" aria-checked="${toneKey===key}" class="${toneKey===key?'on':''}" onclick="nmSetTone(${v})">${l}</button>`).join('')}</div>

      ${state.tyagaProfile ? `<p class="nm-hint" style="margin-top:12px">${tr('Архетип','Archetype')}: <b style="color:#fff">${tr(TP_TYPES[state.tyagaProfile.type].ru, TP_TYPES[state.tyagaProfile.type].en)}</b></p>` : `<button class="nm-quizlink" onclick="openQuiz()"><i>?</i>${tr('Не знаю — узнай свой архетип за 2 минуты','Not sure — find your archetype in 2 minutes')}</button>`}`;
    const wOn = F.boosts && F.boosts.witnesses;
    const src = F.boosts.witnessSource || 'tg';
    const wv = (F.boosts.witnessList||[''])[0] || '';

    const icTg = V2_TG, icPh = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg>', icFo = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 19c1-3.4 3.6-5 6.5-5s5.5 1.6 6.5 5"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14.2c2.6 0 4.6 1.4 5.5 4.3"/></svg>';
    let srcBody = '';
    if (src==='tg') srcBody = `<input type="text" value="${v2Esc(wv)}" placeholder="${tr('@ник в Telegram','@nick in Telegram')}" oninput="nmWitnessSet(this.value)"><div class="nm-wit-note">${tr('После старта пришлём ссылку-приглашение — отправишь её свидетелю в Telegram.','After launch we give you an invite link to send to your witness in Telegram.')}</div>`;
    else if (src==='phone') srcBody = (('contacts' in navigator && navigator.contacts && navigator.contacts.select) ? `<button class="v2-ghost" style="margin-top:10px;height:46px" onclick="nmPickPhoneContact()">${tr('Выбрать из контактов','Pick from contacts')}</button>` : '') + `<input type="text" style="margin-top:10px" value="${v2Esc(wv)}" inputmode="tel" placeholder="${tr('Имя и номер: Аня +7…','Name and number: Anna +7…')}" oninput="nmWitnessSet(this.value)">`;
    else {
      const fl = state.nmFollowing;
      if (!fl) { nmLoadFollowing(); srcBody = `<div class="nm-wit-note">${tr('Загружаем подписки…','Loading…')}</div>`; }
      else if (!fl.length) srcBody = `<div class="nm-wit-note">${tr('Ты пока ни на кого не подписан.','You are not following anyone yet.')}</div><button class="v2-ghost" style="margin-top:8px;height:46px" onclick="openPeople()">${tr('Найти людей','Find people')}</button>`;
      else srcBody = `<div class="nm-pick">${fl.map(u=>`<button class="${F.boosts.witnessRef===u.telegram_id?'on':''}" onclick="nmPickFollow(${u.telegram_id})">${v2Ava(u.avatar_url, u.first_name)}<span>${v2Esc(u.first_name)}${u.handle?' · @'+v2Esc(u.handle):''}</span></button>`).join('')}</div>`;
    }
    const witBody = `<div class="nm-boost" style="padding-top:0"><span class="t"><b>${tr('Позвать свидетеля','Invite a witness')}</b><span>${tr('Один человек увидит твоё обещание и отчёты','One person sees your promise and reports')} · ${tr('бесплатно','free')}</span></span><div class="switch ${wOn?'on':''}" onclick="nmBoostToggle('witnesses')"><i></i></div></div>

        <div class="nm-wit-note">${tr('Свидетель получит твоё видео-обещание и будет видеть отчёты. Если пропустишь день — мы попросим его тебя поддержать.','Your witness gets your promise video and sees your reports. If you miss a day, we ask them to back you up.')}${wv ? '' : ' <b style="color:#fff">'+tr('Можно выбрать позже — бот напомнит.','You can pick later — the bot will remind you.')+'</b>'}</div>` : ''}`;
    return `
      <div class="nm-top"><button class="v2-ic lg" aria-label="${tr('Назад','Back')}" onclick="back()">${V2_BACK}</button><div class="nm-dots"><i></i><i class="on"></i><i></i><i></i></div><span style="width:44px"></span></div>
      <div class="v2-mono" style="margin-top:18px;text-transform:none;letter-spacing:.02em;font-size:13px;color:#a8a8a8">${k==='askeza'?tr('Без','No'):tr('Я','I')} ${v2Esc(nmText())}</div>
      <h1 class="nm-h1">${tr('Сколько<br>и зачем?','How long<br>and why?')}</h1>
      <div class="nm-dur">
        ${durs.map(d=>`<button class="${nmIsDur(d)?'on':''}" onclick="nmSetDur(${d})"><b>${d}</b>${dayWord(d)}</button>`).join('')}
        <button class="${custom?'on':''}" onclick="nmSetDur('custom')"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="16" height="14" rx="3"/><path d="M3 9h16M8 3v4M14 3v4"/></svg>${tr('своя','custom')}</button>
      </div>
      ${custom ? dateQuickPicker(k==='result' ? F.deadline : F.customDeadline, minD, addDaysISO(365), (k==='result' ? 'state.result.deadline=DATE' : 'nmF().customDeadline=DATE') + '; render()') : ''}
      ${n ? `<div class="nm-hint">${tr('Финиш','Finish')} — ${v2DateShort(fin)}${k==='habit' ? ' · '+label(state.form.freq||'Каждый день').toLowerCase() : ''}</div>` : ''}

      <div class="nm-chips">${[tr('ради семьи','for my family'), tr('доказать себе','to prove it to myself'), tr('здоровье','health')].map(c=>`<button onclick="nmAddWhy('${c}')">+ ${c}</button>`).join('')}</div>

      <div style="margin-top:8px">
        ${acc('when', tr('Когда и где','When and where'), v2Esc(F.whenWhere||'') || (k==='habit' ? (state.form.freq==='Несколько раз в неделю' && state.form.freqDays.length ? state.form.freqDays.map(weekdayLabel).join(', ') : label(state.form.freq||'Каждый день').toLowerCase()) : ''), whenBody)}

        ${acc('wit', tr('Свидетель','Witness'), wOn ? tr('позвать','invite') : tr('никого','nobody'), witBody)}

      <div style="margin-top:24px"><button id="nmNext2" class="v2-cta light" ${nmCanSrok()?'':'disabled'} onclick="nmToCamera()"><span>${tr('К камере','To the camera')}</span><span class="v2-orb">${V2_ARROW}</span></button></div>
    `;
  },

  nmCamera(){
    if (!state.nm) return SCREENS.nmMain();

  nmCrew(){

    const k = state.nm.kind, F = nmF();

    if (!F.mentor) { F.mentor = { name: recName, price: MENTORS_FREE.includes(recName) ? 0 : mentorPriceFor(recName) }; }
    const free = isFirstMissionFree();
    const order = [recName].concat(MENTORS_ENABLED.filter(x=>x!==recName));
    const card = (name) => {
      const H = MENTOR_HERO[name] || {};
      const on = F.mentor && F.mentor.name===name;
      const price = MENTORS_FREE.includes(name) ? 0 : mentorPriceFor(name);
      const priceTxt = free || !price ? '' : `${price} ₽`;
      return `<div class="nm-mc ${on?'on':''}" onclick="nmPickMentor('${name}')">
        <button class="info" onclick="event.stopPropagation(); showMentorInfo('${name}')">${tr('о наставнике','about')}</button>
        <div class="big">${H.l1 ? tf(H.l1)+'<br>'+tf(H.l2) : v2Esc(mentorName(name))}</div>
        ${H.cut ? `<img src="${H.cut}" alt="${v2Esc(mentorName(name))}" style="${H.scale?`height:${Math.round(270*H.scale)}px`:''}">` : ''}
        <div class="fade"></div>
        ${name===recName ? `<span class="nm-badge">${tr('Подходит тебе','Fits you')}</span>` : ''}

      </div>`;

    if (state.nm.prizeBoost && !state.nm.prizeBoostOn && !(state.nm.prizeBoost.key==='secondChance' && !(k==='habit' && state.form.freq!=='По событию'))) { F.boosts = F.boosts || {}; F.boosts[state.nm.prizeBoost.key] = true; state.nm.prizeBoostOn = true; }
    const B = F.boosts || {};
    const boosts = [
      ['aiAnalysis', tr('Анализ цели','Goal analysis'), tr('Наставник разберёт цель на старте: реалистичность, как мерить, первая неделя, риски','Your mentor reviews the goal at the start: feasibility, how to measure it, week one, risks'), 0],
      ['system', tr('Система','System'), tr('Каждый день: подсказка из науки о привычках и короткая практика от наставника','Every day: a habit-science tip and a short practice from your mentor'), 400],
      ['triggerAnalysis', tr('Разбор триггеров','Trigger analysis'), tr('Раз в неделю ИИ разбирает твои отметки и находит самые рискованные моменты','Once a week AI reviews your check-ins and flags your riskiest moments'), 0],
      ['support', tr('Живая поддержка','Human support'), tr('Живые люди из Службы заботы ТЯГИ напишут в важные моменты','Real people from the TYAGA Care team write at key moments'), 400],
    ].concat(k==='habit' && state.form.freq!=='По событию' ? [['secondChance', tr('Второй шанс','Second chance'), tr('Один пропущенный отчёт не остановит миссию — я спрошу, использовать ли билет','One missed report will not stop the mission — I will ask before using the ticket'), 300]] : []).concat([
      ['alterDates', tr('Изменить сроки','Change dates'), tr('Право сдвинуть или продлить срок по ходу','The right to move or extend the finish'), 300],
    ]).concat(k!=='askeza' ? [['public', tr('Публичный режим','Public mode'), tr('Миссию видят все — набираешь подписчиков','Everyone sees the mission — you gain followers'), 1000]] : []);
    const nOn = boosts.filter(b=>B[b[0]]).length;
    const total = nmTotal();
    const openB = state.nm.open.boost;
    return `
      <div class="nm-top"><button class="v2-ic lg" aria-label="${tr('Назад','Back')}" onclick="back()">${V2_BACK}</button><div class="nm-dots"><i></i><i></i><i></i><i class="on"></i></div><span style="width:44px"></span></div>
      <div class="v2-mono" style="margin-top:18px;display:flex;align-items:center;gap:8px"><span style="width:18px;height:18px;border-radius:9px;background:#fff;color:#000;display:inline-flex;align-items:center;justify-content:center">${V2_CHECK.replace('<svg ','<svg style="width:10px;height:10px" ')}</span>${tr('Видео записано','Video recorded')}</div>
      <h1 class="nm-h1">${tr('Кто рядом?','Who is<br>with me?')}</h1>
      <div class="nm-crew">${order.map(card).join('')}</div>
      <div class="nm-acc ${openB?'open':''}" style="margin-top:16px"><button onclick="nmToggle('boost')"><b style="display:block">${tr('Усилить миссию','Boost the mission')}</b><span style="margin-left:auto">${nOn ? tr(`выбрано: ${nOn}`, `${nOn} on`) : tr('бесплатно','free')}</span>${V2_DOWN}</button>
        ${openB ? `<div class="nm-acc-body">${boosts.map(([key,t,d,p])=>`<div class="nm-boost"><span class="t"><b>${t}</b><span>${d} · ${tr('бесплатно','free')}</span></span><div class="switch ${B[key]?'on':''}" onclick="nmBoostToggle('${key}')"><i></i></div></div>`).join('')}
          ${(B.system || B.triggerAnalysis) ? `<div class="nm-trg"><b>${tr('Когда тебя обычно тянет сорваться?','When does the urge to slip usually hit?')}</b><input type="text" maxlength="200" placeholder="${tr('Например: вечером после работы, в баре с друзьями','E.g.: in the evening after work, at a bar with friends')}" value="${v2Esc(B.systemTrigger||'')}" oninput="nmF().boosts.systemTrigger=this.value"><span>${tr('Наставник учтёт это в карточках и разборах.','Your mentor will use this in the cards and reviews.')}</span></div>` : ''}</div>` : ''}
      </div>
      ${state.nm.prizeBoost && state.nm.prizeBoostOn ? `<div class="nm-gift">${tr(`Приз: усиление ${(PRIZE_BOOST_RU[state.nm.prizeBoost.key]||['',''])[0]} включено в эту миссию`, `Prize: the ${(PRIZE_BOOST_RU[state.nm.prizeBoost.key]||['',''])[1]} boost is on for this mission`)}</div>` : ''}
      ${involvementPicker(state.nm.involvement || 'normal', "nmInvolve")}
      ${free ? `<div class="nm-gift">${tr('Первая миссия — подарок: всё включено','First mission is a gift: everything included')}</div>` : ''}
      <p class="nm-rule">${nmRuleText(k)}</p>
      <div style="margin-top:14px"><button class="v2-cta light" onclick="nmLaunch()"><span>${tr('Старт','Start')}</span><span style="font-weight:700;margin-right:6px">${total>0 ? total+' ₽' : '0 ₽'}</span><span class="v2-orb">${V2_ARROW}</span></button></div>

  trigSession(){

  changeDates(){

    const lab = TP_AXES.map((k,i)=>{ const a=(-90+i*60)*Math.PI/180, r=R+24; const x=c+r*Math.cos(a), y=c+r*Math.sin(a)+4; return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle">${tr(TP_AXIS_LABEL[k][0], TP_AXIS_LABEL[k][1]).toUpperCase()}</text>`; }).join('');

          <polygon points="${hex(R)}" stroke="#262626"/><polygon points="${hex(R*.66)}" stroke="#1d1d1d"/><polygon points="${hex(R*.33)}" stroke="#1d1d1d"/>
          <path fill="url(#qzLiq)" d="${tpBlobPath(null, c, c, 4, 0)}"><animate attributeName="d" dur="1.4s" fill="freeze" values="${tpBlobPath(null,c,c,4,0)};${a}" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/><animate attributeName="d" begin="1.4s" dur="5s" repeatCount="indefinite" values="${a};${b};${a}"/></path>

      <div style="margin-top:16px;display:flex;align-items:center;gap:10px;font-size:13px;color:#cfcfcf"><span class="pp-ava" style="width:32px;height:32px;background-image:url('${MENTOR_IMAGES[rec]||''}')"></span>${tr(`Тебе подойдёт ${rec}`, `${mentorName(rec)} fits you`)}</div>

  missionDetail(){

    const reports = m.reportCount||0;
    const elapsed = m.startDate ? Math.max(0, v2DaysBetween(m.startDate, v2Today()) + (v2ReportedToday(m)?1:0)) : reports;
    const daily = !m.freq || m.freq==='daily';
    const missed = daily && m.startDate ? Math.max(0, elapsed - reports - ((m.boostState||{}).second_chance_used ? 1 : 0)) : null;
    const left = m.targetDate ? Math.max(0, daysUntil(m.targetDate)) : null;
    const posts = (state.missionThreadPosts||[]).filter(p=>!p.is_promise || p.kind!=='text');

        <div class="v2-tk-head"><span><b>${typeLabel(m.type)}</b>№ ${v2MissionNo(m,i)}</span><span>${v2FreqLabel(m)}</span></div>
        <div class="v2-verb${m.type==='Аскеза'?' sm':''}"><img src="${YASHIELD_URI}" alt="Я"><span>${v2Verb(m)}</span></div>
        <div class="v2-goal" style="font-size:18px"><span>${tf(m.title)}</span></div>
        <div class="v2-tear"></div>
        ${m.meaning ? `<div style="font-size:13px;line-height:1.45;color:#333"><span class="v2-mono" style="font-size:9px;letter-spacing:.12em">${tr('Зачем','Why')}</span><br>${v2Esc(tf(m.meaning))}</div>` : ''}
        <div style="margin-top:${m.meaning?14:0}px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;font-size:12px;font-weight:700">
          <div><div class="v2-mono" style="font-size:9px;font-weight:500">${tr('Старт','Start')}</div>${v2DateShort(m.startDate)}</div>
          <div><div class="v2-mono" style="font-size:9px;font-weight:500">${tr('Финиш','Finish')}</div>${v2DateShort(m.targetDate)}</div>
          <div><div class="v2-mono" style="font-size:9px;font-weight:500">${tr('Наставник','Mentor')}</div>${v2Esc(mentorLabel)}</div>
        </div>
      </div>

      <div class="md-orbit">
        <div class="md-ring">
          <svg width="140" height="140" viewBox="0 0 140 140" fill="none">
            <defs><radialGradient id="mdCore" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FF5A1F" stop-opacity=".22"/><stop offset="1" stop-color="#FF5A1F" stop-opacity="0"/></radialGradient></defs>
            <circle cx="70" cy="70" r="44" fill="url(#mdCore)"><animate attributeName="r" values="38;48;38" dur="3s" repeatCount="indefinite"/></circle>
            <circle cx="70" cy="70" r="60" stroke="#1d1d1d" stroke-width="8"/>
            <circle cx="70" cy="70" r="60" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 70 70)"><animate attributeName="stroke-dashoffset" from="${C}" to="${off}" dur="1.6s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/></circle>
            <g transform="rotate(${deg} 70 70)"><circle cx="70" cy="10" r="7" fill="#FF5A1F" stroke="#000" stroke-width="3"/><animateTransform attributeName="transform" type="rotate" from="0 70 70" to="${deg} 70 70" dur="1.6s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/></g>
          </svg>
          <div class="md-ring-c"><b>${pct}%</b><span class="v2-mono" style="font-size:9px;margin-top:2px">${tr('Тяга','Thrust')}</span></div>
        </div>
        <div class="md-stats">
          <div><b>${elapsed}</b><span>${tr('дней в пути','days in')}</span></div>
          <div><b>${reports}</b><span>${tr('отчётов','reports')}</span></div>
          <div><b>${missed==null?'—':missed}</b><span>${tr('пропусков','missed')}</span></div>
          <div><b>${left==null?'—':left}</b><span>${tr('дней до финиша','days to finish')}</span></div>
        </div>
      </div>

      <div style="margin-top:16px">${(m.type!=='Аскеза' && missionTrulyComplete(m))
        ? v2Cta(tr('Завершить миссию','Finish mission'), `openMissionCheck(${i})`, 'light')
        : v2ReportedToday(m) ? v2Done(tr('Отчёт принят','Report accepted'), true)

      ${missionBoostsHtml(m, i)}
      <div style="margin-top:20px;display:flex;justify-content:space-between;align-items:baseline">
        <span class="v2-mono">${tr('Отчёты','Reports')} · ${reports}</span>
        <button style="background:none;border:0;color:#8c8c8c;font-size:12px;cursor:pointer;font-family:var(--font-body)" onclick="openMissionThread(${i})">${tr('Все','All')} →</button>
      </div>

        : posts.length ? `<div class="md-vids">${posts.slice().reverse().slice(0,12).map(vid).join('')}</div>`
        : `<p class="hint">${tr('Первый отчёт появится здесь.','Your first report will show up here.')}</p>`}

      <button class="md-cancel" onclick="openCancelMission(${i})">${tr('Отменить миссию','Cancel mission')}</button>
    `;
  },

  // A mission's whole story in one place: the promise video first, then every
  // dated/numbered report underneath it — day 1 at the top — exactly what
  // followers see about this pilot's mission in the Illuminator feed.
  missionThread(){
    const m = state.missions[state.missionThreadFor];
    if (!m) return screenShell(`<div class="placeholder-box">${tr('Миссия не найдена.','Mission not found.')}</div>`, {step:'thread'});
    const posts = state.missionThreadPosts;
    const postRow = (post) => {
      const day = post.report_day ? tr(`День ${post.report_day}`,`Day ${post.report_day}`) : tr('Обещание','Promise');
      const when = post.created_at ? new Date(post.created_at).toLocaleDateString(state.lang==='en'?'en-US':'ru-RU') : '';
      const media = post.kind==='video'
        ? `<video src="${post.video_url}${String(post.video_url).includes('#')?'':'#t=0.1'}" controls playsinline preload="metadata" style="width:100%;border-radius:12px;max-height:220px;object-fit:cover;background:#000;"></video>`
        : post.kind==='photo'
          ? `<img src="${post.photo_url}" style="width:100%;border-radius:12px;max-height:220px;object-fit:cover;">`
          : `<p class="lead" style="margin-top:6px;">${post.text_body || ''}</p>`;
      return `
        <div class="card" style="margin-bottom:10px;">
          <div class="mtop"><span class="mtitle">${day}</span><span class="mtype">${when}</span></div>
          ${media}
          ${post.caption ? `<p class="hint" style="margin-top:6px;">${post.caption}</p>` : ''}
        </div>
      `;
    };
    return screenShell(`
      <div class="eyebrow">${typeLabel(m.type)}</div>
      <h1>${tf(m.title)}</h1>
      <p class="hint" style="margin:-4px 0 14px;">${tr('Обещание и все отчёты по этой миссии — один за другим, с первого дня.','The promise and every report on this mission — one by one, from day one.')}</p>
      ${state.missionThreadLoading ? `<p class="hint">${tr('Загружаем…','Loading…')}</p>` :
        posts.length===0 ? `<div class="placeholder-box">${tr('Пока нет постов по этой миссии.','No posts on this mission yet.')}</div>` :
        posts.map(postRow).join('')
      }
    `, {step: tr('Отчёты','Reports')});

  // The generic version of missionThread(): works for ANY mission in the
  // Illuminator feed (not just the viewer's own), grouped by mission_id/author
  // so tapping "All reports" on a feed card always lands here — the main
  // promise video up top, every report threaded underneath, one page per
  // mission, exactly what the mission's own user would see on their page.
  feedMissionThread(){
    const g = state.illumFeedGroups[state.feedMissionThreadFor];
    if (!g) return screenShell(`<div class="placeholder-box">${tr('Миссия не найдена.','Mission not found.')}</div>`, {step:'thread'});
    const rep = g.rep;
    const authorName = rep.author_name || rep.author || tr('Пилот','Pilot');
    const title = rep.mission_title || (rep.missionTitle ? tf(rep.missionTitle) : tr('Миссия','Mission'));
    const sorted = [...g.posts].sort((a,b) => {
      const aPromise = a.isPromise || a.is_promise, bPromise = b.isPromise || b.is_promise;
      if (aPromise !== bPromise) return aPromise ? -1 : 1;
      const aDay = a.day ?? a.report_day ?? 0, bDay = b.day ?? b.report_day ?? 0;
      return aDay - bDay;
    });
    const postRow = (post) => {
      const isPromise = post.isPromise || post.is_promise;
      const day = post.day ?? post.report_day;
      const label = isPromise ? tr('Обещание','Promise') : (day ? tr(`День ${day}`,`Day ${day}`) : tr('Отчёт','Report'));
      const when = post.created_at ? new Date(post.created_at).toLocaleDateString(state.lang==='en'?'en-US':'ru-RU') : '';
      const media = post.video_url
        ? `<video src="${post.video_url}${String(post.video_url).includes('#')?'':'#t=0.1'}" controls playsinline preload="metadata" style="width:100%;border-radius:12px;max-height:220px;object-fit:cover;background:#000;"></video>`
        : post.photo_url
          ? `<img src="${post.photo_url}" style="width:100%;border-radius:12px;max-height:220px;object-fit:cover;">`
          : `<p class="lead" style="margin-top:6px;">${post.text_body || post.caption || ''}</p>`;
      return `
        <div class="card" style="margin-bottom:10px;">
          <div class="mtop"><span class="mtitle">${label}</span><span class="mtype">${when}</span></div>
          ${media}
          ${post.caption ? `<p class="hint" style="margin-top:6px;">${post.caption}</p>` : ''}
        </div>
      `;
    };
    return screenShell(`
      <div class="eyebrow">${authorName}</div>
      <h1>${title}</h1>
      <p class="hint" style="margin:-4px 0 14px;">${tr('Обещание и все отчёты по этой миссии — один за другим, с первого дня.','The promise and every report on this mission — one by one, from day one.')}</p>
      ${sorted.map(postRow).join('')}
    `, {step: tr('Отчёты','Reports')});
  },

  // Standalone daily check-in "space road" — a winding path of 15 waypoints
  // (planet/star/galaxy per Maksim's brief), independent of the mission-report
  // streak. The visible cycle wraps every 15 days; state.profile.checkin.streak
  // keeps counting forever underneath it (see CHECKIN_CYCLE / claimCheckin()).
  checkinRoad(){
    const c = state.profile.checkin;
    const today = todayISO();
    const alreadyToday = c.lastDate === today;
    const yesterday = addDaysISO(-1);
    const continuing = c.lastDate === yesterday || c.lastDate === today;
    // The day we're currently ON (already claimed today) or ABOUT TO claim.
    const activeAbsoluteDay = alreadyToday ? c.streak : (continuing ? c.streak+1 : 1);
    const cycleDay = checkinCycleDay(activeAbsoluteDay);
    const lap = Math.floor((activeAbsoluteDay-1)/CHECKIN_CYCLE.length) + 1;
    const nodes = CHECKIN_CYCLE.map(r=>{
      let st;
      if (r.day < cycleDay) st = 'done';
      else if (r.day === cycleDay) st = alreadyToday ? 'done-today' : 'claimable';
      else st = 'future';
      return {...r, st};
    });
    // Shown once, right after tapping "Выйти на связь" — consumed here so a
    // later, unrelated re-render of this same screen doesn't repeat it.
    const justRevealed = !!state.checkinRevealPending;
    state.checkinRevealPending = false;
    const points = checkinMapPoints();
    const fullPathD = smoothPathD(points);
    const traveledPathD = smoothPathD(points.slice(0, Math.max(1, cycleDay)));
    return screenShell(`
      <div class="eyebrow">${tr('Радиообмен','Radio check-in')}</div>
      <h1>${tr('Космическая карта','Space map')}</h1>
      <p class="hint" style="margin:-4px 0 14px;">${tr('Ежедневный сеанс связи с ЦУЦ открывает Terra Incognito — весь лут, что найдёшь на этой земле, твой.','A daily radio session with Mission Control opens up Terra Incognito — all the loot you find on that land is yours.')}</p>

      <div class="road-stats">
        <div class="cell"><div class="val">${c.streak}</div><div class="lbl">${tr('Серия','Streak')}</div></div>
        <div class="cell"><div class="val">${c.longest}</div><div class="lbl">${tr('Рекорд','Best')}</div></div>
        <div class="cell"><div class="val">${lap}</div><div class="lbl">${tr('Круг','Lap')}</div></div>
      </div>

      ${(() => { const pz = (state.prizes||[]).find(x => x.id === state.lastCheckinPrizeId) || (alreadyToday ? (state.prizes||[]).find(x => x.source_ref === 'checkin:' + today) : null);
        if (!pz || !(justRevealed || pz.status === 'ready')) return '';
        return `<div class="road-reveal">
        <div class="rr-label">${tr('Локация открыта','Location unlocked')}</div>
        <div class="rr-found">${tr('Найдено:','Found:')}</div>
        <div class="rr-reward">${v2Esc(prizeTitle(pz))}</div>
        ${pz.status === 'ready' ? `<button class="prz-btn" style="margin-top:14px;width:100%;height:46px;font-size:15px" ${pz._busy?'disabled':''} onclick="claimPrize(${pz.id})">${pz._busy ? '…' : tr('Забрать','Claim')}</button>` : `<div class="hint" style="margin-top:8px">${pz.kind==='ls'||pz.kind==='rep' ? tr('Начислено','Added') : pz.kind==='badge' ? tr('Значок в профиле','Badge is on your profile') : tr('Лежит в «Моих призах»','Waiting in «My prizes»')}</div>`}
      </div>`; })()}

      <div class="road-map">
        <svg viewBox="0 0 ${CHECKIN_MAP_W} ${CHECKIN_MAP_H}" preserveAspectRatio="none">
          <path d="${fullPathD}" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round"/>
          <path d="${traveledPathD}" fill="none" stroke="var(--invert-bg)" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
        </svg>
        ${nodes.map((r,i)=>{
          const kind = checkinWaypointKind(r.day);
          const pt = points[i];
          const isShip = r.st==='claimable';
          const glyph = isShip ? '▲' : (r.st==='done'||r.st==='done-today') ? '✓' : CHECKIN_KIND_GLYPH[kind];
          return `
          <div class="road-wp kind-${kind} rn-${r.st}" style="left:${(pt.x/CHECKIN_MAP_W*100).toFixed(2)}%;top:${(pt.y/CHECKIN_MAP_H*100).toFixed(2)}%;">
            <div class="wp-dot">${glyph}</div>
            <div class="wp-day">${r.day}</div>
          </div>`;
        }).join('')}
      </div>

      <div class="road-claim-bar">
        ${alreadyToday
          ? `<button class="btn ghost block" disabled style="opacity:.6;">${tr('Сегодня уже в эфире — возвращайся завтра','Already on the air today — come back tomorrow')}</button>`
          : `<button class="btn primary block" ${state.checkinBusy?'disabled':''} onclick="doClaimCheckin()">${state.checkinBusy ? tr('Связь…','Connecting…') : tr('Выйти на связь','Check in now')}</button>`
        }
        <button class="btn ghost block" style="margin-top:10px" onclick="go('prizes')">${tr('Мои призы','My prizes')}${prizesReady().length ? ` · ${tr('ждут','waiting')}: ${prizesReady().length}` : prizesActive().length ? ` · ${prizesActive().length}` : ''}</button>
      </div>

      <h3 style="margin:20px 0 6px;">${tr('Журнал вылазок','Expedition log')}</h3>
      ${c.history && c.history.length
        ? c.history.slice(0,40).map(h=>`<div class="road-hist-row"><span class="rh-day">${tr('День','Day')} ${h.day}</span><span class="rh-reward">${tf(h)}</span></div>`).join('')
        : `<p class="hint">${tr('Пока пусто — выйди на связь, чтобы начать журнал.','Empty so far — check in to start your log.')}</p>`
      }
    `, {step: tr('Карта','Map')});
  },

  prizes(){
    const all = state.prizes || [];
    const ready = all.filter(p => p.status === 'ready');
    const live = all.filter(p => prizeLive(p));
    const past = all.filter(p => p.status !== 'ready' && !prizeLive(p)).slice(0, 40);

      <p class="hint" style="margin:-4px 0 14px;">${tr('Л.С. и репутация начисляются, как только ты забираешь приз. Скидки, усиления и сессии ждут здесь, пока действуют.','Flight Hours and reputation are added as soon as you claim. Discounts, boosts and sessions wait here while they are valid.')}</p>
      ${ready.length ? `<div class="prz-head"><h3>${tr('Ждут тебя','Waiting for you')}</h3>${ready.length > 1 ? `<button class="prz-all" onclick="claimAllPrizes()">${tr('Забрать всё','Claim all')}</button>` : ''}</div>${ready.map(prizeCardHtml).join('')}` : ''}

      ${live.length ? live.map(prizeCardHtml).join('') : `<p class="hint">${tr('Пока пусто. Скидки, секретные усиления и сессии с наставником выпадают на космической карте.','Empty for now. Discounts, secret boosts and mentor sessions drop on the space map.')}</p>`}
      ${past.length ? `<h3 style="margin:18px 0 8px;">${tr('История','History')}</h3>${past.map(prizeCardHtml).join('')}` : ''}
      <button class="btn ghost block" style="margin-top:18px" onclick="go('checkinRoad')">${tr('К космической карте','To the space map')}</button>

    const nextThreshold = reputationThresholdFor(trustLevel+1);

    return screenShell(`
      <div class="eyebrow">${tr('Уровень доверия','Trust level')}</div>
      <div class="level-hero">
        <div class="level-hero-badge"><img src="${YASHIELD_URI}" alt="Я"><span class="level-hero-num">${trustLevel}</span></div>

      </div>

      <div class="track" style="margin:6px 0 16px;"><i style="width:${pct}%"></i></div>

      ${trustLevel>=8 ? `<div class="card" style="margin:10px 0;">
        <div class="t-title" style="margin-bottom:6px;">${tr('8 уровень открыт','Level 8 unlocked')}</div>
        <p class="hint" style="margin:0;">${tr('Доступен личный специалист — психолог, тренер, теннисный коуч и другие. Напиши в поддержку, чтобы подобрать подходящего.','A real human specialist is now available — psychologist, gym coach, tennis coach, and others. Message support to get matched.')}</p>
      </div>` : ''}

      <button class="btn ghost block" style="margin:14px 0 10px" onclick="go('prizes')">${tr('Мои призы','My prizes')}${prizesActive().length ? ' · ' + prizesActive().length : ''}</button>
      <p class="hint">${tr('Л.С. видны только тебе. Репутация видна всем.','Flight Hours are private to you. Reputation is public.')}</p>
    `, {step: tr('Уровень','Level')});
  },

          <div class="row"><div class="lab">${tr('Энергетика','Energy')}</div><div class="txt">${tf(info.energy)}</div></div>
          <div class="row"><div class="lab">${tr('Тон поддержки','Tone of support')}</div><div class="txt">${tf(info.tone)}</div></div>

  awaitingPayment(){
    const p = state.payment || {};
    const kindLabel = PAYMENT_KIND_CONFIG[p.kind] ? PAYMENT_KIND_CONFIG[p.kind].label() : '';
    let body;
    if (p.status === 'creating') {
      body = `<p class="lead">${tr('Создаём платёж','Creating the payment')}${DOTS}</p>
        <p class="hint">${tr('Обычно это занимает несколько секунд. Сейчас откроется страница оплаты ЮKassa.','This usually takes a few seconds. The ЮKassa payment page will open.')}</p>`;
    } else if (p.status === 'succeeded') {
      body = `<p class="lead">${tr('Оплата прошла — переходим дальше','Payment went through — moving on')}${DOTS}</p>`;
    } else if (p.status === 'canceled') {
      body = `<p class="lead">${tr('Платёж отменён или не прошёл.','The payment was canceled or failed.')}</p>
        <button class="btn primary block" style="margin-top:14px;" onclick="retryPayment('${p.kind}')">${tr('Попробовать снова','Try again')}</button>
        <button class="btn ghost block" style="margin-top:10px;" onclick="cancelPaymentWait()">${tr('← Назад','← Back')}</button>`;
    } else if (p.status === 'timeout') {
      body = `<p class="lead">${tr('Оплата пока не поступила.','The payment hasn\'t arrived yet.')}</p>
        <button class="btn primary block" style="margin-top:14px;" onclick="recheckPaymentNow()">${tr('Проверить ещё раз','Check again')}</button>
        <button class="btn ghost block" style="margin-top:10px;" onclick="cancelPaymentWait()">${tr('← Назад','← Back')}</button>`;
    } else if (p.status === 'error') {
      body = `<p class="lead">${tr('Не получилось создать платёж.','Couldn\'t create the payment.')} ${p.error==='age_not_confirmed' ? tr('Нужно подтвердить возраст.','Age needs to be confirmed.') : (p.error==='yookassa_not_configured' ? tr('Оплата ещё не подключена — это тестовая сборка.','Payment isn\'t connected yet — this is a test build.') : '')}</p>
        <button class="btn ghost block" style="margin-top:14px;" onclick="cancelPaymentWait()">${tr('← Назад','← Back')}</button>`;
    } else {
      body = `<p class="lead">${tr('Ждём оплату','Waiting for the payment')}${DOTS}</p>
        <p class="hint">${tr('Как только оплата пройдёт, миссия запустится сама — ничего нажимать не нужно.','As soon as the payment goes through, the mission starts by itself — nothing to tap.')}</p>

        <button class="btn ghost block" style="margin-top:10px;" onclick="cancelPaymentWait()">${tr('Отменить','Cancel')}</button>`;
    }
    return screenShell(`
      <div class="eyebrow">${kindLabel}</div>
      <h1>${tr('Оплата','Payment')}</h1>
      ${body}
    `, {step:tr('Оплата','Payment'), back:false});
  },

  // Askeza's check-in is a paced SUPPORT touchpoint tied to the mission's
  // actual calendar days, not a one-shot "finish the whole thing now" list —
  // direct bug report: with no daily gate here, tapping "Всё ещё держусь"

  // Same one-check-in-per-day rule the habit/result 'checkin' screen already
  // enforces via lastReportDate (see bumpMission below, which now sets it).
  askezaCheck(){
    const m = state.missions[state.checkinMissionIndex];
    const today = new Date().toISOString().slice(0,10);
    const alreadyToday = m && m.lastReportDate === today;
    if (alreadyToday){
      return screenShell(`
        <div class="eyebrow">${tr('Периодическое напоминание','Periodic reminder')}</div>

        <button class="btn primary block" style="margin-top:16px;" onclick="go('home',{replace:true})">${tr('Ок','OK')}</button>
      `, {back:false, step:'D1А'});
    }
    return screenShell(`
      <div class="eyebrow">${tr('Периодическое напоминание','Periodic reminder')}</div>
      <h1>${tr('Как оно там?','How\'s it going?')}</h1>
      ${m&&m.targetDate ? `<div class="finish-chip">
        <span class="fc-label">${tr('Финиш','Finish line')}</span><span class="fc-date">${m.targetDate}</span>
      </div>` : ''}
      <div class="cosmo-msg">
        <div class="who">${tr('Космонавт','Cosmonaut')}</div>${tr('\n        Пшшщщщ... Земля на связи — не проверка, просто соскучились. Как оно там, без того, от чего отказался? Гравитация иногда подкрадывается незаметно. Если туго — свистни, у нас тут целый Центр Управления на подхвате, не одна я такая заботливая. Отбой.\n      ','\n        Pshhhh... Ground Control calling the ship — not a check-in, just missed you. How\'s it going, without the thing you gave up? Gravity sometimes creeps up quietly. If it gets tough — give a shout, there\'s a whole Mission Control standing by, I\'m not the only one who cares here. Over and out.\n      ')}</div>
      <div class="stack" style="margin-top:16px;">
        <button class="btn primary block" onclick="go('askezaHoldOk',{replace:true})">${tr('Всё ещё держусь','Still holding on')}</button>
        <button class="btn ghost block" onclick="go('askezaBreak',{replace:true})">${tr('Туговато, нужна помощь','It\'s tough, need help')}</button>
      </div>
    `, {step:'D1А'});
  },

  askezaHoldOk(){
    // Completion pivot (2026-09-25): the finish line is m.targetDate (the
    // calendar date of arrival chosen at aDuration) — not a count of
    // check-ins. reportCount still increments for the progress bar/history,
    // but a mission only completes once today has reached targetDate,
    // whether that's the first check-in or the fiftieth.
    const idx = state.checkinMissionIndex;
    const m = state.missions[idx];
    if (m) m.reportCount = (m.reportCount||0) + 1;
    bumpMission();
    if (isMissionDue(m)){
      return SCREENS.askezaSuccess();

    return screenShell(`
      <h1>${tr('Принято','Accepted')}</h1>
      <div class="cosmo-msg">
        <div class="who">${tr('Космонавт','Cosmonaut')}</div>${tr('\n        Пшшщщщ... Есть, держишь курс! Земля отмечает — маленький бонус Л.С. уже начислен. Отбой.\n      ','\n        Pshhhh... Copy that, holding course! Ground Control notes it — a small Flight Hours bonus has already landed. Over and out.\n      ')}</div>

// Скоринговый рекомендательный алгоритм: считает баллы каждого наставника
// по ответам анкеты (психотип, поддержка/соревнование, тон, стойкость) —
// побеждает наставник с максимальным баллом. Используется и для медали
// "Рекомендован" на карточке, и для текстовой рекомендации внизу экрана.
const MENTOR_SCORES = {
  'Аналитик':      { 'Алина ДиЭнЭй':3, 'Профессор':1, 'Космонавт':1 },
  'Боец':          { 'Товарищ Ли':3, 'Ледокол':2, 'Витя Убуд':1 },
  'Творец':        { 'DJ Midnight':3, 'Лиза Джаз':2, 'Витя Убуд':1 },
  'Опекун':        { 'Мама Женя':3, 'Баба Зина':2, 'Космонавт':1 },
  'Не знаю':       { 'Космонавт':3 },
};
function computeRecommendedMentor(formRef){
  formRef = formRef || state.form;
  const hasSignal = formRef.psychotype || formRef.supportStyle || formRef.toneSupport!==40 || formRef.persistence!==60;
  if(!hasSignal) return null;
  const scores = {};
  const bump = (name, pts) => { scores[name] = (scores[name]||0) + pts; };

  if(formRef.psychotype && MENTOR_SCORES[formRef.psychotype]){
    Object.entries(MENTOR_SCORES[formRef.psychotype]).forEach(([n,p])=>bump(n,p));
  }
  if(formRef.supportStyle === 'Поддержка'){ bump('Баба Зина',1); bump('Мама Женя',1); bump('Космонавт',1); }
  if(formRef.supportStyle === 'Соревнование'){ bump('Товарищ Ли',1); bump('Ледокол',1); bump('Профессор',1); }
  if(formRef.supportStyle === 'И то, и другое'){ bump('DJ Midnight',1); bump('Ледокол',1); }
  if(formRef.supportStyle === 'Недооценивают'){ bump('Космонавт',1); bump('Леха P1x3l',2); bump('Товарищ Ли',1); }
  if(formRef.supportStyle === 'Помогаю другим'){ bump('Баба Зина',2); bump('Мама Женя',1); }

  const tone = Number(formRef.toneSupport);
  if(tone < 35){ bump('Витя Убуд',2); bump('Баба Зина',1); }
  else if(tone > 65){ bump('Товарищ Ли',2); bump('Ледокол',1); }
  else { bump('Космонавт',1); bump('Ледокол',1); }

  const persist = Number(formRef.persistence);
  if(persist < 35){ bump('Товарищ Ли',1); bump('Ледокол',1); }
  else if(persist > 65){ bump('Профессор',1); bump('Лиза Джаз',1); }

  let best = null, bestScore = -1;
  Object.entries(scores).forEach(([name, sc])=>{ if(sc>bestScore){ best=name; bestScore=sc; } });
  return best;
}
function recommendedMentorLine(formRef){
  formRef = formRef || state.form;
  const rec = computeRecommendedMentor(formRef);
  if(!rec) return '';
  return `<p class="hint" style="margin-top:10px;">${tr('По твоим ответам подойдёт: ','Based on your answers, a good fit is: ')}<b style="color:var(--text);">${mentorName(rec)}</b>${tr(' — отмечен медалью «Рекомендован» выше.',' — marked with the “Recommended” badge above.')}</p>`;
}

/* ==== Иллюминатор: запись видео прямо в приложении (getUserMedia + MediaRecorder) ==== */
let illumStream = null, illumRecorder = null, illumChunks = [], illumBlob = null, illumTimerHandle = null, illumSeconds = 0;

// iOS/WKWebView bug: on phones with multiple front-facing lenses, getUserMedia
// sometimes starts the stream at a non-1x zoom level (the camera picks a
// telephoto crop instead of the standard lens), which reads as the preview
// being "super zoomed in" even though the video/CSS box itself is correct.
// Where the browser exposes a zoom capability, force it back to the minimum
// (1x) right after the stream opens. No-op (and harmless) on devices/browsers
// that don't support the zoom constraint.
function resetCameraZoomIfSupported(stream){
  try {
    const track = stream && stream.getVideoTracks && stream.getVideoTracks()[0];
    if (!track || !track.getCapabilities) return;
    const caps = track.getCapabilities();
    if (caps && caps.zoom && typeof caps.zoom.min === 'number') {
      track.applyConstraints({ advanced: [{ zoom: caps.zoom.min }] }).catch(()=>{});
    }
  } catch(e){ /* zoom constraint unsupported — leave the default framing */ }
}

function stopIllumMedia(){
  try { if (illumRecorder && illumRecorder.state !== 'inactive') illumRecorder.stop(); } catch(e){}
  try { if (illumStream) illumStream.getTracks().forEach(t=>t.stop()); } catch(e){}
  illumStream = null; illumRecorder = null;
  if (illumTimerHandle) { clearInterval(illumTimerHandle); illumTimerHandle = null; }
}

async function enterIllumRecordScreen(){
  try {
    illumStream = await navigator.mediaDevices.getUserMedia({
      // Deliberately NOT requesting aspectRatio/width here (see the
      // "still zoomed" bug report after the first fix attempt) — asking
      // iOS/WKWebView's getUserMedia for a specific aspectRatio (9/16) is
      // itself what was triggering an aggressive software crop/zoom on some
      // phones, not just a fallback-to-a-wider-mode issue. Requesting only
      // facingMode lets the camera driver hand back its native, un-cropped
      // feed; the 9:16 framing is applied purely in CSS on the <video>
      // element (aspect-ratio:9/16; object-fit:cover — see wizardCamBlock /
      // the cameraPreview markup), which crops for DISPLAY only and doesn't
      // touch what the camera hardware itself captures.
      video: {
        facingMode: 'user',
        frameRate: { ideal: 30, max: 30 }
      },
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
    resetCameraZoomIfSupported(illumStream);
    const video = document.getElementById('cameraPreview');
    if (video) {
      video.srcObject = illumStream;
      // Front camera preview mirrors like a native iPhone camera app.
      // The recorded/published file itself is left un-mirrored (see below).
      video.style.transform = 'scaleX(-1)';

  } catch (e) {

    const video = document.getElementById('cameraPreview');

      const p = document.createElement('p');

      p.textContent = tr('Не удалось получить доступ к камере. Проверь разрешения в настройках Telegram/браузера.','Couldn\'t access the camera. Check permissions in Telegram/browser settings.');
      video.replaceWith(p);
    }

}

function startIllumRecording(){
  if (!illumStream) return;
  illumChunks = [];
  const mimeCandidates = VIDEO_MIME_PREF;
  const mime = mimeCandidates.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || '';
  try {
    // Higher bitrate for a sharper, less compressed recording.
    illumRecorder = mime
      ? new MediaRecorder(illumStream, { mimeType: mime, videoBitsPerSecond: 4_000_000, audioBitsPerSecond: 128_000 })
      : new MediaRecorder(illumStream, { videoBitsPerSecond: 4_000_000, audioBitsPerSecond: 128_000 });
  } catch (e) { console.warn('MediaRecorder init failed', e); return; }
  illumRecorder.ondataavailable = (e) => { if (e.data && e.data.size>0) illumChunks.push(e.data); };
  illumRecorder.onstop = () => {
    illumBlob = new Blob(illumChunks, { type: (illumRecorder && illumRecorder.mimeType) || 'video/webm' });
    state.illumRecording.status = 'reviewing';
    render();
    setTimeout(() => {
      const video = document.getElementById('cameraPreview');
      if (video) {
        video.srcObject = null; video.muted = false; video.src = URL.createObjectURL(illumBlob);
        // Playback of the saved file is shown the right way round, not mirrored.
        video.style.transform = 'none';
      }
    }, 0);
  };
  illumRecorder.start();
  state.illumRecording.status = 'recording';
  illumSeconds = 0;
  render();
  setTimeout(() => {
    const video = document.getElementById('cameraPreview');
    if (video && illumStream) { video.srcObject = illumStream; video.style.transform = 'scaleX(-1)'; }
  }, 0);
  illumTimerHandle = setInterval(() => {
    illumSeconds++;
    const t = document.getElementById('recTimer');
    if (t) t.textContent = String(Math.floor(illumSeconds/60)).padStart(2,'0')+':'+String(illumSeconds%60).padStart(2,'0');
    if (illumSeconds >= 60) stopIllumRecording();
  }, 1000);
}

function stopIllumRecording(){
  if (illumTimerHandle) { clearInterval(illumTimerHandle); illumTimerHandle = null; }
  try { if (illumRecorder && illumRecorder.state !== 'inactive') illumRecorder.stop(); } catch(e){}
}

}

// Live in-app photo capture — takes a snapshot off the same getUserMedia
// stream used for video, instead of a device file/gallery picker (which let
// people upload an old photo rather than proving the moment live).
function capturePhoto(){
  const video = document.getElementById('cameraPreview');
  if (!video || !video.videoWidth) return;
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  // Preview is CSS-mirrored (scaleX(-1)) for a natural selfie feel, but the
  // saved photo itself should read normally — same convention as video.
  ctx.translate(canvas.width, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  canvas.toBlob((blob) => {
    if (!blob) return;
    state.illumRecording.photoBlob = blob;
    state.illumRecording.photoPreview = canvas.toDataURL('image/jpeg', 0.92);
    render();
  }, 'image/jpeg', 0.92);
}

// Л.С. (Лётные Часы / "Flight Hours") formula — 2026-09-25 reputation pivot:
// longer missions and more consistent reporting both pay out more. Full
// formula sheet lives in memory ([[tyaga]]) and as a delivered reference doc;
// summary: each report pays a flat rate that rises in steps with the
// mission's committed length (lsPerReportFor), and finishing a mission pays
// a one-time completion bonus that scales with length AND with how
// consistently the person actually reported (computeCompletionBonus).
// ===== Л.С. / Репутация formula, 2026-09-26 revision (confirmed by Maksim) =====
// Two separate currencies from here on:
//  - Л.С. ("Flight Hours") — private, account-only, spendable on merch/boosts.
//  - Репутация (reputation) — public, shown to everyone, drives Уровень
//    Доверия (trust level, replaces the old "Допуск" rank ladder concept).
// Per-report reward now depends on HOW the report was made, not the
// mission's length (length is instead what the completion bonus rewards).
const REPORT_REWARDS = {
  video:     { ls:10, rep:3 },
  photoText: { ls:8,  rep:2 },
  photo:     { ls:6,  rep:2 },
  text:      { ls:5,  rep:1 },
};
// r is the illuminator recording object (state.illumRecording) at publish
// time — kind is 'video'|'photo'|'text'; a photo report WITH a caption
// counts as the richer "photo + text" tier. Askeza's plain tap check-in
// (no media captured) and any other caller with nothing to classify falls
// back to 'text', the floor rate.
function reportKindFor(r){
  if (!r) return 'text';
  if (r.kind === 'video') return 'video';
  if (r.kind === 'photo') return (r.caption && r.caption.trim()) ? 'photoText' : 'photo';
  return 'text';
}
// Running several missions at once multiplies reputation earned (not Л.С.)
// — 1 extra active mission ×1.2, a 2nd extra ×1.3, a 3rd+ extra ×1.4.
function reputationMultiplier(){
  const n = state.missions.length;
  if (n <= 1) return 1;
  if (n === 2) return 1.2;
  if (n === 3) return 1.3;
  return 1.4;
}
// One-time completion bonus, banded by the mission's committed length.
// Askeza gets its own (lower) table — Maksim's note: "as it is harder to
// control" — resisting for a long time is its own reward, so the payout
// curve is flatter/lower than Habit/Result's.
function completionBonusFor(m){
  const days = m.totalDays || 21;
  let ls, rep;
  if (m.type === 'Аскеза'){
    if (days <= 40)      { ls = 41;  rep = 20; }
    else if (days <= 100){ ls = 101; rep = 60; }
    else if (days <= 180){ ls = 181; rep = 100; }
    else                 { ls = 366; rep = 200; }
  } else { // Привычка / Результат
    if (days <= 40)      { ls = 100; rep = 30; }
    else if (days <= 100){ ls = 300; rep = 100; }
    else if (days <= 180){ ls = 500; rep = 180; }
    else                 { ls = 1500; rep = 500; }
  }
  return { ls, rep: Math.round(rep * reputationMultiplier()) };
}
// Daily check-in streak — counts CALENDAR DAYS with at least one report
// across ANY mission, not report events (checking in on 2 missions the same
// day must not count as 2 days). Resets to 1 on any gap, holds steady on a
// repeat same-day call, or advances by 1 the day right after the last one.
const STREAK_REWARDS = {
  7:  { ls:50,  badge:'streak7',  vouchers:{ merchDiscountPct:10 } },
  14: { ls:150, badge:'streak14', vouchers:{ merchDiscountPct:20 } },
  30: { ls:400, badge:'streak30', vouchers:{ freeEnhancement:1, freeHumanMentorSession:1 } },
};
function grantStreakReward(days){
  // the server creates the prizes (Л.С., badge, discount / boost / session); the person claims them in «Мои призы»
  if (!sb || !TG_ID) return;
  setTimeout(async () => {
    try { await dbUpsertUserStats(); const { data } = await sb.rpc('streak_reward', { p_days: days }); if (data) { await loadPrizes(); v2Toast(tr(`Серия ${days} дней! Награды ждут в «Моих призах»`, `${days}-day streak! Rewards wait in «My prizes»`)); } } catch(e){}
  }, 800);
}
function registerDailyActivity(){
  const s = state.profile.streak;
  const today = todayISO();
  if (s.lastActiveDate === today) return; // already counted today
  const yesterday = addDaysISO(-1);
  // ВТОРОЙ ШАНС: exactly one missed day is forgiven once per mission that has the boost
  const sc = (s.lastActiveDate === addDaysISO(-2) && s.current > 0) ? (state.missions||[]).find(m => (m.boostState||{}).second_chance_used === yesterday) : null;
  if (sc) { s.current += 1; }
  else if (s.lastActiveDate === yesterday) s.current += 1;
  else { s.current = 1; s.milestones = {}; } // gap (or very first day) — streak restarts, milestones re-earnable
  s.lastActiveDate = today;
  s.longest = Math.max(s.longest, s.current);
  if (!s.milestones) s.milestones = {};
  if (s.current === 7 && !s.milestones.d7)  { s.milestones.d7 = true;  grantStreakReward(7); }
  if (s.current === 14 && !s.milestones.d14){ s.milestones.d14 = true; grantStreakReward(14); }
  // 30-day tier repeats every further 30-day stretch (30, 60, 90…) as an
  // ongoing loyalty reward rather than a one-off.
  if (s.current >= 30 && s.current % 30 === 0) grantStreakReward(30);
}

function checkinCycleDay(absoluteDay){ return ((absoluteDay-1) % CHECKIN_CYCLE.length) + 1; }
// Waypoint "kind" for the space-map screen — purely visual grouping, never
// reveals the actual reward (2026-09-28: "don't reveal what's inside").
// gift days = the literal named gifts (7/9/12/15); signal = reputation
// days (6/10/14); fuel = everything else (1/2/3/4/5/8/11).
const CHECKIN_GIFT_DAYS = [7,9,12,15];
const CHECKIN_SIGNAL_DAYS = [6,10,14];
function checkinWaypointKind(day){
  if (CHECKIN_GIFT_DAYS.includes(day)) return 'gift';
  if (CHECKIN_SIGNAL_DAYS.includes(day)) return 'signal';

}
const CHECKIN_KIND_GLYPH = { fuel:'●', signal:'✦', gift:'◆' };
// 15-point snake grid for the space-map screen (3 columns × 5 rows) — this is
// what makes it read as one continuous road from day 1 to day 15 instead of a
// plain list: alternating rows run left→right then right→left, like a
// board-game path, so consecutive days are always adjacent on screen.
// Coordinates are in a fixed 300×260 unit space; the screen positions every
// dot with a left/top PERCENTAGE of that space so it scales with viewport
// width while staying pixel-locked to the SVG connector drawn in the same
// units (see .road-map / .road-map svg — aspect-ratio:300/260 keeps them in sync).
const CHECKIN_MAP_W = 300, CHECKIN_MAP_H = 260;
const CHECKIN_COL_X = [50, 150, 250];
const CHECKIN_ROW_Y = [26, 78, 130, 182, 234];
function checkinMapPoints(){
  const pts = [];
  for (let day=1; day<=CHECKIN_CYCLE.length; day++){
    const row = Math.floor((day-1)/3);
    const idxInRow = (day-1)%3;
    const col = (row%2===0) ? idxInRow : (2-idxInRow);
    pts.push({ day, x: CHECKIN_COL_X[col], y: CHECKIN_ROW_Y[row] });
  }
  return pts;
}
// Smooth curve through a point sequence (Catmull-Rom → cubic Bézier) — used
// so the road between waypoints reads as one continuous flight path rather
// than a jagged straight-segment polyline ("smooth broken line" per Maksim).
function smoothPathD(points){
  if (points.length < 2) return '';
  let d = `M ${points[0].x} ${points[0].y} `;
  for (let i=0; i<points.length-1; i++){
    const p0 = points[i-1] || points[i];
    const p1 = points[i];
    const p2 = points[i+1];
    const p3 = points[i+2] || p2;
    const c1x = p1.x + (p2.x - p0.x)/6, c1y = p1.y + (p2.y - p0.y)/6;
    const c2x = p2.x - (p3.x - p1.x)/6, c2y = p2.y - (p3.y - p1.y)/6;
    d += `C ${c1x} ${c1y}, ${c2x} ${c2y}, ${p2.x} ${p2.y} `;
  }
  return d;
}
function checkinRewardFor(absoluteDay){ return CHECKIN_CYCLE[checkinCycleDay(absoluteDay)-1]; }

function bumpMission(i, reportKind){
  const idx = (i!=null) ? i : (state.checkinMissionIndex!=null ? state.checkinMissionIndex : 0);
  const m = state.missions[idx];
  if(!m) return;
  const wasComplete = m.progress >= 100;
  // Records "today" as this mission's last check-in, same field habit/result
  // reports already use to gate to one-per-day (see the 'checkin' screen's
  // alreadyToday and askezaCheck's above) — previously only set explicitly by
  // finishIllumPublish for habit/result, never for Askeza's own check-in path,
  // which is what let Askeza be cleared in a single sitting.
  m.lastReportDate = new Date().toISOString().slice(0,10);
  m.progress = Math.min(100, m.progress+4);
  const reward = REPORT_REWARDS[reportKind] || REPORT_REWARDS.text;
  const reportRep = Math.round(reward.rep * reputationMultiplier());
  state.profile.ls.total += reward.ls;
  state.profile.ls.byType[m.type] = (state.profile.ls.byType[m.type]||0) + reward.ls;
  state.profile.reputation.total += reportRep;
  state.profile.reputation.byType[m.type] = (state.profile.reputation.byType[m.type]||0) + reportRep;
  registerDailyActivity();
  if(!wasComplete && m.progress >= 100){
    state.profile.completedByType[m.type] = (state.profile.completedByType[m.type]||0) + 1;
  }
  // One-time completion bonus, fired the moment the mission truly finishes
  // (target_date reached, and — for a Habit — reportCount has also caught
  // up to totalDays) — guarded by m.lsBonusAwarded so extending the mission
  // never re-fires it on the same completion.
  if (missionTrulyComplete(m) && !m.lsBonusAwarded){
    m.lsBonusAwarded = true;
    const bonus = completionBonusFor(m);
    state.profile.ls.total += bonus.ls;
    state.profile.ls.byType[m.type] = (state.profile.ls.byType[m.type]||0) + bonus.ls;
    state.profile.reputation.total += bonus.rep;
    state.profile.reputation.byType[m.type] = (state.profile.reputation.byType[m.type]||0) + bonus.rep;
  }
  dbLogProgress(m);
  dbUpsertUserStats();
}

function dayWord(n){
  if (state.lang === 'en') return n===1 ? 'day' : 'days';
  const n10 = n%10, n100 = n%100;
  if(n100>=11 && n100<=14) return 'дней';
  if(n10===1) return 'день';
  if(n10>=2 && n10<=4) return 'дня';
  return 'дней';
}

function setAskezaDuration(days){ state.askeza.duration = {label:days+' '+dayWord(days), days, custom:false}; render(); }
function setAskezaCustomMode(){ state.askeza.duration = {label:'', days:null, custom:true}; render(); }
function daysUntil(dateStr){
  if(!dateStr) return 0;
  const target = new Date(dateStr+'T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((target-today)/86400000);
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function addDaysISO(days){ return new Date(Date.now()+(days||0)*86400000).toISOString().slice(0,10); }
// Completion pivot (2026-09-25): a mission's finish line is the calendar date
// it was set to arrive on (targetDate) — not a count of reports/check-ins.
// A mission is "due" once today has reached that date; only a purchased
// boost that moves targetDate itself (extendMission today, dedicated
// change-dates/extra-day boosts later) can push the finish line out.
function isMissionDue(m){ return !!(m && m.targetDate && todayISO() >= m.targetDate); }
// 2026-09-25 cont.3: date alone isn't enough for a daily Habit — "90-day
// habit" implies 90 real reports, not just 90 days passing on the calendar.
// Result/Askeza stay purely date-gated (a Result is a single goal reached by
// a deadline, not a daily deliverable; Askeza's own check-in flow already
// tracks reportCount separately). Habit specifically also needs
// reportCount to have caught up to totalDays before it truly finishes —
// short on reports past the target date just means check-ins keep going.
// How many reports the mission's OWN promise actually calls for, over its
// totalDays — 2026-09-26: not every Habit is daily (the frequency picker at
// mission creation already captures 'Каждый день' / 'Несколько раз в
// неделю' + which weekdays / 'По событию'), so "must have N reports" has to
// read N off that promise, not assume daily. Returns null when there's no
// fixed cadence to count against (trigger-based promises, or missions
// created before this field existed default to the old daily assumption).
function requiredReportsFor(m){
  if (!m || m.type !== 'Привычка' || !m.totalDays) return null;
  if (m.freq === 'Несколько раз в неделю' && m.freqDays && m.freqDays.length){
    return Math.max(1, Math.round(m.totalDays/7 * m.freqDays.length));
  }
  if (m.freq === 'По событию') return null; // no fixed cadence to count against — date-gated only
  return m.totalDays; // 'Каждый день', or no freq recorded (older mission) — daily assumption
}
function missionTrulyComplete(m){
  if (m && m.boostState && m.boostState.finish && m.boostState.finish.answer === 'kept') return true;
  if (!isMissionDue(m)) return false;
  if (m && m.type === 'Привычка'){
    const required = requiredReportsFor(m);
    if (required != null) return (m.reportCount||0) >= required;
  }
  return true;
}
// Human-readable "Пятница, 3 октября" / "Friday, October 3" for a date
// input's currently-picked value — the redesign (task #43) pairs this with
// the native <input type="date"> so the choice is legible at a glance
// instead of a bare, hard-to-read date field.
function formatDateHuman(dateStr){
  if (!dateStr) return '';
  const d = new Date(dateStr+'T00:00:00');
  if (isNaN(d.getTime())) return '';
  return new Intl.DateTimeFormat(state.lang==='en'?'en-US':'ru-RU', { weekday:'long', day:'numeric', month:'long' }).format(d);
}
// Shared "easy to read and choose" date picker (task #43): a big legible
// preview of the current pick, quick +week/+month/+3mo/+6mo/+year shortcut
// chips, and the native date input underneath for exact control. setterExpr
// is inlined JS that assigns the new value and re-renders, e.g.
// "state.result.deadline=DATE; syncR()" — DATE is replaced with the literal.
function dateQuickPicker(value, min, max, setterExpr, id){
  const presets = [
    {label:tr('+1 неделя','+1 week'), days:7},
    {label:tr('+1 месяц','+1 month'), days:30},
    {label:tr('+3 месяца','+3 months'), days:90},
    {label:tr('+6 месяцев','+6 months'), days:180},
    {label:tr('+1 год','+1 year'), days:365},
  ].filter(p => { const d = addDaysISO(p.days); return d >= min && d <= max; });
  // Presets/native input previously only ran the caller's setter (e.g.
  // "state.form.customDeadline=DATE; syncBasics()") — syncBasics/syncR/syncA
  // only toggle a button's disabled attribute, they never re-render, so the
  // state DID update on tap but the chip never visibly turned active and
  // the date-preview line never updated (bug report 2026-09-25). Every
  // other chip picker in the app (habit duration, mentor, etc.) calls
  // render() on click — do the same here.
  const mk = (dateLiteral) => setterExpr.split('DATE').join(`'${dateLiteral}'`) + '; render()';
  return `
    <div class="date-preview">${value ? formatDateHuman(value) : tr('Дата ещё не выбрана','No date picked yet')}</div>
    <div class="row-gap" style="margin:8px 0;">${presets.map(p=>chip(p.label, value===addDaysISO(p.days), `${mk(addDaysISO(p.days))}`)).join('')}</div>
    <input type="date" id="${id||''}" min="${min}" max="${max}" value="${value}" oninput="${setterExpr.split('DATE').join('this.value')}; render()" />
  `;
}

// Mission ticket as an image (1080×1350): Космонавт sends it to witnesses together with the video promise.
async function drawTicketCanvas(m){
  try { if (document.fonts && document.fonts.load) await Promise.all([document.fonts.load('italic 700 96px Oswald'), document.fonts.load('700 48px Montserrat'), document.fonts.load('500 30px "IBM Plex Mono"')]); } catch(e){}
  const W = 1080, tx = 60, ty = 290, tw = W-120;
  const mctx = document.createElement('canvas').getContext('2d');
  mctx.font = '700 52px Montserrat, sans-serif'; const lines = v2Wrap(mctx, tf(m.title||''), tw-96);
  mctx.font = '500 34px Montserrat, sans-serif'; const why = m.meaning ? v2Wrap(mctx, tr('Потому что ','Because ')+tf(m.meaning), tw-96).slice(0,3) : [];
  const bodyH = 290 + lines.length*64 + (why.length ? 20 + why.length*44 : 0);
  const th = bodyH + 60 + 200, H = ty + th + 150;
  const c = document.createElement('canvas'); c.width = W; c.height = H; const ctx = c.getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
  try { const lg = await v2LoadImg(LOGO_TAIL_URI); const lw = 300, lh = lw*287/638; ctx.drawImage(lg, (W-lw)/2, 70, lw, lh); } catch(e){}
  ctx.fillStyle = '#fff'; v2RR(ctx, tx, ty, tw, th, 56); ctx.fill();
  ctx.textBaseline = 'top'; ctx.textAlign = 'left';
  ctx.font = '500 28px "IBM Plex Mono", monospace';
  const lab = String(typeLabel(m.type)||'').toUpperCase(), pw = ctx.measureText(lab).width + 48;
  ctx.fillStyle = '#000'; v2RR(ctx, tx+48, ty+48, pw, 56, 28); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillText(lab, tx+72, ty+62);
  ctx.fillStyle = '#6b6b6b'; ctx.textAlign = 'right'; ctx.fillText(m.no ? '№ '+String(m.no).padStart(4,'0') : '', tx+tw-48, ty+62); ctx.textAlign = 'left';
  try { const yk = await v2LoadImg(v2BlackSvg(YASHIELD_URI)); ctx.drawImage(yk, tx+44, ty+150, 104, 104); } catch(e){}
  ctx.fillStyle = '#000'; ctx.font = 'italic 700 96px Oswald, "Arial Narrow", sans-serif'; ctx.fillText(v2Verb(m).toUpperCase(), tx+168, ty+150);
  ctx.font = '700 52px Montserrat, sans-serif'; lines.forEach((ln,k)=>ctx.fillText(ln, tx+48, ty+290+k*64));
  if (why.length){ ctx.fillStyle = '#6b6b6b'; ctx.font = '500 34px Montserrat, sans-serif'; why.forEach((ln,k)=>ctx.fillText(ln, tx+48, ty+290+lines.length*64+20+k*44)); }
  const ly = ty + bodyH + 60;
  ctx.strokeStyle = '#d0d0d0'; ctx.lineWidth = 3; ctx.setLineDash([14,12]); ctx.beginPath(); ctx.moveTo(tx+20, ly); ctx.lineTo(tx+tw-20, ly); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(tx, ly, 26, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(tx+tw, ly, 26, 0, Math.PI*2); ctx.fill();
  const col = (x, l, val) => { ctx.fillStyle = '#8c8c8c'; ctx.font = '500 26px "IBM Plex Mono", monospace'; ctx.fillText(l.toUpperCase(), x, ly+50); ctx.fillStyle = '#000'; ctx.font = '700 38px Montserrat, sans-serif'; ctx.fillText(val, x, ly+96); };
  const who = (state.profile.name && state.profile.name.trim()) || '';
  col(tx+48, tr('Финиш','Finish'), m.targetDate ? v2DateShort(m.targetDate) : '—');
  col(tx+48+300, tr('Наставник','Mentor'), mentorName(m.mentor || 'Космонавт'));
  if (who) col(tx+48+620, tr('Кто','Who'), who.slice(0,12));
  ctx.fillStyle = '#8c8c8c'; ctx.font = '500 28px "IBM Plex Mono", monospace'; ctx.textAlign = 'center'; ctx.fillText(tr('ТЯГА · СДЕЛАТЬ ЭТО','TYAGA · DO IT'), W/2, H-90); ctx.textAlign = 'left';
  return c;
}
async function ensureTicketImage(m){
  if (!m || m.ticketUrl || !sb) return m && m.ticketUrl;
  for (let i = 0; i < 12 && !m.dbId; i++) await new Promise(r=>setTimeout(r, 500));
  if (!m.dbId || m._ticketBusy) return null;
  m._ticketBusy = true;
  try {
    const c = await drawTicketCanvas(m);
    const blob = await new Promise(r=>c.toBlob(r, 'image/jpeg', 0.9));
    const name = `ticket_${TG_ID}_${m.no || Date.now()}_${Date.now()}.jpg`;
    const { error } = await sb.storage.from('avatars').upload(name, blob, { contentType:'image/jpeg' });
    if (error) throw error;
    const { data } = sb.storage.from('avatars').getPublicUrl(name);
    const url = data && data.publicUrl;
    if (url) { await sb.from('missions').update({ ticket_image_url: url }).eq('id', m.dbId); m.ticketUrl = url; }
    return url;
  } catch(e){ console.warn('ticket image failed', e); return null; }
  finally { m._ticketBusy = false; }
}

// safeRender() — use this instead of render() from any code that can fire on its
// own schedule (an async DB round-trip resolving, a setInterval tick, a setTimeout)
// rather than as the direct result of a user click. A bare render() does a full
// innerHTML replace of #view/#navbar, which destroys DOM node identity — if that
// happens while the user has a text <input>/<textarea> focused (e.g. mid-onboarding,
// or on a slow connection where a Supabase round-trip lands mid-typing), the field
// loses focus and further keystrokes go nowhere. safeRender defers the render until
// that field is blurred, instead of skipping it (which could leave stale UI).
function safeRender(){
  const el = document.activeElement;
  if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')) {
    el.addEventListener('blur', function onBlur(){
      el.removeEventListener('blur', onBlur);
      render();
    }, { once: true });
    return;
  }
  render();
}

const ATTR_KEY = 'tyaga_attr', TPL_KEY = 'tyaga_tpl';
const attrClean = (v, n) => String(v || '').replace(/[^a-zA-Z0-9_.-]/g, '').slice(0, n || 40);
(function captureAttribution(){
  try {
    const q = new URLSearchParams(location.search);
    const got = { src: attrClean(q.get('src')), c: attrClean(q.get('c'), 60), tpl: attrClean(q.get('tpl')).toLowerCase(), ref: attrClean(q.get('ref')) };
    let sp = '';
    try { sp = (window.Telegram && Telegram.WebApp && Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.start_param) || ''; } catch(e){}
    if (sp) String(sp).split('__').forEach(part => { const m = part.match(/^(src|c|tpl|ref)_(.+)$/); if (m && !got[m[1]]) got[m[1]] = attrClean(m[2], m[1]==='c' ? 60 : 40).toLowerCase(); });
    if (got.tpl) { try { localStorage.setItem(TPL_KEY, got.tpl); } catch(e){} }
    if (!got.src && !got.ref && !got.tpl) return;
    let have = null; try { have = JSON.parse(localStorage.getItem(ATTR_KEY) || 'null'); } catch(e){}
    if (!have && (got.src || got.ref)) {
      have = { src: got.src || null, c: got.c || null, ref: got.ref || null, tpl: got.tpl || null, landing: (location.pathname + location.search).slice(0, 200), first_seen: new Date().toISOString() };
      try { localStorage.setItem(ATTR_KEY, JSON.stringify(have)); } catch(e){}
    }
    window.__tyagaVisit = { src: got.src || null, c: got.c || null, ref: got.ref || null, tpl: got.tpl || null };
  } catch(e){}
})();

const TPL_KIND = { 'Привычка':'habit', 'Аскеза':'askeza', 'Результат':'result' };
async function applyPendingTemplate(){

  let t = null;
  try { const { data } = await sb.from('mission_templates').select('*').eq('code', code).maybeSingle(); t = data; } catch(e){}

    if (Array.isArray(t.freq_days)) state.form.freqDays = t.freq_days.slice();
    if (t.freq_event) state.form.freqEvent = t.freq_event;
  }
  if (t.finish && t.finish > todayISO()) {

    else { F.duration = k==='habit' ? { label:'', days:null, price:0, custom:true } : { label:'', days:null, custom:true }; F.customDeadline = t.finish; }
  } else if (t.days) {
    if (k==='result') { state.nm.durPick = t.days; F.deadline = addDaysISO(t.days); }
    else if (k==='habit') F.duration = TARIFFS.find(x=>x.days===t.days) || { label:{ru:t.days+' дней',en:t.days+' days'}, days:t.days, price:0 };
    else F.duration = { label: t.days+' '+dayWord(t.days), days:t.days, custom:false };
  }
  if (t.mentor && MENTORS_ENABLED.includes(t.mentor)) { const price = MENTORS_FREE.includes(t.mentor) ? 0 : mentorPriceFor(t.mentor); F.mentor = { name: t.mentor, price }; }
  if (Array.isArray(t.boosts)) {

}
const TRACK_Q = [];
let trackTimer = null;
function track(type, props, screen){
  try {
    if (TRACK_Q.length >= 200) TRACK_Q.shift();
    TRACK_Q.push({ type, screen: screen || (state && state.screen) || null, props: props || {}, at: new Date().toISOString(), session: TRACK_SESSION });
    if (TRACK_Q.length >= 20) flushTrack(); else if (!trackTimer) trackTimer = setTimeout(flushTrack, 5000);
  } catch (e) {}
}
function flushTrack(keepalive){
  clearTimeout(trackTimer); trackTimer = null;
  if (!TRACK_Q.length) return;
  if (!TG_AUTH.token) { trackTimer = setTimeout(flushTrack, 5000); return; }
  const batch = TRACK_Q.splice(0, 100);
  try {
    fetch(SUPABASE_URL + '/rest/v1/rpc/track_events', {
      method: 'POST', keepalive: !!keepalive,
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + TG_AUTH.token },
      body: JSON.stringify({ p_events: batch }),
    }).catch(() => {});
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { track('app_hide'); flushTrack(true); }
  else { track('app_show'); tgAuth(); }
});
function tyagaWrap(name, mk){
  try {
    const f = window[name];
    if (typeof f !== 'function') return;
    window[name] = function(){
      try { const ev = mk.apply(null, arguments); if (ev) track(ev[0], ev[1] || {}); } catch (e) {}
      return f.apply(this, arguments);
    };
  } catch (e) {}
}
