  try { if (ses) await webAuthCall('logout', { refresh: ses.refresh }); } catch (e) {}
  saveWebSession(null); try { localStorage.removeItem('tyaga_onboard_hint'); } catch (e) {} location.replace('/');
}
function webMoreRows(){
  if (IS_TG) return `<div class="card" style="cursor:pointer;" onclick="openWebVersion()">
      <div style="font-weight:600">${tr('Веб-версия ТЯГИ', 'TYAGA web version')}</div>
      <div class="hint" style="margin-top:4px">${tr('Код для входа, ссылка в браузер, почта для входа без Telegram', 'Sign-in code, browser link, email sign-in without Telegram')}</div>
    </div>`;
  let h = '';
  if (IS_DESKTOP_DEVICE) h += `<div class="card"><div style="margin-bottom:10px">${tr('Вид на компьютере', 'Layout on computer')}</div><div class="seg">
      <button class="btn ${layoutPref() !== 'mobile' ? 'primary' : 'ghost'} small" onclick="setLayout('desktop')">${tr('Полный', 'Full')}</button>
      <button class="btn ${layoutPref() === 'mobile' ? 'primary' : 'ghost'} small" onclick="setLayout('mobile')">${tr('Мобильный', 'Mobile')}</button></div></div>`;
  if (!IS_STANDALONE && !IS_DESKTOP_DEVICE) h += `<div class="card" style="cursor:pointer;" onclick="installApp()">${tr('Установить на главный экран', 'Add to home screen')}</div>`;
  h += `<div class="card" style="cursor:pointer;" onclick="webLogout()">${tr('Выйти из веб-версии', 'Sign out of web version')}</div>`;
  return h;
}
if (IS_WEB) {
  document.body.classList.add('web');
  if (IS_STANDALONE) document.body.classList.add('standalone');
  applyLayout();
  window.addEventListener('resize', applyLayout);
  window.addEventListener('hashchange', () => { if (/login=[a-f0-9]{64}/.test(location.hash)) location.reload(); });
  if (location.hostname === 'app.tyaga.tech') {
    const ml = document.createElement('link'); ml.rel = 'manifest'; ml.href = '/manifest.webmanifest'; document.head.appendChild(ml);
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
  const _webRender = render;
  render = function(){ _webRender(); const b = document.getElementById('webBack'); if (b) b.classList.toggle('on', !!(state.history && state.history.length)); };
}

try {
  const hint = JSON.parse(localStorage.getItem('tyaga_onboard_hint') || 'null');
  if (hint && state.onboard) {
    if (hint.name && !state.onboard.name) state.onboard.name = hint.name;
    if (hint.gender && !state.onboard.gender) state.onboard.gender = hint.gender;
    if (hint.age && !state.onboard.age) state.onboard.age = String(hint.age);
  }
} catch (e) {}
if (IS_WEB && !TG_ID) { state.screen = 'webLogin'; state.history = []; render(); }
else { render(); hydrateFromDB().then(() => resumePaidCheckout()).catch(() => {}); }
window.__tyagaBooted = true; try { var _nh = document.getElementById('tyagaNetHelp'); if (_nh) _nh.remove(); } catch (e) {}


/* ===== Telegram Mini App integration ===== */
(function(){
  const tg = window.Telegram && window.Telegram.WebApp;
  const FLOW_SCREENS_PREFIXES = ['habit','optimize','meaning','video','saving','mentor','boosts','summary','payment','ticket','typeSelect','r','a','quiz'];

  function isMidFlow(){
    const s = state.screen;
    if(['home','profile','illuminator','more','splash','tickets','merch','merchSuggest','confirm','rConfirm','aConfirm'].includes(s)) return false;
    return state.history && state.history.length>0;
  }

  function syncTelegramUI(){
    if(!tg) return;
    try{
      if(state.history && state.history.length>0){
        tg.BackButton.show();
      } else {
        tg.BackButton.hide();
      }
      if(isMidFlow()){
        tg.enableClosingConfirmation();
      } else {
        tg.disableClosingConfirmation();
      }
    }catch(e){ /* older client versions may lack an API */ }
  }

  if(typeof render === 'function'){
    const _origRender = render;
    render = function(){
      _origRender();
      syncTelegramUI();
    };
  }

  if(tg){
    try{
      tg.ready();
      tg.expand();
      tg.BackButton.onClick(function(){ back(); });
      tg.setHeaderColor && tg.setHeaderColor('#000000');
      tg.setBackgroundColor && tg.setBackgroundColor('#000000');

      const setVh = () => {
        const h = (tg.viewportStableHeight || tg.viewportHeight || window.innerHeight);
        document.documentElement.style.setProperty('--tg-vh', h + 'px');
      };
      setVh();
      tg.onEvent('viewportChanged', setVh);
      window.addEventListener('resize', setVh);

      // Light haptic feedback on primary actions, if supported.
      document.addEventListener('click', function(e){
        const t = e.target.closest && e.target.closest('.btn, .navbtn, .mission-card, .mentor-icon');
        if(t && tg.HapticFeedback){
          try{ tg.HapticFeedback.impactOccurred('light'); }catch(err){}
        }
      }, true);

      syncTelegramUI();
    }catch(e){
      console.warn('Telegram WebApp init issue', e);
    }
  } else {
    document.documentElement.style.setProperty('--tg-vh', window.innerHeight + 'px');
  }
})();

</script>
